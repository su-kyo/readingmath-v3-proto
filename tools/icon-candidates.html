<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<base href="../">
<title>icon-candidates — 연습장 지우개 · 전체 지우기 아이콘 후보</title>
<!-- =========================================================================
     icon-candidates.html — 연습장 도구의 Font Awesome 두 개를 무료 세트로 바꿀 후보 비교 (2026-10-16)

     왜 있나
       지우개 · 전체 지우기 아이콘은 테스트 서버의 Font Awesome Regular를 그대로 받아왔다(af24340).
       무료 아이콘 세트로 바꾸기로 했고(2026-10-16 사용자 결정), 세트는 사용자가 고른다.
       고르면 scripts/scratchpad.js 의 ICO_ERASER · ICO_TRASH 두 줄만 바꾸고 이 파일은 지운다.

     어떻게 보나
       줄마다 진짜 화면(type/quiz.html?scratch=1)을 iframe으로 열고 두 아이콘만 바꿔 끼운다.
       색 · 크기(18px) · 버튼은 화면 CSS 그대로다. 후보 SVG는 unpkg에서 그때그때 불러온다.
     ========================================================================= -->
<style>
  body { margin: 0; padding: 24px; background: #E4ECFB; font: 14px/1.5 Pretendard, system-ui, sans-serif; color: #121E37; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { margin: 0 0 20px; color: #586B8C; }
  .row { display: grid; grid-template-columns: 240px 600px; gap: 24px; align-items: center; padding: 14px 0; border-top: 1px solid #CBD7EE; }
  .name { font-weight: 700; }
  .name small { display: block; font-weight: 400; color: #586B8C; }
  .clip { width: 600px; height: 96px; overflow: hidden; border-radius: 12px; position: relative; background: #060E20; }
  .clip > div { width: 400px; height: 64px; transform: scale(1.5); transform-origin: 0 0; overflow: hidden; position: relative; }
  .clip iframe { position: absolute; left: -603px; top: -657px; width: 1280px; height: 720px; border: 0; pointer-events: none; }
  .meta { color: #3A466A; margin-top: 6px; font-size: 13px; }
  .meta b { color: #121E37; }
</style>
</head>
<body>
<h1>연습장 지우개 · 전체 지우기 아이콘 후보</h1>
<p class="lead">각 줄은 실제 유형 문제 화면의 연습장 도구 막대입니다(1.5배). 왼쪽부터 잉크 셋 · <b>지우개</b> · 되돌리기 · 다시하기 · <b>전체 지우기</b>. 바뀌는 것은 굵게 쓴 두 개뿐입니다.</p>
<div id="rows"></div>
<script>
  var CDN = 'https://unpkg.com/';
  var SETS = [
    { name: '지금 — Font Awesome', sub: 'Regular · eraser · trash-can', meta: '<b>교체 대상</b> · 면으로 채운 모양이라 옆의 되돌리기 · 다시하기(선 2px 남짓)와 결이 다르다' },
    { name: 'Lucide', sub: 'eraser · trash-2', meta: '<b>ISC</b>(MIT와 같은 수준, 저작권 표기만) · 24 격자 · 선 2 · 둥근 끝',
      eraser: 'lucide-static@0.460.0/icons/eraser.svg', trash: 'lucide-static@0.460.0/icons/trash-2.svg' },
    { name: 'Tabler', sub: 'outline · eraser · trash', meta: '<b>MIT</b> · 24 격자 · 선 2 · 둥근 끝',
      eraser: '@tabler/icons@3.19.0/icons/outline/eraser.svg', trash: '@tabler/icons@3.19.0/icons/outline/trash.svg' },
    { name: 'Phosphor', sub: 'Bold · eraser · trash', meta: '<b>MIT</b> · 256 격자 · 선 24(24 격자로 2.25) · 굵기 6단',
      eraser: '@phosphor-icons/core@2.1.1/assets/bold/eraser-bold.svg', trash: '@phosphor-icons/core@2.1.1/assets/bold/trash-bold.svg' },
    { name: 'Material Symbols', sub: 'Rounded 400 · ink_eraser · delete', meta: '<b>Apache 2.0</b> · 면 아이콘(선 아님) · 굵기 가변',
      eraser: '@material-symbols/svg-400@0.23.0/rounded/ink_eraser.svg', trash: '@material-symbols/svg-400@0.23.0/rounded/delete.svg' }
  ];

  function load(path) {
    return fetch(CDN + path).then(function (r) { return r.text(); }).then(function (t) {
      var svg = new DOMParser().parseFromString(t, 'image/svg+xml').documentElement;
      svg.removeAttribute('width'); svg.removeAttribute('height'); svg.removeAttribute('class');
      if (!svg.getAttribute('stroke') && !svg.getAttribute('fill')) svg.setAttribute('fill', 'currentColor');
      svg.setAttribute('aria-hidden', 'true');
      return svg.outerHTML;
    });
  }

  function swap(frame, set) {
    if (!set.eraser) return;
    Promise.all([load(set.eraser), load(set.trash)]).then(function (svgs) {
      (function wait() {
        var d = frame.contentDocument;
        var e = d && d.querySelector('[data-tool="eraser"]'), c = d && d.querySelector('[data-tool="clear"]');
        if (!e || !c) return setTimeout(wait, 150);
        e.innerHTML = svgs[0]; c.innerHTML = svgs[1];
      })();
    });
  }

  var rows = document.getElementById('rows');
  SETS.forEach(function (set) {
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div><div class="name">' + set.name + '<small>' + set.sub + '</small></div>' +
      '<div class="meta">' + set.meta + '</div></div>' +
      '<div class="clip"><div><iframe src="type/quiz.html?scratch=1" loading="eager"></iframe></div></div>';
    rows.appendChild(row);
    swap(row.querySelector('iframe'), set);
  });
</script>
</body>
</html>
