<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>행성 홈 32화면 검수 — 리딩수학과학</title>
  <link rel="stylesheet" href="styles/tokens.css?v=24" />
  <link rel="stylesheet" href="styles/base.css?v=7" />
  <style>
    /* 배포 제외(.vercelignore) — 32학기 홈을 한눈에 보는 내부 검수용 페이지 */
    body{ font-family:var(--font-sans); background:var(--bg); color:var(--text); margin:0; padding:26px 30px 60px; }
    h1{ font-size:21px; font-weight:800; letter-spacing:-.02em; margin:0 0 5px; }
    .lead{ font-size:13.5px; color:var(--text-dim); line-height:1.65; margin:0 0 8px; }
    .bar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:16px 0 4px; }
    .seg{ display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); padding:4px; border-radius:11px; }
    .seg button{ border:0; background:transparent; color:var(--text-dim); font-family:inherit; font-size:13.5px;
      font-weight:700; padding:7px 15px; border-radius:8px; cursor:pointer; }
    .seg button.is-on{ background:var(--primary); color:var(--n-000); }
    .note{ font-size:12.5px; color:var(--text-dim); }

    h2{ font-size:15px; font-weight:800; margin:28px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--border); }
    .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
    figure{ margin:0; }
    .frame{ position:relative; width:100%; aspect-ratio:4 / 3; border-radius:9px; overflow:hidden;
      border:1px solid var(--border); background:var(--surface-2); }
    .frame iframe{ position:absolute; top:0; left:0; width:1024px; height:768px; border:0;
      transform-origin:0 0; pointer-events:none; }
    figcaption{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; margin-top:7px; }
    figcaption a{ color:var(--text); text-decoration:none; }
    figcaption a:hover{ text-decoration:underline; }
    .flag{ font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:5px;
      background:var(--surface-3); color:var(--text-dim); }
    .flag--char{ background:color-mix(in srgb, var(--blue-400) 22%, transparent); color:var(--blue-200); }
  </style>
</head>
<body>
  <h1>행성 홈 32화면 검수</h1>
  <p class="lead">학기 16종 × 과목 2종. 좌표는 과목당 한 벌로 고정돼 있고 그림만 학기별로 바뀝니다.<br>
    썸네일을 누르면 그 학기 홈이 새 탭에서 원본 크기로 열립니다.</p>

  <div class="bar">
    <div class="seg" id="seg">
      <button data-r="4/3" class="is-on">4:3</button>
      <button data-r="16/9">16:9</button>
      <button data-r="21/9">21:9</button>
    </div>
    <span class="note">비율을 바꾸면 배경이 어떻게 잘리는지 확인할 수 있습니다.</span>
  </div>

  <div id="host"></div>

  <script>
    var SEMS = [
      ['elem-3-1','초등 3-1'],['elem-3-2','초등 3-2'],['elem-4-1','초등 4-1'],['elem-4-2','초등 4-2'],
      ['elem-5-1','초등 5-1'],['elem-5-2','초등 5-2'],['elem-6-1','초등 6-1'],['elem-6-2','초등 6-2'],
      ['mid-1-1','중등 1-1'],['mid-1-2','중등 1-2'],['mid-2-1','중등 2-1'],['mid-2-2','중등 2-2'],
      ['mid-3-1','중등 3-1'],['mid-3-2','중등 3-2'],['high-1-1','고등 1-1'],['high-1-2','고등 1-2']
    ];
    var HAS_CHAR = { 'math-elem-3-1':1,'math-mid-3-1':1,'math-mid-3-2':1,
                     'sci-elem-3-1':1,'sci-mid-3-1':1,'sci-mid-3-2':1 };
    var host = document.getElementById('host');

    [{ q:'math', name:'수학', pre:'math' }, { q:'science', name:'과학', pre:'sci' }].forEach(function(subj){
      var h = document.createElement('h2'); h.textContent = subj.name + ' — 16학기'; host.appendChild(h);
      var g = document.createElement('div'); g.className = 'grid'; host.appendChild(g);
      SEMS.forEach(function(s){
        var url = 'nav/home.html?subject=' + subj.q + '&sem=' + s[0];
        var key = subj.pre + '-' + s[0];
        var fig = document.createElement('figure');
        fig.innerHTML =
          '<div class="frame"><iframe loading="lazy" src="' + url + '" title="' + subj.name + ' ' + s[1] + '"></iframe></div>'
          + '<figcaption><a href="' + url + '" target="_blank">' + s[1] + '</a>'
          + (HAS_CHAR[key] ? '<span class="flag flag--char">캐릭터</span>' : '<span class="flag">캐릭터 없음</span>')
          + '</figcaption>';
        g.appendChild(fig);
      });
    });

    /* 썸네일 폭에 맞춰 1024px 화면을 축소한다 */
    function fit(){
      document.querySelectorAll('.frame').forEach(function(f){
        f.querySelector('iframe').style.transform = 'scale(' + (f.clientWidth / 1024) + ')';
      });
    }
    document.getElementById('seg').addEventListener('click', function(e){
      var b = e.target.closest('button[data-r]'); if(!b) return;
      this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('is-on', x === b); });
      document.querySelectorAll('.frame').forEach(function(f){ f.style.aspectRatio = b.dataset.r; });
      requestAnimationFrame(fit);
    });
    addEventListener('resize', fit);
    addEventListener('load', fit);
    fit();
  </script>
</body>
</html>
