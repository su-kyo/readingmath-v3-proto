<!DOCTYPE html>
<!-- [시안 · Phase 7-6] ④ 유틸 재출발 — 흰 바탕 확정안 (단일 방향).
     앞선 「토스풍 3안 + 종이색 6후보」는 폐기됨. 사용자 결정: 흰 바탕에 깔끔하게.
     확정 전제:
       · 폭은 화면 성격별 — 목록·상세 860px 좁은 칼럼, 결제만 2단
       · 라이트 전용 · 번호 열 제거(데이터는 남기고 화면에서만 숨김)
     방향: 「흰 종이 · 선 하나 · 굵은 타이포」
       · 카드·그림자 없음. 위계는 여백과 글자 크기 차이가 전부 담당
       · 색은 적게 쓰되 나타날 땐 진하게 — 050 틴트 금지, 500/600 solid
       · 회색 면은 결제 주문 요약 하나뿐 (돈이 걸린 자리를 유일한 면으로)
     확정되면 styles/util.css로 옮기고 이 파일은 지운다. -->
<html lang="ko" data-section="util" data-theme="light">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유틸 재출발 — 흰 바탕 확정안</title>
<link rel="stylesheet" href="styles/tokens.css?v=25">
<link rel="stylesheet" href="styles/base.css?v=10">
<link rel="stylesheet" href="styles/gnb.css?v=9">
<style>
/* ======================= 검수 셸 (다크) ======================= */
html,body{ height:auto; }
body{ margin:0; padding:0 0 70px; background:var(--n-950); color:var(--n-000);
  font-family:var(--font-sans); letter-spacing:-.02em; }
.pg{ max-width:1400px; margin:0 auto; padding:24px 20px 0; }
.pg__ttl{ font-size:24px; font-weight:800; letter-spacing:-.04em; margin:0; }
.pg__sub{ font-size:13.5px; color:var(--n-300); margin:8px 0 0; line-height:1.8; }
.pg__sub b{ color:var(--blue-300); font-weight:700; }
.ctl{ position:sticky; top:0; z-index:60; background:rgba(3,6,15,.95); backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,.08); margin-top:16px; padding:11px 0; }
.ctl__in{ max-width:1400px; margin:0 auto; padding:0 20px; display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; }
.grp{ display:flex; align-items:center; gap:6px; }
.grp__lab{ font-size:11.5px; font-weight:700; color:var(--n-350); margin-right:2px; white-space:nowrap; }
.grp button{ height:32px; padding:0 12px; border-radius:9px; border:1px solid var(--n-500);
  background:var(--n-800); color:var(--n-200); font-family:inherit; font-size:12.5px; font-weight:700;
  cursor:pointer; transition:var(--t-fast); white-space:nowrap; }
.grp button:hover{ background:var(--n-600); color:var(--n-000); }
.grp button.is-on{ background:var(--blue-450); border-color:var(--blue-450); color:#fff; }
.note{ max-width:1400px; margin:14px auto 0; padding:0 20px; font-size:12.5px; color:var(--n-300); line-height:1.8; }
.note b{ color:var(--n-000); }
.stagebox{ margin:18px auto 0; width:1320px; max-width:calc(100% - 40px); }
.ustage{ width:1280px; height:880px; display:flex; flex-direction:column; overflow:hidden;
  border-radius:12px; box-shadow:0 30px 70px -34px #000; }
.ustage .gnb{ flex:none; }

/* =====================================================================
   ▼▼▼ 확정안 CSS — 여기가 그대로 styles/util.css가 된다 ▼▼▼
   전부 tokens.css 변수만 참조. raw hex 없음.
   ===================================================================== */
.ustage{
  --paper:var(--n-000);      /* 종이 = 흰색. 면을 쌓지 않는다 */
  --rule:var(--n-100);       /* 유일한 구분 장치 — 헤어라인 */
  --rule-2:var(--n-200);     /* 강한 선 (입력·구획) */
  --inset:var(--n-050);      /* 회색 면은 결제 요약 한 곳뿐 */
  --wash:var(--blue-050);    /* 행 호버 */
  --ink:var(--n-650);        /* 본문 · 흰 배경 14.6 */
  --ink-2:var(--n-500);      /* 보조 · 9.3 */
  --ink-3:var(--n-400);      /* 메타 · 5.4 */
  --brand:var(--blue-500);
  --brand-ink:var(--blue-600);
  --accent-ev:var(--amber-600);   /* 이벤트 — 앰버는 잉크로만 (흰 글자 불가) */
  --dot-ev:var(--amber-300);
  --cta:var(--primary);           /* 450 IDENTITY · 라벨 ≥19px w700 */
  --ok:var(--ok-ink); --danger:var(--no-ink); --danger-tint:var(--no-tint);
  background:var(--paper); color:var(--ink);
  font-family:var(--font-sans); letter-spacing:-.03em; -webkit-font-smoothing:antialiased;
}

/* ---- 셸 ---- */
.u2-main{ flex:1; min-height:0; overflow-y:auto; }
.u2-main::-webkit-scrollbar{ width:11px; }
.u2-main::-webkit-scrollbar-thumb{ background:var(--n-200); border-radius:99px; border:4px solid var(--paper); }
.u2-wrap{ max-width:860px; margin:0 auto; padding:56px 40px 96px; }
.u2-wrap--wide{ max-width:1160px; }

/* ---- 등장 모션: 로드 한 번, 계단식 ---- */
@keyframes u2rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
.u2-rise{ animation:u2rise .42s cubic-bezier(.2,.75,.3,1) both; }

/* ---- 페이지 머리 ---- */
.u2-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:28px;
  padding-bottom:26px; margin-bottom:0; border-bottom:1.5px solid var(--ink); }
.u2-head__l{ min-width:0; }
.u2-head__t{ font-size:40px; font-weight:800; letter-spacing:-.06em; line-height:1.05; color:var(--ink); }
.u2-head__sub{ margin-top:12px; font-size:15px; font-weight:500; color:var(--ink-3); line-height:1.55; letter-spacing:-.025em; }

/* ---- 필터 (먹색 알약 — 흰 바탕의 유일한 어두운 컨트롤) ---- */
.u2-seg{ display:inline-flex; gap:6px; flex:none; padding-bottom:2px; }
.u2-seg button{ height:36px; padding:0 15px; border:0; border-radius:99px; cursor:pointer;
  background:transparent; color:var(--ink-3); font-family:inherit; font-size:14px; font-weight:700;
  letter-spacing:-.03em; transition:var(--t-fast); }
.u2-seg button:hover{ background:var(--n-050); color:var(--ink); }
.u2-seg button.is-on{ background:var(--ink); color:var(--paper); }
.u2-seg__n{ margin-left:6px; font-size:12.5px; font-weight:700; opacity:.6; font-variant-numeric:tabular-nums; }

/* ---- 목록: 카드 없음. 선과 여백만 ---- */
.u2-list{ margin:0; }
.u2-row{ display:flex; align-items:center; gap:22px; width:100%; text-align:left; cursor:pointer;
  background:transparent; border:0; font-family:inherit; color:inherit; position:relative;
  padding:24px 20px; margin:0 -20px; border-radius:16px; transition:background var(--t-fast); }
.u2-row::before{ content:""; position:absolute; left:20px; right:20px; bottom:0; height:1px; background:var(--rule); }
.u2-row:last-child::before{ background:var(--rule); }
.u2-row:hover{ background:var(--wash); }
.u2-row:hover::before{ background:transparent; }

.u2-row__main{ flex:1; min-width:0; display:block; }
.u2-row__ttl{ font-size:17.5px; font-weight:700; letter-spacing:-.04em; color:var(--ink); line-height:1.42;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  transition:color var(--t-fast); }
.u2-row:hover .u2-row__ttl{ color:var(--brand-ink); }
.u2-row__meta{ margin-top:7px; display:flex; align-items:center; gap:9px;
  font-size:13px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.u2-row__meta i{ width:3px; height:3px; border-radius:99px; background:var(--n-200); flex:none; }

/* 카테고리 = 점 + 색 글자. 칩·틴트 없음 */
.u2-cat{ display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--brand-ink); flex:none; }
.u2-cat::before{ content:""; width:6px; height:6px; border-radius:99px; background:var(--brand); }
.u2-cat.is-event{ color:var(--accent-ev); }
.u2-cat.is-event::before{ background:var(--dot-ev); }

.u2-new{ display:inline-flex; align-items:center; justify-content:center; margin-left:8px; height:20px; min-width:20px;
  padding:0 6px; border-radius:99px; background:var(--brand); color:var(--n-000);
  font-size:10.5px; font-weight:800; letter-spacing:0; vertical-align:2px; }
.u2-row__chev{ width:20px; height:20px; flex:none; color:var(--n-200); transition:var(--t-fast); }
.u2-row:hover .u2-row__chev{ color:var(--brand); transform:translateX(3px); }
.u2-row__ext{ display:flex; align-items:center; gap:7px; flex:none; font-size:13px; font-weight:700;
  color:var(--ink-3); transition:var(--t-fast); }
.u2-row__ext svg{ width:16px; height:16px; }
.u2-row:hover .u2-row__ext{ color:var(--brand-ink); }

/* ---- 부가 상태: 면 없이 여백으로 ---- */
.u2-state{ padding:112px 20px 96px; text-align:center; }
.u2-state__ico{ width:52px; height:52px; margin:0 auto 22px; color:var(--n-200); }
.u2-state__ico svg{ width:52px; height:52px; }
.u2-state__ico.is-warn{ color:var(--danger); }
.u2-state__t{ font-size:19px; font-weight:800; color:var(--ink); letter-spacing:-.045em; }
.u2-state__d{ margin-top:10px; font-size:14.5px; font-weight:500; color:var(--ink-3); line-height:1.7; }
.u2-state .u2-btn{ margin-top:24px; }

@keyframes u2sk{ 0%,100%{ opacity:.45 } 50%{ opacity:1 } }
.u2-sk{ background:var(--n-100); border-radius:6px; animation:u2sk 1.25s ease-in-out infinite; }
.u2-skrow{ display:flex; align-items:center; gap:22px; padding:24px 20px; margin:0 -20px; position:relative; }
.u2-skrow::before{ content:""; position:absolute; left:20px; right:20px; bottom:0; height:1px; background:var(--rule); }

/* ---- 페이지네이션 ---- */
.u2-pager{ display:flex; align-items:center; justify-content:center; gap:4px; margin-top:36px; }
.u2-pager button{ min-width:36px; height:36px; padding:0 8px; border-radius:10px; border:0; background:transparent;
  color:var(--ink-3); font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  display:grid; place-items:center; transition:var(--t-fast); font-variant-numeric:tabular-nums; }
.u2-pager button:hover{ background:var(--n-050); color:var(--ink); }
.u2-pager button.is-on{ background:var(--ink); color:var(--paper); }
.u2-pager button:disabled{ opacity:.28; cursor:default; background:transparent; }
.u2-pager svg{ width:18px; height:18px; }

/* ---- 버튼 (선 하나 · 채움 없음) ---- */
.u2-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:46px; padding:0 20px;
  border-radius:13px; border:0; background:transparent; color:var(--ink);
  box-shadow:inset 0 0 0 1.5px var(--rule-2); font-family:inherit; font-size:15px; font-weight:700;
  letter-spacing:-.035em; cursor:pointer; transition:var(--t-fast); white-space:nowrap; }
.u2-btn:hover{ box-shadow:inset 0 0 0 1.5px var(--brand); color:var(--brand-ink); background:var(--wash); }
.u2-btn svg{ width:17px; height:17px; }
.u2-btn--sm{ height:38px; padding:0 14px; font-size:13.5px; border-radius:11px; }
.u2-btn--ghost{ box-shadow:none; color:var(--ink-2); }
.u2-btn--ghost:hover{ box-shadow:none; }
.u2-btn:disabled{ opacity:.35; cursor:not-allowed; }
.u2-btn:disabled:hover{ box-shadow:inset 0 0 0 1.5px var(--rule-2); color:var(--ink); background:transparent; }
/* CTA = 유일한 채움 버튼. 정체성 칠면(450) · 라벨 19px w800 */
.u2-btn--cta{ height:60px; width:100%; border-radius:16px; background:var(--cta); color:var(--n-000);
  box-shadow:none; font-size:19px; font-weight:800; letter-spacing:-.04em; }
.u2-btn--cta:hover{ background:var(--primary-hover); color:var(--n-000); box-shadow:none; }
.u2-btn--cta:active{ background:var(--primary-pressed); }
.u2-btn--cta:disabled{ background:var(--n-100); color:var(--n-400); opacity:1; }
.u2-btn--cta:disabled:hover{ background:var(--n-100); color:var(--n-400); box-shadow:none; }

/* ---- 상세 ---- */
.u2-crumb{ display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px 0 8px; margin-bottom:26px;
  border-radius:99px; background:transparent; color:var(--ink-3); font-size:13.5px; font-weight:700;
  letter-spacing:-.03em; cursor:pointer; border:0; font-family:inherit; transition:var(--t-fast); }
.u2-crumb:hover{ background:var(--n-050); color:var(--brand-ink); }
.u2-crumb svg{ width:16px; height:16px; }
.u2-doc__cat{ display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--brand-ink); }
.u2-doc__cat::before{ content:""; width:6px; height:6px; border-radius:99px; background:var(--brand); }
.u2-doc__cat.is-event{ color:var(--accent-ev); } .u2-doc__cat.is-event::before{ background:var(--dot-ev); }
.u2-doc__ttl{ margin-top:15px; font-size:33px; font-weight:800; letter-spacing:-.055em; line-height:1.24; color:var(--ink); }
.u2-doc__date{ margin-top:14px; font-size:13.5px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.u2-doc__hr{ height:1.5px; background:var(--ink); margin:26px 0 34px; }
.u2-doc__body{ font-size:16.5px; line-height:1.9; color:var(--ink-2); font-weight:500; letter-spacing:-.028em; }
.u2-doc__body p{ margin:0 0 19px; } .u2-doc__body p:last-child{ margin-bottom:0; }
.u2-doc__body b{ color:var(--ink); font-weight:700; }
.u2-doc__body h3{ font-size:19px; font-weight:800; color:var(--ink); margin:38px 0 14px; letter-spacing:-.045em; }
.u2-doc__body ul{ margin:0 0 19px; padding:0; list-style:none; }
.u2-doc__body li{ position:relative; margin:10px 0; padding-left:22px; }
.u2-doc__body li::before{ content:""; position:absolute; left:4px; top:13px; width:5px; height:5px;
  border-radius:99px; background:var(--brand); }
.u2-file{ display:flex; align-items:center; gap:14px; margin-top:40px; padding-top:22px; border-top:1px solid var(--rule); }
.u2-file__ico{ width:38px; height:38px; flex:none; display:grid; place-items:center; color:var(--ink-3);
  border-radius:11px; box-shadow:inset 0 0 0 1.5px var(--rule); }
.u2-file__ico svg{ width:19px; height:19px; }
.u2-file__nm{ flex:1; min-width:0; display:block; font-size:14.5px; font-weight:700; color:var(--ink); letter-spacing:-.035em; }
.u2-file__sz{ display:block; margin-top:3px; font-size:12.5px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.u2-docfoot{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-top:44px; padding-top:24px; border-top:1px solid var(--rule); }

/* ---- 결제 — UX 재구성판 ----------------------------------------------
   결정 순서를 ① 무엇을 ② 얼마나 ③ 어떻게로 나누고, 각 단계가 끝나면
   오른쪽 요약이 즉시 채워진다. 빨강은 「문제」에만 쓰고, 할인·절약은 초록.
   -------------------------------------------------------------------- */
.u2-cols{ display:grid; grid-template-columns:1fr 364px; gap:60px; align-items:start; margin-top:38px; }
.u2-side{ position:sticky; top:0; }

/* 단계 머리 */
.u2-step{ display:flex; align-items:baseline; gap:13px; margin:52px 0 4px; }
.u2-step:first-child{ margin-top:0; }
.u2-step__n{ font-size:12px; font-weight:800; color:var(--ink-3); letter-spacing:.14em;
  font-variant-numeric:tabular-nums; flex:none; }
.u2-step__t{ font-size:21px; font-weight:800; letter-spacing:-.05em; color:var(--ink); flex:none; }
.u2-step__line{ flex:1; height:1px; background:var(--rule); }
.u2-step__hint{ font-size:13px; font-weight:600; color:var(--ink-3); flex:none; letter-spacing:-.02em; }

/* 선택 행 (과목·기간·결제수단 공용) */
.u2-opt{ display:flex; align-items:center; gap:16px; width:100%; text-align:left;
  padding:20px 16px; margin:0 -16px; border:0; background:transparent; font-family:inherit; color:inherit;
  cursor:pointer; border-radius:14px; position:relative; transition:background var(--t-fast); }
.u2-opt::before{ content:""; position:absolute; left:16px; right:16px; bottom:0; height:1px; background:var(--rule); }
.u2-opt:hover{ background:var(--n-050); }
.u2-opt.is-sel{ background:var(--wash); }
.u2-opt:hover::before, .u2-opt.is-sel::before{ background:transparent; }
.u2-radio{ width:22px; height:22px; border-radius:99px; flex:none; display:grid; place-items:center;
  box-shadow:inset 0 0 0 1.8px var(--rule-2); transition:var(--t-fast); }
.u2-opt.is-sel .u2-radio{ box-shadow:inset 0 0 0 7px var(--brand); }
.u2-opt__main{ flex:1; min-width:0; display:block; }
.u2-opt__top{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.u2-opt__nm{ font-size:17px; font-weight:800; letter-spacing:-.045em; }
.u2-opt__sub{ display:block; margin-top:4px; font-size:13px; font-weight:600; color:var(--ink-3); letter-spacing:-.025em; }
.u2-opt__right{ display:block; text-align:right; flex:none; }
.u2-opt > svg{ width:23px; height:23px; flex:none; color:var(--ink-3); }

/* 값어치 배지 — 초록(이득) / 먹(중립). 빨강은 쓰지 않는다 */
.u2-badge{ display:inline-flex; align-items:center; height:21px; padding:0 8px; border-radius:99px;
  font-size:11.5px; font-weight:800; letter-spacing:-.02em; flex:none;
  background:var(--ok-tint); color:var(--ok); }
.u2-badge--ink{ background:var(--n-050); color:var(--ink-2); }

/* 기간 행 — 월 환산가를 주 가격으로 승격 */
.u2-mo{ display:block; font-size:21px; font-weight:800; letter-spacing:-.05em; font-variant-numeric:tabular-nums; line-height:1.1; }
.u2-mo small{ font-size:13px; font-weight:700; color:var(--ink-3); margin-left:2px; letter-spacing:-.03em; }
.u2-sumline{ display:block; margin-top:5px; font-size:12.5px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.u2-sumline s{ color:var(--n-300); text-decoration-thickness:1px; }

/* 선택 직후 펼쳐지는 확인 줄 */
.u2-confirm{ display:flex; align-items:center; gap:8px; margin:0 -16px; padding:12px 16px 14px;
  font-size:13px; font-weight:700; color:var(--brand-ink); letter-spacing:-.03em;
  background:var(--wash); border-radius:0 0 14px 14px; margin-top:-14px; }
.u2-confirm svg{ width:15px; height:15px; flex:none; }

/* 포함 항목 */
.u2-ben{ list-style:none; margin:20px 0 0; padding:0; }
.u2-ben li{ display:flex; gap:11px; align-items:flex-start; padding:8px 0; font-size:14.5px; font-weight:500;
  color:var(--ink-2); line-height:1.6; letter-spacing:-.028em; }
.u2-ben li b{ color:var(--ink); font-weight:700; }
.u2-ben svg{ width:17px; height:17px; flex:none; margin-top:3px; color:var(--ok); }

/* 가상계좌 안내 */
.u2-inline-note{ display:flex; gap:9px; margin:14px 0 0; padding:13px 15px; border-radius:12px;
  background:var(--n-050); font-size:13px; font-weight:600; color:var(--ink-2); line-height:1.6; letter-spacing:-.028em; }
.u2-inline-note svg{ width:16px; height:16px; flex:none; margin-top:1px; color:var(--ink-3); }

/* ── 오른쪽: 화면에서 유일한 회색 면 ── */
.u2-sum{ background:var(--inset); border-radius:22px; padding:24px 22px 22px; }
.u2-sum__hd{ font-size:12px; font-weight:800; color:var(--ink-3); letter-spacing:.12em; }

  notice:'<b>공지 목록.</b> 번호 열을 뺀 자리에 제목이 왼쪽 끝으로 붙었다. 카테고리는 <b>알약이 아니라 점 + 색 글자</b> — 흰 바탕에서 틴트 알약을 쓰면 그 자리만 회색으로 뜬다. 정렬은 등록일 최신순.',
  detail:'<b>공지 상세.</b> 제목 33px. 본문은 16.5px / 행간 1.9로 읽기에 맞췄다. 첨부는 상자 대신 <b>선 위의 한 줄</b>.',
  report:'<b>월간보고서.</b> 「학습 기간」·「등록일」 둘 다 유지. 「새 창에서 열기」는 상시 표시(태블릿에는 호버가 없다).',
  pay:'<b>이용권 결제 — 원본 구조를 버리고 다시 짰다.</b> ① 무엇을 → ② 얼마나 → ③ 어떻게 세 단계로 나누고, 비교축을 <b>월 환산가</b>로 승격했다(총액은 보조). 통합권은 <b>따로 살 때보다 얼마나 아끼는지</b>를 숫자로 보여 준다. 기간을 고르면 <b>이용 종료일</b>이 바로 펼쳐지고, 쿠폰 입력은 기본으로 접혀 있다. <b>빨강은 오류에만</b> 쓰고 할인·절약은 초록. CTA에 금액을 얹어 「무엇을 얼마에 사는지」를 마지막까지 붙들어 둔다.'
};

var S='notice', ST='base';
var pay = { subj:'math', plan:null, method:'card', cpOpen:false };
var screenEl = document.getElementById('screen');

function rise(i){ return ' class="u2-rise" style="animation-delay:'+(40+i*32)+'ms"'; }

function rowNotice(d,i){
  var ev = d.cat==='이벤트' ? ' is-event' : '';
  return '<button class="u2-row u2-rise" style="animation-delay:'+(60+i*34)+'ms">'
    +'<span class="u2-row__main">'
      +'<span class="u2-row__ttl">'+d.title+(d.isNew?'<span class="u2-new">N</span>':'')+'</span>'
      +'<span class="u2-row__meta"><span class="u2-cat'+ev+'">'+d.cat+'</span><i></i>'+d.date+'</span>'
    +'</span>'+I.chev+'</button>';
}
function rowReport(d,i){
  var y=d.term.slice(0,4), m=parseInt(d.term.slice(5,7),10);
  return '<button class="u2-row u2-rise" style="animation-delay:'+(60+i*34)+'ms">'
    +'<span class="u2-row__main">'
      +'<span class="u2-row__ttl">'+y+'년 '+m+'월 학습 리포트'+(d.isNew?'<span class="u2-new">N</span>':'')+'</span>'
      +'<span class="u2-row__meta">학습 기간 '+d.term+'<i></i>등록 '+d.reg+'</span>'
    +'</span><span class="u2-row__ext">'+I.ext+'새 창에서 열기</span></button>';
}
function skeleton(n){
  var h=''; for(var i=0;i<n;i++){
    h+='<div class="u2-skrow"><div style="flex:1">'
      +'<div class="u2-sk" style="height:16px;width:'+(50+(i*11)%36)+'%"></div>'
      +'<div class="u2-sk" style="height:11px;width:'+(22+(i*7)%16)+'%;margin-top:11px"></div></div></div>';
  }
  return '<div class="u2-list">'+h+'</div>';
}
function stateBox(ico,t,d,btn,warn){
  return '<div class="u2-state u2-rise"><div class="u2-state__ico'+(warn?' is-warn':'')+'">'+ico+'</div>'
    +'<div class="u2-state__t">'+t+'</div><div class="u2-state__d">'+d+'</div>'
    +(btn?'<button class="u2-btn">'+btn+'</button>':'')+'</div>';
}
function pager(n,cur){
  var h='<div class="u2-pager u2-rise" style="animation-delay:340ms"><button disabled>'+I.back+'</button>';
  for(var i=1;i<=n;i++) h+='<button class="'+(i===cur?'is-on':'')+'">'+i+'</button>';
  return h+'<button>'+I.next+'</button></div>';
}

function screenNotice(){
  var all = NOTICE.slice().sort(function(a,b){ return a.date<b.date?1:-1; });
  var cN=all.filter(function(d){return d.cat==='공지';}).length, cE=all.length-cN;
  var body, pg='';
  if(ST==='loading') body = skeleton(6);
  else if(ST==='empty') body = stateBox(I.empty,'아직 등록된 공지가 없어요.','새 소식이 올라오면 여기에서 바로 알려 드릴게요.');
  else if(ST==='nofilter') body = stateBox(I.empty,'이벤트 글이 없어요.','다른 분류를 골라 보세요.','전체 보기');
  else if(ST==='error') body = stateBox(I.cloud,'공지를 불러오지 못했어요.','잠시 후 다시 시도해 주세요. 계속 안 되면 도움말로 문의해 주세요.','다시 시도',true);
  else {
    var arr = ST==='long' ? [LONG].concat(all.slice(0,5)) : (ST==='many' ? all : all.slice(0,6));
    body = '<div class="u2-list">'+arr.map(rowNotice).join('')+'</div>';
    pg = ST==='many' ? pager(7,1) : pager(2,1);
  }
  var seg = '<div class="u2-seg">'
    +'<button class="'+(ST==='nofilter'?'':'is-on')+'">전체<span class="u2-seg__n">'+all.length+'</span></button>'
    +'<button>공지<span class="u2-seg__n">'+cN+'</span></button>'
    +'<button class="'+(ST==='nofilter'?'is-on':'')+'">이벤트<span class="u2-seg__n">'+(ST==='nofilter'?0:cE)+'</span></button></div>';
  return '<div class="u2-wrap"><div class="u2-head u2-rise"><div class="u2-head__l">'
    +'<div class="u2-head__t">공지사항</div>'
    +'<div class="u2-head__sub">리딩수학과학의 새 소식과 서비스 안내를 확인하세요.</div></div>'
    +seg+'</div>'+body+pg+'</div>';
}

function screenReport(){
  var body, pg='';
  if(ST==='loading') body = skeleton(5);
  else if(ST==='empty') body = stateBox(I.chart,'아직 받은 리포트가 없어요.','한 달치 학습이 쌓이면 다음 달 1일에 첫 리포트를 보내 드려요.');
  else if(ST==='error') body = stateBox(I.cloud,'리포트를 불러오지 못했어요.','잠시 후 다시 시도해 주세요.','다시 시도',true);
  else {
    var arr = ST==='many' ? REPORT.concat(REPORT).concat(REPORT.slice(0,2)) : REPORT;
    body = '<div class="u2-list">'+arr.map(rowReport).join('')+'</div>';
    if(ST==='many') pg = pager(4,1);
  }
  return '<div class="u2-wrap"><div class="u2-head u2-rise"><div class="u2-head__l">'
    +'<div class="u2-head__t">월간보고서</div>'
    +'<div class="u2-head__sub">매달 학습 현황과 성취를 정리한 리포트예요. 리포트는 새 창에서 열립니다.</div></div></div>'
    +body+pg+'</div>';
}

function screenDetail(){
  var ev = DOC.cat==='이벤트'?' is-event':'';
  var file = (ST==='nofile') ? '' :
    '<div class="u2-file"><span class="u2-file__ico">'+I.file+'</span>'
    +'<span class="u2-file__nm">'+DOC.file+'<span class="u2-file__sz">PDF · '+DOC.size+'</span></span>'
    +'<button class="u2-btn u2-btn--sm">'+I.down+'내려받기</button></div>';
  return '<div class="u2-wrap">'
    +'<button class="u2-crumb u2-rise">'+I.back+'공지사항</button>'
    +'<div class="u2-rise" style="animation-delay:60ms"><span class="u2-doc__cat'+ev+'">'+DOC.cat+'</span>'
    +'<div class="u2-doc__ttl">'+DOC.title+'</div>'
    +'<div class="u2-doc__date">'+DOC.date+'</div>'
    +'<div class="u2-doc__hr"></div></div>'
    +'<div class="u2-doc__body u2-rise" style="animation-delay:130ms">'+DOC.body+'</div>'
    +file
    +'<div class="u2-docfoot"><button class="u2-btn u2-btn--ghost"'+(ST==='first'?' disabled':'')+'>'+I.back+'이전 글</button>'
    +'<button class="u2-btn u2-btn--ghost">다음 글'+I.next+'</button></div></div>';
}

function screenPay(){
  var plans = PLANS[pay.subj];
  var forced = (ST==='picked'||ST==='couponbad'||ST==='couponok'||ST==='noagree'||ST==='paying');
  var picked = forced ? (pay.plan===null?2:pay.plan) : pay.plan;
  var p = picked!==null ? plans[picked] : null;
  var coupon = (ST==='couponok') ? 10000 : 0;
  var agreed = (ST==='couponok'||ST==='paying');
  var cpOpen = pay.cpOpen || ST==='couponbad' || ST==='couponok';
  var basis = picked===null ? 3 : picked;   // 통합 절약액 기준 = 고른 기간(미선택이면 12개월)

  /* ── ① 과목 — 무엇을 배울까. 가격 하한과 통합 이득을 여기서 보여 준다 ── */
  var subjRows = Object.keys(SUBJ).map(function(k){
    var lo = PLANS[k][3].mo;                                   // 12개월 기준 월 최저가
    // 같은 행에 보이는 월 가격끼리의 차액이라 근거가 눈앞에 있다 (50,000+47,000 vs 83,000)
    var save = (PLANS.math[basis].mo + PLANS.science[basis].mo) - PLANS.both[basis].mo;
    var badge = (k==='both')
      ? '<span class="u2-badge">따로 살 때보다 월 '+won(save)+' 아낌</span>' : '';
    return '<button class="u2-opt'+(pay.subj===k?' is-sel':'')+'" data-subj="'+k+'">'
      +'<span class="u2-radio"></span>'
      +'<span class="u2-opt__main"><span class="u2-opt__top"><span class="u2-opt__nm">'+SUBJ[k]+'</span>'+badge+'</span>'
      +'<span class="u2-opt__sub">'+SUBJ_DESC[k]+'</span></span>'
      +'<span class="u2-opt__right"><span class="u2-mo">'+won(lo)+'<small>/월~</small></span></span></button>';
  }).join('');
  var ben = BEN[pay.subj].map(function(t){ return '<li>'+I.check+'<span>'+t+'</span></li>'; }).join('');

  /* ── ② 기간 — 월 환산가를 주 가격으로, 총액·정가는 보조로 ── */
  var maxOff = Math.max.apply(null, plans.map(function(x){ return x.off; }));
  var planHtml = plans.map(function(pl,i){
    var badges = '';
    if(pl.off>0) badges += '<span class="u2-badge">'+pl.off+'% 아낌</span>';
    if(pl.off===maxOff && pl.off>0) badges += '<span class="u2-badge--ink u2-badge">최대 할인</span>';
    var confirm = (picked===i)
      ? '<div class="u2-confirm">'+I.cal+'오늘 결제하면 <b style="margin:0 1px 0 3px">'+endDate(pl.days)+'</b>까지 이용해요</div>' : '';
    return '<button class="u2-opt'+(picked===i?' is-sel':'')+'" data-plan="'+i+'">'
      +'<span class="u2-radio"></span>'
      +'<span class="u2-opt__main"><span class="u2-opt__top"><span class="u2-opt__nm">'+pl.nm+'</span>'+badges+'</span>'
      +'<span class="u2-opt__sub">'+pl.days+' 이용</span></span>'
      +'<span class="u2-opt__right"><span class="u2-mo">'+won(pl.mo)+'<small>/월</small></span>'
      +'<span class="u2-sumline">'+(pl.off>0?'<s>'+won(pl.list)+'</s> → ':'')+'총 '+won(pl.price)+'</span>'
      +'</span></button>'+confirm;
  }).join('');

  /* ── ③ 결제 방법 ── */
  var vbankNote = pay.method==='vbank'
    ? '<div class="u2-inline-note">'+I.info+'<span>결제하기를 누르면 <b>입금 전용 계좌</b>와 입금 기한을 안내드려요. 기한 안에 입금해야 이용권이 열립니다.</span></div>' : '';

  /* ── 금액 ── */
  var planOff = p ? (p.list - p.price) : 0;
  var total = p ? Math.max(0, p.price - coupon) : 0;
  var saved = planOff + coupon;

  var cpMsg = '';
  if(ST==='couponbad') cpMsg = '<div class="u2-cp__msg is-bad">'+I.bang+'사용할 수 없는 쿠폰이에요. 번호를 다시 확인해 주세요.</div>';
  if(ST==='couponok')  cpMsg = '<div class="u2-cp__msg is-ok">'+I.check+'웰컴 쿠폰이 적용됐어요.</div>';
  var cpBlock = cpOpen
    ? '<div class="u2-cp"><input class="u2-field'+(ST==='couponbad'?' is-bad':'')+'" placeholder="쿠폰 번호"'
      +' value="'+(ST==='couponbad'?'WELCOME-2025':(ST==='couponok'?'WELCOME-2026':''))+'">'
      +'<button class="u2-cp__btn">적용</button></div>'+cpMsg
    : '<button class="u2-cpToggle" id="cpToggle">쿠폰이 있어요</button>';

  /* ── 남은 할 일 한 줄 (CTA 바로 위) ── */
  var todo = '';
  if(picked===null) todo = '<div class="u2-todo">'+I.arrowUp+'이용 기간을 골라 주세요</div>';
  else if(ST==='noagree') todo = '<div class="u2-todo is-bad">'+I.bang+'결제 및 환불 규정에 동의해 주세요</div>';
  var ctaLabel = ST==='paying' ? '결제창을 여는 중…' : (p ? won(total)+' 결제하기' : '결제하기');
  var ctaDis = (picked===null || ST==='noagree' || ST==='paying') ? ' disabled' : '';

  return '<div class="u2-wrap u2-wrap--wide">'
    +'<div class="u2-head u2-rise"><div class="u2-head__l"><div class="u2-head__t">이용권 결제</div>'
    +'<div class="u2-head__sub">과목과 기간을 고르면 오른쪽에서 금액이 바로 확정돼요.</div></div></div>'

    +'<div class="u2-cols"><div class="u2-rise" style="animation-delay:70ms">'

      +'<div class="u2-step"><span class="u2-step__n">01</span><span class="u2-step__t">무엇을 배울까요</span>'
      +'<span class="u2-step__line"></span><span class="u2-step__hint">언제든 바꿀 수 있어요</span></div>'
      +'<div id="subjList">'+subjRows+'</div>'
      +'<ul class="u2-ben">'+ben+'</ul>'

      +'<div class="u2-step"><span class="u2-step__n">02</span><span class="u2-step__t">얼마나 이용할까요</span>'
      +'<span class="u2-step__line"></span><span class="u2-step__hint">길수록 월 부담이 줄어요</span></div>'
      +'<div id="planList">'+planHtml+'</div>'

      +'<div class="u2-step"><span class="u2-step__n">03</span><span class="u2-step__t">어떻게 결제할까요</span>'
      +'<span class="u2-step__line"></span></div>'
      +'<div id="methodList">'
        +'<button class="u2-opt'+(pay.method==='card'?' is-sel':'')+'" data-m="card"><span class="u2-radio"></span>'
        +'<span class="u2-opt__main"><span class="u2-opt__top"><span class="u2-opt__nm" style="font-size:16px">신용카드</span></span>'
        +'<span class="u2-opt__sub">결제 즉시 이용권이 열려요</span></span>'+I.card+'</button>'
        +'<button class="u2-opt'+(pay.method==='vbank'?' is-sel':'')+'" data-m="vbank"><span class="u2-radio"></span>'
        +'<span class="u2-opt__main"><span class="u2-opt__top"><span class="u2-opt__nm" style="font-size:16px">가상계좌 입금</span></span>'
        +'<span class="u2-opt__sub">입금이 확인되면 이용권이 열려요</span></span>'+I.bank+'</button>'
      +'</div>'+vbankNote

    +'</div>'

    +'<aside class="u2-side u2-rise" style="animation-delay:140ms"><div class="u2-sum">'
      +'<div class="u2-sum__hd">주문 요약</div>'
      +(p
        ? '<div class="u2-sum__what">'+SUBJ[pay.subj]+' · '+p.nm+'</div>'
          +'<div class="u2-sum__when">'+today()+' ~ '+endDate(p.days)+' ('+p.days+')</div>'
        : '<div class="u2-sum__what is-ph">'+SUBJ[pay.subj]+' · 기간을 고르면 여기에 표시돼요</div>')
      +'<div class="u2-sum__rows">'
        +'<div class="u2-sum__r"><span class="u2-sum__k">정가</span><span class="u2-sum__v is-cut">'+(p?won(p.list):'—')+'</span></div>'
        +'<div class="u2-sum__r"><span class="u2-sum__k">기간 할인</span><span class="u2-sum__v is-cut">'+(planOff>0?'-'+won(planOff):'—')+'</span></div>'
        +'<div class="u2-sum__r"><span class="u2-sum__k">쿠폰 할인</span><span class="u2-sum__v is-cut">'+(coupon>0?'-'+won(coupon):'—')+'</span></div>'
        +'<div class="u2-sum__r"><span class="u2-sum__k">결제 방법</span><span class="u2-sum__v">'+(pay.method==='card'?'신용카드':'가상계좌')+'</span></div>'
      +'</div>'
      +cpBlock
      +'<div class="u2-total"><div class="u2-total__row"><span class="u2-total__k">총 결제금액</span>'
      +'<span class="u2-total__v'+(p?' is-changed':'')+'">'+won(total)+'</span></div>'
      +(saved>0?'<div class="u2-total__save"><span class="u2-badge">'+won(saved)+' 아꼈어요</span></div>':'')+'</div>'
      +'<label class="u2-agree'+(ST==='noagree'?' is-bad':'')+'"><input type="checkbox"'+(agreed?' checked':'')+'>'
      +'<span class="u2-agree__box">'+I.check+'</span>'
      +'<span class="u2-agree__t">결제 및 환불 규정에 동의합니다 <a href="#" onclick="return false">전문 보기</a></span></label>'
      +todo
      +'<button class="u2-btn u2-btn--cta"'+ctaDis+'>'+ctaLabel+'</button>'
      +'<div class="u2-assure">'+I.shield+'<span>결제 후 <b>3~5일 이내</b> 학습 매니저가 배정되고, 첫 상담 일정을 문자로 안내드려요.</span></div>'
      +'<div class="u2-refund">환불은 이용 이력에 따라 규정이 적용됩니다. 자세한 내용은 고객센터로 안내드려요.</div>'
    +'</div></aside></div></div>';
}

function render(){
  screenEl.innerHTML = S==='notice'?screenNotice() : S==='report'?screenReport() : S==='detail'?screenDetail() : screenPay();
  screenEl.scrollTop = 0;
  document.getElementById('note').innerHTML = NOTES[S];
  if(S==='pay'){
    document.getElementById('subjList').addEventListener('click', function(e){
      var b=e.target.closest('[data-subj]'); if(!b) return; pay.subj=b.dataset.subj; render(); });
    document.getElementById('planList').addEventListener('click', function(e){
      var b=e.target.closest('[data-plan]'); if(!b) return; pay.plan=parseInt(b.dataset.plan,10);
      if(ST==='base') ST='picked'; syncStates(); render(); });
    document.getElementById('methodList').addEventListener('click', function(e){
      var b=e.target.closest('[data-m]'); if(!b) return; pay.method=b.dataset.m; render(); });
    var cp=document.getElementById('cpToggle');
    if(cp) cp.addEventListener('click', function(){ pay.cpOpen=true; render(); });
  }
}
function syncStates(){
  var host=document.getElementById('gState');
  host.innerHTML='<span class="grp__lab">상태</span>';
  STATES[S].forEach(function(pair){
    var b=document.createElement('button'); b.textContent=pair[1]; b.dataset.st=pair[0];
    if(pair[0]===ST) b.className='is-on';
    b.addEventListener('click', function(){ ST=pair[0]; syncStates(); render(); });
    host.appendChild(b);
  });
}
document.getElementById('gScr').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return; S=b.dataset.s; ST=STATES[S][0][0];
  Array.prototype.forEach.call(this.querySelectorAll('button'), function(c){ c.classList.toggle('is-on', c===b); });
  syncStates(); render();
});
syncStates(); render();
})();
</script>
<script src="scripts/gnb-drawer.js?v=7"></script>
</body>
</html>
