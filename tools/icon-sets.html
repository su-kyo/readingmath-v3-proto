<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<base href="../">
<title>icon-sets — 지금 · Lucide · Tabler 화면 비교</title>
<!-- =========================================================================
     icon-sets.html — 아이콘 세트 시안 비교판 (2026-10-16)

     같은 화면을 세 벌로 연다. 지금(이 폴더) · Lucide(.wt-lucide/, 갈래 icons-lucide) · Tabler(.wt-tabler/, 갈래 icons-tabler).
     두 시안은 tools/icon-swap.py 로 만들었다. 세트를 고르면 그 갈래를 합치고, 다른 갈래 · .wt-* · 이 파일은 지운다.
     화면 안은 눌러 볼 수 있다(서랍 · 연습장 · 다음 문제 등).
     ========================================================================= -->
<style>
  body { margin: 0; padding: 16px 20px 40px; background: #E4ECFB; font: 14px/1.5 Pretendard, system-ui, sans-serif; color: #121E37; }
  .top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 17px; margin: 0; }
  select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #A0B0CD; background: #fff; }
  .hint { color: #586B8C; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .cap { font-weight: 700; margin: 0 0 6px; }
  .cap small { font-weight: 400; color: #586B8C; margin-left: 6px; }
  .box { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; background: #060E20; }
  .box iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; border: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<div class="top">
  <h1>아이콘 세트 비교</h1>
  <select id="pick"></select>
  <span class="hint">화면 안을 눌러 볼 수 있습니다 — 서랍(메뉴) · 연습장 · 다음 문제 등</span>
</div>
<div class="grid" id="grid"></div>
<script>
  var SCREENS = [
    ['type/quiz.html', '유형 문제 — 콘솔바 · 마지막 문제의 제출하기'],
    ['type/quiz.html?scratch=1', '유형 문제 — 연습장 도구'],
    ['concept/drill-math.html', '개념 다지기 — 채점하기 ↔ 다음 문제'],
    ['concept/learn-sci.html', '개념 학습 — 콘솔바 · 영상 · 글자'],
    ['concept/organize-math.html', '개념 정리 — 요약 노트'],
    ['type/review.html', '유형 해설 — 결과보기'],
    ['shared/training-result.html', '훈련 결과 — 오답노트 · 홈으로'],
    ['essay/drill-math.html', '서술형 다지기'],
    ['essay/report.html', '서술형 보고서 — 인쇄 · 저장'],
    ['nav/home.html', '행성 홈 — GNB · 서랍'],
    ['nav/curriculum.html', '커리큘럼 — 잠금 · 훈련 안내'],
    ['nav/bridge.html', '과목 고르기 — 로그아웃'],
    ['assignment/home.html', '과제 센터'],
    ['assignment/solve.html', '과제 풀이 — 제출하기'],
    ['assignment/result.html', '과제 결과'],
    ['exam/home.html', '시험 대비 홈'],
    ['exam/solve.html', '시험 풀이'],
    ['util/notice.html', '공지 목록'],
    ['util/history.html', '학습 기록 — 달력'],
    ['util/payment.html', '이용권 결제'],
    ['util/report.html', '월간 보고서']
  ];
  var SETS = [['', '지금', 'Font Awesome · 피그마 아이콘 섞임'], ['.wt-lucide/', 'Lucide', 'ISC · 선 2'], ['.wt-tabler/', 'Tabler', 'MIT · 선 2']];

  var pick = document.getElementById('pick'), grid = document.getElementById('grid');
  SCREENS.forEach(function (s, i) { var o = document.createElement('option'); o.value = i; o.textContent = s[1]; pick.appendChild(o); });
  try { pick.value = localStorage.getItem('icon-sets-pick') || 0; } catch (e) {}

  var frames = SETS.map(function (set) {
    var col = document.createElement('div');
    col.innerHTML = '<p class="cap">' + set[1] + '<small>' + set[2] + '</small></p><div class="box"><iframe></iframe></div>';
    grid.appendChild(col);
    return col.querySelector('iframe');
  });
  function fit() { frames.forEach(function (f) { f.style.transform = 'scale(' + (f.parentNode.clientWidth / 1280) + ')'; }); }
  window.addEventListener('resize', fit);

  // 한 벌씩 차례로 연다 — 한꺼번에 열면 로컬 서버가 파일을 떨어뜨릴 때가 있다
  function load() {
    var path = SCREENS[pick.value][0];
    try { localStorage.setItem('icon-sets-pick', pick.value); } catch (e) {}
    (function next(i) {
      if (i >= frames.length) return;
      frames[i].addEventListener('load', function () { next(i + 1); }, { once: true });
      frames[i].src = SETS[i][0] + path;
    })(0);
    fit();
  }
  pick.addEventListener('change', load);
  load();
</script>
</body>
</html>
