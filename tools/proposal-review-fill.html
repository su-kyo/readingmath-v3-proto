<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 — 유형 오답 해설 박스 면</title>
<!-- =========================================================================
     2026-10-15 시안 — 결론이 나면 지운다 (CLAUDE.md 「tools/ 정리 규칙」).
     액자 하나하나가 실제 type/review.html(오답 문제)이고, 해설 박스(.explain) 규칙만 덮어 그린다.
     화면 파일은 건드리지 않는다.
     ========================================================================= -->
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  body { margin: 0; background: var(--n-100); color: var(--n-650); font-family: var(--font-sans); letter-spacing: var(--tracking); }
  main { max-width: 1400px; margin: 0 auto; padding: var(--sp-32) var(--sp-24) 80px; }
  h1 { font-size: var(--fs-26); margin: 0 0 var(--sp-8); }
  .lead { font-size: var(--fs-15); color: var(--n-500); margin: 0 0 var(--sp-32); line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-24); }
  @media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .card { min-width: 0; background: var(--n-000); border-radius: var(--r-16); padding: var(--sp-16); }
  .card__hd { display: flex; align-items: baseline; gap: var(--sp-8); margin-bottom: var(--sp-12); }
  .k { font-family: var(--font-mono); font-weight: var(--fw-bold); color: var(--n-000); background: var(--n-650); border-radius: var(--r-8); padding: 2px var(--sp-8); }
  .t { font-weight: var(--fw-heavy); font-size: var(--fs-17, 17px); }
  .d { font-size: var(--fs-13); color: var(--n-400); margin: var(--sp-8) 0 0; line-height: 1.55; }
  .box { position: relative; width: 100%; aspect-ratio: 1280 / 800; overflow: hidden; border-radius: var(--r-8); box-shadow: inset 0 0 0 1px var(--n-200); }
  .box iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; }
</style>
</head>
<body><main>
  <h1>시안 — 유형 오답 해설 박스 면</h1>
  <p class="lead">지금은 면 없이 왼쪽 4px 틸 띠입니다(0). 띠 대신 옅은 면을 넣은 거친 안 셋입니다. 가르는 축은 <b>면의 색</b>(회색 / 계열 틸)과 <b>띠를 남기나</b>입니다.<br>
  라이트 기준입니다. 액자 안은 실제 화면이라 눌러 볼 수 있습니다.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
  var CASES = [
    { k: '0', t: '지금 — 면 없음 · 왼쪽 틸 띠', d: '10-14 컬러 정리 결과 (RM-SURF-03).', css: '' },
    { k: 'A', t: '옅은 회색 면 · 띠 없음', d: '--surface-2 (n-050). 해설이 「따로 놓인 상자」로 읽힌다. 색을 흰색에 섞지 않아 RM-SURF-01과 부딪치지 않는다.',
      css: '.explain{background:var(--surface-2);box-shadow:none;border-radius:var(--r-12)}' },
    { k: 'B', t: '옅은 틸 면 · 띠 없음', d: '--th-tint (틸 8%). 유형 계열 색이 돈다. 흰 바탕에서 쑥색으로 기울 수 있다(10-14에 RM-SURF-01로 막았던 방향).',
      css: '.explain{background:var(--th-tint);box-shadow:none;border-radius:var(--r-12)}' },
    { k: 'C', t: '옅은 회색 면 + 띠 유지', d: 'A에 지금의 띠를 남긴 안. 「해설」 표시가 가장 강하다.',
      css: '.explain{background:var(--surface-2);border-radius:var(--r-4) var(--r-12) var(--r-12) var(--r-4)}' }
  ];
  var grid = document.getElementById('grid');
  CASES.forEach(function (c) {
    var card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<div class="card__hd"><span class="k">' + c.k + '</span><span class="t">' + c.t + '</span></div>' +
      '<div class="box"><iframe src="../type/review.html?pv=' + c.k + '"></iframe></div><p class="d">' + c.d + '</p>';
    grid.appendChild(card);
    var f = card.querySelector('iframe'), box = card.querySelector('.box');
    function fit() { f.style.transform = 'scale(' + (box.clientWidth / 1280) + ')'; }
    window.addEventListener('resize', fit); fit();
    f.addEventListener('load', function () {
      var d = f.contentDocument;
      d.documentElement.setAttribute('data-theme', 'light');
      var s = d.createElement('style'); s.textContent = c.css; d.head.appendChild(s);
      var dot = d.querySelectorAll('.progress-cap .pcirc.is-wrong')[0];   /* 첫 오답 문제로 */
      if (dot) dot.click();
    });
  });
</script>
</body></html>
