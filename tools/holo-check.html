<!DOCTYPE html>
<html lang="ko" data-section="space">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홀로그램 톤 생존 검사 — 흰 홀로그램(1안)</title>
<link rel="stylesheet" href="styles/tokens.css?v=25">
<link rel="stylesheet" href="styles/base.css?v=10">
<style>
  /* ── 페이지 골격 (검수 도구 — 배포 제외) ─────────────────── */
  body{ margin:0; padding:26px 20px 90px; background:var(--n-900);
    font-family:var(--font-sans); color:var(--n-000); }
  .page{ max-width:1000px; margin:0 auto; }
  .page__ttl{ font-size:var(--fs-h1); font-weight:var(--fw-heavy); letter-spacing:-0.03em; margin:0; }
  .page__sub{ font-size:var(--fs-sm); color:var(--n-300); margin:6px 0 16px; line-height:1.7; }
  .ctl{ position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:8px;
    padding:10px 0; margin-bottom:6px; background:var(--n-900); flex-wrap:wrap; }
  .ctl__lab{ font-size:var(--fs-sm); font-weight:var(--fw-bold); color:var(--n-300); margin-right:2px; }
  .ctl__btn{ height:36px; padding:0 14px; border-radius:var(--r-md);
    border:1px solid var(--n-500); background:var(--n-700); color:var(--n-000);
    font-family:var(--font-sans); font-size:var(--fs-sm); font-weight:var(--fw-bold);
    cursor:pointer; transition:background var(--t-fast); }
  .ctl__btn:hover{ background:var(--n-600); }
  .ctl__btn.is-on{ background:var(--primary); border-color:var(--primary); }
  .ctl__sep{ width:1px; height:24px; background:var(--n-600); margin:0 6px; }

  .tile{ margin:30px 0 0; }
  .tile__hd{ display:flex; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .tile__cat{ font-size:12px; font-weight:800; letter-spacing:.02em; padding:3px 9px;
    border-radius:var(--r-full); background:var(--n-600); color:var(--n-000); }
  .tile__name{ font-size:var(--fs-h2); font-weight:var(--fw-heavy); letter-spacing:-0.02em; }
  .tile__meta{ font-size:12.5px; color:var(--n-300); font-variant-numeric:tabular-nums; }
  .tile__note{ font-size:12.5px; color:var(--n-300); margin-left:auto; }

  /* ── 무대 (nav/home.html 축소 모형) ── */
  .stage{ position:relative; border-radius:var(--r-xl); overflow:hidden;
    background:var(--blue-300) center 46%/cover no-repeat; }
  .obj{ position:absolute; transform:translate(-50%,-50%); aspect-ratio:1; }
  .obj__img{ position:absolute; inset:0; background:center/contain no-repeat; }
  .obj--float{ animation:rm-float 4.8s ease-in-out infinite; }
  @keyframes rm-float{
    0%,100%{ transform:translate(-50%,-50%) translateY(0); }
    50%    { transform:translate(-50%,-50%) translateY(-13px); }
  }
  .hero{ position:absolute; left:50%; top:62.7%; width:31.25%; transform:translate(-50%,-50%); z-index:10; }
  .hero.is-nochar{ top:70%; width:auto; }
  .hero.is-nochar .char, .hero.is-nochar .shadow, .hero.is-nochar .bubble::after{ display:none; }
  .hero.is-nochar .bubble{ position:static; transform:none; margin:0; }
  .hero .char{ width:100%; display:block; filter:drop-shadow(0 16px 18px rgba(15,35,80,.4)); }
  .hero .shadow{ position:absolute; left:50%; bottom:-4%; transform:translateX(-50%);
    width:74%; height:8%; border-radius:50%; z-index:-1;
    background:radial-gradient(50% 50% at 50% 50%, rgba(20,40,90,.34), transparent 70%); }
  .bubble{ position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:12px;
    width:max-content; max-width:380px; background:var(--n-000); color:var(--n-650);
    border-radius:15px; padding:10px 16px; font-size:12.5px; font-weight:600; line-height:1.5;
    text-align:center; box-shadow:0 12px 30px -12px rgba(10,25,60,.55); }
  .bubble b{ color:var(--blue-600); font-weight:800; }
  .bubble::after{ content:""; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
    border:10px solid transparent; border-top-color:var(--n-000); border-bottom:0; }

  /* ══ 완료 = 실물 ══ */
  .obj.is-done{ filter:drop-shadow(0 12px 16px rgba(20,40,90,.26)); }

  /* ══ 미완료 = 홀로그램 ══════════════════════════════════════
     빗금은 「덧그린 흰 줄」이 아니라 「몸체에 난 투명한 틈」이다.
     흰 몸체 위에 흰 줄을 그으면 안 보이기 때문 — 마스크로 알파를 깎는다.
     그래서 어떤 배경 위에서도 같은 방식으로 읽힌다. */
  @keyframes scanUp{ from{ -webkit-mask-position:0 0; mask-position:0 0; }
                     to  { -webkit-mask-position:0 -72px; mask-position:0 -72px; } }

  /* 밝은 배경 보완 — screen 블렌드는 「더하기」라 어두운 색이 무효다.
     그래서 배경과 홀로그램 사이에 블렌드되지 않는 옅은 그늘을 한 겹 깐다.
     어두운 학기에선 배경에 묻혀 보이지 않고, 밝은 학기에서만 일한다. */
  .m-white .obj:not(.is-done)::after{
    content:""; position:absolute; inset:0; z-index:-1;
    -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat;
    background:rgba(10,25,60,.22); filter:blur(7px); transform:translateY(7px);
  }

  /* ── 1안 — 흰 빛 홀로그램 (확정 후보) ──────────────────────
     핵심은 「흰색을 칠한다」가 아니라 「빛을 더한다」다(mix-blend-mode:screen).
     더하기라서 결과가 배경 색을 먹는다 — 파란 학기에선 푸르게, 주황 학기에선
     주황빛으로 빛난다. 학기별 색 지정이 0인데도 32배경 전부와 어울리는 이유.
     상태 구분은 색이 아니라 형태가 맡는다: 흰 윤곽선 + 스캔라인 + 글로우. */
  .m-white .obj:not(.is-done) .obj__img{
    filter:grayscale(1) brightness(1.5) contrast(.45)
      drop-shadow(1.5px 0 0 rgba(255,255,255,.95)) drop-shadow(-1.5px 0 0 rgba(255,255,255,.95))
      drop-shadow(0 1.5px 0 rgba(255,255,255,.95)) drop-shadow(0 -1.5px 0 rgba(255,255,255,.95))
      drop-shadow(0 0 10px rgba(255,255,255,.6));
    mix-blend-mode:screen;
    -webkit-mask:repeating-linear-gradient(0deg,
      rgba(0,0,0,.9) 0 3px, rgba(0,0,0,.26) 3px 6px) 0 0/100% 72px;
    mask:repeating-linear-gradient(0deg,
      rgba(0,0,0,.9) 0 3px, rgba(0,0,0,.26) 3px 6px) 0 0/100% 72px;
    animation:scanUp 3.4s linear infinite;
  }

  /* 비교용 A — 흰색을 「칠한」 경우 (블렌드 없음).
     난색 배경에서 회색 돌처럼 보이는 것을 확인하는 대조군. */
  .m-flat .obj:not(.is-done) .obj__img{
    filter:grayscale(1) brightness(1.9) contrast(.42) opacity(.80)
           drop-shadow(0 0 13px rgba(255,255,255,.6))
           drop-shadow(0 6px 14px rgba(10,25,60,.34));
    -webkit-mask:repeating-linear-gradient(0deg,
      rgba(0,0,0,1) 0 4px, rgba(0,0,0,.42) 4px 6px) 0 0/100% 72px;
    mask:repeating-linear-gradient(0deg,
      rgba(0,0,0,1) 0 4px, rgba(0,0,0,.42) 4px 6px) 0 0/100% 72px;
    animation:scanUp 3.4s linear infinite;
  }

  /* 비교용 B — 지난 회차의 시안색 홀로그램 */
  .m-cyan .obj:not(.is-done) .obj__img{
    filter:grayscale(1) brightness(1.45) sepia(1) hue-rotate(155deg) saturate(2.6) opacity(.8)
           drop-shadow(0 0 16px rgba(24,209,252,.55));
    -webkit-mask:repeating-linear-gradient(0deg,
      rgba(0,0,0,1) 0 4px, rgba(0,0,0,.45) 4px 6px) 0 0/100% 72px;
    mask:repeating-linear-gradient(0deg,
      rgba(0,0,0,1) 0 4px, rgba(0,0,0,.45) 4px 6px) 0 0/100% 72px;
    animation:scanUp 3.4s linear infinite;
  }
  .is-nomotion .obj__img{ animation:none !important; }
  .is-nomotion .obj--float{ animation:none !important; }

  /* ══ 명판 — hover / 탭했을 때만 ═══════════════════════════ */
  .plaque{ position:absolute; left:50%; top:calc(100% + 2%); transform:translateX(-50%) translateY(3px);
    display:flex; align-items:center; gap:7px; width:max-content; max-width:230px;
    background:var(--n-000); color:var(--n-650); border-radius:var(--r-full);
    padding:5px 12px; font-size:12px; font-weight:700; line-height:1.35;
    box-shadow:0 8px 20px -8px rgba(10,25,60,.5); white-space:nowrap; z-index:20;
    opacity:0; pointer-events:none; transition:opacity .12s, transform .12s; }
  .obj:not(.is-done):hover .plaque,
  .obj:not(.is-done).is-peek .plaque{ opacity:1; transform:translateX(-50%) translateY(0); }
  .plaque__segs{ display:flex; gap:3px; }
  .plaque__segs i{ width:10px; height:5px; border-radius:var(--r-full); background:var(--n-200); }
  .plaque__segs i.on{ background:var(--blue-500); }
  .obj:not(.is-done){ cursor:pointer; }
  /* 명판은 .obj 안에 있고 .obj는 transform 때문에 각자 겹침 층을 이룬다 —
     그래서 명판만 z-index를 올려선 옆 오브젝트에 가린다. .obj 자체를 올려야 한다. */
  .obj:not(.is-done):hover, .obj:not(.is-done).is-peek{ z-index:15; }
  .is-allplaque .obj:not(.is-done) .plaque{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="page">
  <h1 class="page__ttl">홀로그램 톤 생존 검사 — 흰 홀로그램(1안)</h1>
  <p class="page__sub">
    32배경의 평균 휘도·색상을 실제로 재서 <b>가장 극단인 학기들</b>을 골랐다.
    여기서 다 버티면 32학기 전부 이 한 벌로 간다(학기별 색 관리 없음).<br>
    1안은 흰색을 <b>칠하는</b> 것이 아니라 <b>빛을 더하는</b> 방식이라, 결과가 배경 색을 먹는다 —
    파란 학기에선 푸르게, 주황 학기에선 주황빛으로 빛난다. 학기별 색 지정은 여전히 0이다.
    「흰색 칠(대조군)」을 눌러 난색 배경에서 어떻게 달라지는지 비교할 수 있다.
    <b>명판은 오브젝트에 올리거나 탭했을 때만</b> 뜬다.
  </p>

  <div class="ctl">
    <span class="ctl__lab">홀로그램</span>
    <button class="ctl__btn is-on" data-mode="white">흰 빛 (1안 · 블렌드)</button>
    <button class="ctl__btn" data-mode="flat">흰색 칠 (대조군)</button>
    <button class="ctl__btn" data-mode="cyan">시안색 (지난 회차)</button>
    <span class="ctl__sep"></span>
    <span class="ctl__lab">검수</span>
    <button class="ctl__btn" data-tgl="allplaque">명판 전부 펴기</button>
    <button class="ctl__btn" data-tgl="nomotion">모션 정지</button>
  </div>

  <div id="tiles"></div>
</div>

<script>
(function(){
  /* nav/home.html의 LAYOUT 그대로 — 과목당 한 벌 고정 */
  var LAYOUT = {
    math:{ ratio:'960 / 670', objects:[
      { n:1, cx:50.0, cy:39.4, w:49.4, iLeft:10 }, { n:2, cx:19.4, cy:48.4, w:35.8 }, { n:3, cx:83.3, cy:48.9, w:34.2 },
      { n:4, cx:17.7, cy:77.8, w:32.4, iTop:76 }, { n:5, cx:81.4, cy:78.1, w:31.5, iTop:76 }, { n:6, cx:76.4, cy:17.4, w:22.7, float:true }
    ]},
    sci:{ ratio:'1280 / 670', objects:[
      { n:1, cx:50.0, cy:40.8, w:32.1, iLeft:14 }, { n:2, cx:26.6, cy:56.5, w:23.5 }, { n:3, cx:75.0, cy:54.3, w:23.4 },
      { n:4, cx:26.1, cy:78.1, w:25.1, iTop:74 }, { n:5, cx:73.5, cy:80.3, w:23.1, iTop:74 }, { n:6, cx:69.6, cy:17.4, w:14.9, float:true }
    ]}
  };
  var HAS_CHAR = { 'math-elem-3-1':1,'math-mid-3-1':1,'math-mid-3-2':1,'sci-elem-3-1':1,'sci-mid-3-1':1,'sci-mid-3-2':1 };

  /* 대표 학기 — 32배경 평균 휘도(Y)·색상각 실측값으로 골랐다 */
  var TILES = [
    { key:'math-elem-3-1', cat:'기준',      name:'수학 초3-1',  Y:0.358, hue:209, note:'기본 홈 화면 · 캐릭터가 있는 학기' },
    { key:'math-mid-1-2',  cat:'가장 어두움', name:'수학 중1-2',  Y:0.049, hue:251, note:'32배경 중 최저 휘도 (한색)' },
    { key:'sci-mid-1-1',   cat:'어두운 난색', name:'과학 중1-1',  Y:0.114, hue:47,  note:'난색 중 최저 휘도' },
    { key:'math-mid-2-1',  cat:'문제의 주황', name:'수학 중2-1',  Y:0.381, hue:31,  note:'지난 회차에 「안 어울린다」고 판정된 화면' },
    { key:'math-mid-2-2',  cat:'가장 밝음',   name:'수학 중2-2',  Y:0.592, hue:205, note:'32배경 중 최고 휘도 — 흰 홀로그램이 묻힐 위험 1순위' },
    { key:'sci-elem-4-2',  cat:'밝은 난색',   name:'과학 초4-2',  Y:0.542, hue:349, note:'난색 중 최고 휘도 (분홍)' },
    { key:'math-elem-6-2', cat:'저채도',     name:'수학 초6-2',  Y:0.482, hue:143, note:'채도 0.11 — 가장 무채에 가까운 배경' }
  ];

  /* 단원 데이터 — nav/curriculum.html 데모(수학 초3-1) 기준 */
  var UNITS = [
    { no:1, name:'덧셈과 뺄셈', subs:2 }, { no:2, name:'평면도형', subs:1 },
    { no:3, name:'나눗셈',     subs:1 }, { no:4, name:'길이와 시간', subs:1 },
    { no:5, name:null,          subs:2 }, { no:6, name:null,          subs:2 }
  ];
  /* 중반 상태 — 실물 1개 + 나머지 홀로그램 (대비를 한 화면에서 본다) */
  var DONE = [2], PROG = { 1:1, 6:1 };

  function segs(u, d){
    var h='<span class="plaque__segs">';
    for(var i=0;i<u.subs;i++) h+='<i class="'+(i<d?'on':'')+'"></i>';
    return h+'</span>';
  }

  var host=document.getElementById('tiles');
  TILES.forEach(function(t){
    var sc = t.key.indexOf('sci-')===0 ? 'sci' : 'math';
    var cfg = LAYOUT[sc];
    var dir = 'assets/img/home/'+t.key;

    var sec=document.createElement('section'); sec.className='tile';
    sec.innerHTML='<div class="tile__hd"><span class="tile__cat">'+t.cat+'</span>'
      +'<span class="tile__name">'+t.name+'</span>'
      +'<span class="tile__meta">휘도 '+t.Y.toFixed(3)+' · 색상 '+t.hue+'°</span>'
      +'<span class="tile__note">'+t.note+'</span></div>';

    var stage=document.createElement('div');
    stage.className='stage m-white';
    stage.style.aspectRatio=cfg.ratio;
    stage.style.backgroundImage='url("'+dir+'/bg.webp")';

    cfg.objects.forEach(function(o){
      var u=UNITS[o.n-1], d=PROG[u.no]||0, done=DONE.indexOf(u.no)>=0;
      var el=document.createElement('div');
      el.className='obj'+(o.float?' obj--float':'')+(done?' is-done':'');
      el.style.left=o.cx+'%'; el.style.top=o.cy+'%'; el.style.width=o.w+'%';
      el.style.setProperty('--m', 'url("'+dir+'/obj-'+o.n+'.webp")');
      var info=''; if(o.iLeft!=null) info+='left:'+o.iLeft+'%;'; if(o.iTop!=null) info+='top:'+o.iTop+'%;';
      el.innerHTML='<span class="obj__img" style="background-image:url(\''+dir+'/obj-'+o.n+'.webp\')"></span>'
        +'<span class="plaque" style="'+info+'">'+u.no+'단원'+(u.name?' · '+u.name:'')+segs(u,d)+'</span>';
      if(!done) el.addEventListener('click', function(e){
        e.stopPropagation();
        var was=el.classList.contains('is-peek');
        stage.querySelectorAll('.is-peek').forEach(function(x){ x.classList.remove('is-peek'); });
        if(!was) el.classList.add('is-peek');
      });
      stage.appendChild(el);
    });

    var hero=document.createElement('div');
    hero.className='hero'+(HAS_CHAR[t.key]?'':' is-nochar');
    hero.innerHTML='<div class="bubble"><b>'+t.name+'</b> 학습을 시작해보세요!</div>'
      +'<img class="char" src="'+dir+'/character.webp" alt=""><div class="shadow"></div>';
    stage.appendChild(hero);

    sec.appendChild(stage); host.appendChild(sec);
  });

  document.addEventListener('click', function(){
    document.querySelectorAll('.is-peek').forEach(function(x){ x.classList.remove('is-peek'); });
  });

  document.querySelectorAll('[data-mode]').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('[data-mode]').forEach(function(x){ x.classList.toggle('is-on', x===b); });
      document.querySelectorAll('.stage').forEach(function(s){
        ['white','flat','cyan'].forEach(function(m){ s.classList.toggle('m-'+m, b.dataset.mode===m); });
      });
    });
  });
  document.querySelectorAll('[data-tgl]').forEach(function(b){
    b.addEventListener('click', function(){
      var on=b.classList.toggle('is-on');
      document.querySelectorAll('.stage').forEach(function(s){ s.classList.toggle('is-'+b.dataset.tgl, on); });
    });
  });
})();
</script>
</body>
</html>
