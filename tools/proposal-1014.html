<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 1014 — 해설 박스</title>
<!-- =========================================================================
     2026-10-14 시안 — 결론이 나면 지운다 (CLAUDE.md 「tools/ 정리 규칙」).
     (회색 B → proposal-color.html 로 옮김 · 나가기 C → 실서버 로직을 쓰기로 해 취소)
     실제 화면을 iframe으로 띄우고 변형 CSS·마크업만 덮어 씌운다. 화면 파일은 건드리지 않는다.
     ========================================================================= -->
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  body { margin: 0; background: var(--n-100); color: var(--n-650); font-family: var(--font-sans); letter-spacing: var(--tracking); }
  main { max-width: 1960px; margin: 0 auto; padding: var(--sp-32) var(--sp-24) 80px; }
  h1 { font-size: var(--fs-26); margin: 0 0 var(--sp-8); }
  .lead { font-size: var(--fs-15); color: var(--n-500); margin: 0 0 var(--sp-40); }
  section { margin-bottom: 64px; }
  h2 { font-size: var(--fs-22); margin: 0 0 var(--sp-6); }
  .axis { font-size: var(--fs-15); color: var(--n-500); margin: 0 0 var(--sp-20); }
  .axis b { color: var(--n-650); }
  .row { background: var(--n-000); border-radius: var(--r-16); padding: var(--sp-16) var(--sp-20) var(--sp-20); margin-bottom: var(--sp-16); }
  .row__hd { display: flex; align-items: baseline; gap: var(--sp-12); margin-bottom: var(--sp-12); }
  .row__k { font-family: var(--font-mono); font-weight: var(--fw-bold); font-size: var(--fs-16); color: var(--n-000); background: var(--n-650); border-radius: var(--r-8); padding: 2px var(--sp-8); }
  .row__t { font-weight: var(--fw-heavy); font-size: var(--fs-16); }
  .row__d { font-size: var(--fs-14); color: var(--n-400); }
  .row--now .row__k { background: var(--n-400); }
  .frames { display: flex; gap: var(--sp-12); flex-wrap: wrap; }
  .fr { --s: .33; width: calc(1280px * var(--s)); }
  .fr__box { width: calc(1280px * var(--s)); height: calc(800px * var(--s)); overflow: hidden; border-radius: var(--r-8); box-shadow: inset 0 0 0 1px var(--n-200); background: var(--n-050); }
  .fr iframe { width: 1280px; height: 800px; border: 0; transform: scale(var(--s)); transform-origin: 0 0; pointer-events: none; }
  .fr__cap { font-size: var(--fs-13); color: var(--n-400); margin-top: var(--sp-6); font-weight: var(--fw-semibold); }
  .note { font-size: var(--fs-14); color: var(--n-500); line-height: 1.6; margin: var(--sp-8) 0 0; }
  .note b { color: var(--n-650); }
</style>
</head>
<body><main>
  <h1>시안 — 해설 박스</h1>
  <p class="lead">실제 화면 위에 바뀐 부분만 덮어 씌운 거친 시안입니다. 화면 파일은 아직 그대로입니다.</p>

  <section id="A">
    <h2>A. 해설 박스를 하나로</h2>
    <p class="axis">가르는 축 — <b>해설 박스가 무엇을 말하나.</b> 어느 훈련인지(계열색) · 내용만(무채) · 둘 다 조금씩(흰 바탕 + 계열 띠)</p>
    <div id="A-rows"></div>
  </section>


</main>

<script>
(function () {
  // ---------- 틀 ----------
  function row(host, key, title, desc, frames, now) {
    var r = document.createElement('div'); r.className = 'row' + (now ? ' row--now' : '');
    r.innerHTML = '<div class="row__hd"><span class="row__k">' + key + '</span><span class="row__t">' + title + '</span><span class="row__d">' + desc + '</span></div><div class="frames"></div>';
    var fs = r.querySelector('.frames');
    frames.forEach(function (f) { fs.appendChild(frame(f)); });
    document.getElementById(host).appendChild(r);
    return r;
  }
  function frame(f) {
    var w = document.createElement('div'); w.className = 'fr';
    w.innerHTML = '<div class="fr__box"><iframe loading="lazy"></iframe></div><div class="fr__cap">' + f.cap + '</div>';
    var ifr = w.querySelector('iframe');
    ifr.src = '../' + f.src + (f.src.indexOf('?') < 0 ? '?' : '&') + 'pv=1014';
    ifr.onload = function () {
      var d = ifr.contentDocument, win = ifr.contentWindow;
      d.documentElement.setAttribute('data-theme', f.theme || 'light');
      if (f.css) { var s = d.createElement('style'); s.textContent = f.css; d.head.appendChild(s); }
      var hide = d.createElement('style'); hide.textContent = '.rmdbg{display:none!important}'; d.head.appendChild(hide);
      if (f.setup) setTimeout(function () { f.setup(d, win); }, 400);
    };
    return w;
  }
  function clickDbg(label) {
    return function (d) {
      var b = [].slice.call(d.querySelectorAll('.rmdbg__btn')).find(function (x) { return x.textContent.trim() === label; });
      if (b) b.click();
    };
  }

  // ---------- A. 해설 박스 ----------
  var A_SCREENS = [
    { src: 'type/review.html', cap: '유형 해설 · 라이트', theme: 'light' },
    { src: 'type/review.html', cap: '유형 해설 · 다크', theme: 'dark' },
    { src: 'assignment/explain.html', cap: '과제 해설 · 라이트', theme: 'light' },
    { src: 'exam/solve.html?debug=1', cap: '시험 풀이 (오답 후) · 라이트', theme: 'light', setup: clickDbg('오답 제출') }
  ];
  var A = [
    { k: 'A1', t: '계열색 틴트', d: '어제 유형에 적용한 방식 = 과제 해설 현행. 시험만 바뀜', css: {
        exam: '.explain{background:var(--th-tint);border-color:transparent}.explain__cap{color:var(--th-ink-accent)}' } },
    { k: 'A2', t: '무채 면만', d: '테두리 없이 옅은 회색 면 하나. 제목도 글자색', css: {
        type: ':root[data-theme] .explain{background:var(--n-050);box-shadow:none}:root[data-theme] .explain__head{color:var(--qtext)}'
            + ':root[data-theme="dark"] .explain{background:var(--n-800)}',
        assign: '.expl,:root[data-theme="dark"] .expl{background:var(--n-050)}.expl__t,:root[data-theme="dark"] .expl__t{color:var(--ink)}',
        exam: '.explain{border-color:transparent}.explain__cap{color:var(--ink)}' } },
    { k: 'A3', t: '흰 바탕 + 왼쪽 계열 띠', d: '면은 칠하지 않고 띠 하나로만 계열을 알림', css: {
        type: ':root[data-theme] .explain{background:transparent;box-shadow:inset 4px 0 0 var(--th-accent);border-radius:var(--r-4)}:root[data-theme] .explain__head{color:var(--th-ink-accent)}'
            + ':root[data-theme="dark"] .explain{box-shadow:inset 4px 0 0 var(--th-accent-hi)}:root[data-theme="dark"] .explain__head{color:var(--th-accent-hi)}',
        assign: '.expl{background:transparent;box-shadow:inset 4px 0 0 var(--th-accent);border-radius:var(--r-4)}.expl__t{color:var(--th-ink-accent)}',
        exam: '.explain{border:0;background:transparent;box-shadow:inset 4px 0 0 var(--th-accent);border-radius:var(--r-4)}.explain__cap{color:var(--th-ink-accent)}' } }
  ];
  row('A-rows', '현행', '지금 상태', '유형·과제 = 계열색 틴트 / 시험 = 회색 면 + 테두리 + 앰버 제목', A_SCREENS, true);
  A.forEach(function (v) {
    row('A-rows', v.k, v.t, v.d, A_SCREENS.map(function (s) {
      var key = s.src.indexOf('type/') === 0 ? 'type' : s.src.indexOf('assignment/') === 0 ? 'assign' : 'exam';
      return Object.assign({}, s, { css: v.css[key] || '' });
    }));
  });

})();
</script>
</body></html>
