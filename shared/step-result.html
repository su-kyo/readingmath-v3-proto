<!DOCTYPE html>
<!-- 결과 화면 = 항상 다크 계기판 (A층 우주와 같은 취급 · 토글 없음 — Phase 7 사용자 결정) -->
<html lang="ko" data-section="concept" data-theme="dark">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개념 학습 완료 · 스텝 결과 — 리딩수학과학</title>
  <link rel="stylesheet" href="styles/tokens.css?v=24" />
  <link rel="stylesheet" href="styles/base.css?v=7" />
  <link rel="stylesheet" href="styles/components.css?v=10" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=8" />
  <style>
    /* ===== 하나의 '디바이스'로 정돈 — 다크 네이비 베젤 + LCD 화면 + (전환되는) 사이드 패널 =====
       과제화면처럼 두 패널을 부드러운 30px 라운드로 띄우고, 베젤은 은은하게. 단일 블루 스케일. */
    .rframe {
      flex: 1; min-height: 0; display: flex; gap: 14px;
      background: var(--th-static); border-radius: 34px 34px 0 0; padding: 8px 8px 0;
      --lmain: var(--n-900); --ltext: var(--n-050); --lmuted: var(--n-300);
      --bar-track: var(--n-700); --lcd: rgba(255,255,255,.05);
      --accent: var(--th-accent-hi); --title1: var(--th-accent-hi); --title2: var(--th-accent); --rate: var(--cyan-400);
      --row-bg: rgba(255,255,255,.04); --row-br: rgba(76,218,247,.38);
    }
    /* 우측 '학습 진행 현황' — 항상 다크. 면 색은 림(--th-static)과 같은 블루 계열에서 파생(톤온톤) */
    .rside { --lside: color-mix(in srgb, var(--th-static) 32%, var(--n-900)); --ltext: var(--text); --lmuted: var(--text-muted); --accent: var(--th-accent-hi); }

    /* 좌측: 결과 (LCD 라인 패턴) */
    .rmain {
      position: relative; flex: 1; min-width: 0; overflow: auto;
      background: var(--lmain); border-radius: 30px 30px 0 0;
      padding: clamp(28px,3.2vw,44px) clamp(28px,3.2vw,44px) 104px;
      display: flex; flex-direction: column; justify-content: center; gap: clamp(24px,2.6vw,34px);
    }
    .rmain::before { /* LCD 스캔라인 */
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: repeating-linear-gradient(0deg, var(--lcd) 0, var(--lcd) 1px, transparent 1px, transparent 5px);
    }
    .rmain > * { position: relative; z-index: 1; }
    /* 스크롤바 = 화면톤에 녹인 얇은 pill */
    .rmain::-webkit-scrollbar, .rside__list::-webkit-scrollbar { width: 10px; height: 10px; }
    .rmain::-webkit-scrollbar-track, .rside__list::-webkit-scrollbar-track { background: transparent; }
    .rmain::-webkit-scrollbar-thumb { background: rgba(143,235,255,.20); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
    .rmain::-webkit-scrollbar-thumb:hover { background: rgba(143,235,255,.32); background-clip: padding-box; }
    .rside__list::-webkit-scrollbar-thumb { background: rgba(234,240,255,.18); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
    .rmain, .rside__list { scrollbar-width: thin; scrollbar-color: rgba(143,235,255,.24) transparent; }

    .rhead { display: flex; flex-direction: column; gap: 8px; }
    .rtitle { font-size: clamp(28px, 3.2vw, 42px); font-weight: 800; line-height: 1.05; color: var(--title1); }
    .runit { font-size: clamp(18px, 1.8vw, 26px); font-weight: 700; color: var(--ltext); }
    .rinfo { display: flex; flex-direction: column; gap: clamp(16px,1.8vw,24px); min-width: 0; }

    /* ===== 계기판 히어로 (Phase 7 ① A안) — 다이얼 게이지 + 판독창 ===== */
    @property --pct { syntax: '<number>'; inherits: true; initial-value: 0; }
    .rhero { display: flex; align-items: center; gap: clamp(24px,3.2vw,52px); flex-wrap: wrap; }
    .dial { position: relative; width: clamp(190px,20vw,230px); aspect-ratio: 1; flex: none;
      transition: --pct 1s cubic-bezier(.3,.8,.3,1); }
    .dial__face { position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 210deg, var(--rate) 0deg calc(var(--pct) * 3deg),
        rgba(255,255,255,.13) calc(var(--pct) * 3deg) 300deg, transparent 300deg 360deg);
      -webkit-mask: radial-gradient(closest-side, transparent 71%, #000 72%);
              mask: radial-gradient(closest-side, transparent 71%, #000 72%); }
    /* 눈금 두 겹 — 빈 트랙 위엔 밝은 눈금, 채워진 아크 위엔 어두운 눈금 (100%에서도 안 사라짐) */
    .dial__ticks { position: absolute; inset: 6%; border-radius: 50%; opacity: .55;
      background: repeating-conic-gradient(from 210deg, var(--lmuted) 0deg 1.6deg, transparent 1.6deg 30deg);
      -webkit-mask: radial-gradient(closest-side, transparent 84%, #000 85%);
              mask: radial-gradient(closest-side, transparent 84%, #000 85%); }
    .dial__ticks--over { background: repeating-conic-gradient(from 210deg, rgba(6,14,32,.6) 0deg 1.6deg, transparent 1.6deg 30deg); opacity: 1; }
    /* 바늘 → 링 띠 위 마커 (중심축 침 폐기 — 숫자를 안 가린다) */
    .dial__needle { position: absolute; left: calc(50% - 2px); bottom: 50%; width: 4px; height: 52%; z-index: 1;
      border-radius: 2px; background: linear-gradient(to top, transparent 0 62%, var(--current) 62%);
      transform-origin: 50% 100%;
      transform: rotate(calc((210 + var(--pct) * 3) * 1deg)); }
    .dial__read { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end; padding-bottom: 12%; text-align: center; }
    .dial__read b { font-family: var(--font-mono); font-size: clamp(34px,3.4vw,42px); font-weight: 700; color: var(--ltext); line-height: 1; }
    .dial__read b small { font-size: .55em; color: var(--lmuted); }
    .dial__read > span { font-size: 13px; color: var(--lmuted); margin-top: 4px; }

    .rmeters { display: flex; gap: 14px; }
    .win { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 104px;
      padding: 14px 18px; border-radius: 12px; background: rgba(0,0,0,.25);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); }
    .win__lb { font-size: 12px; color: var(--lmuted); }
    .win img { width: 48px; height: 48px; }
    .win b { font-family: var(--font-mono); font-size: 27px; font-weight: 700; color: var(--rate); line-height: 1.3; }
    .win b small { font-size: 16px; color: var(--lmuted); }

    /* ===== 활동별 결과 행 — 문항 LED (B안 조합) ===== */
    .rrows { display: flex; flex-direction: column; gap: 10px; }
    .rrow { display: flex; align-items: center; gap: clamp(16px,2.2vw,28px); padding: 14px clamp(18px,2vw,26px); border-radius: 14px; background: var(--row-bg); }
    .rrow__name { display: flex; align-items: center; gap: 10px; flex: none; min-width: 130px; font-weight: 800; font-size: clamp(15px,1.5vw,18px); color: var(--ltext); }
    .rrow__name svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
    .seg { display: flex; gap: 4px; flex: 1; }
    .seg i { flex: 1; height: 14px; border-radius: 3px; background: rgba(255,255,255,.07);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); transition: background var(--t-fast); }
    .seg i.on { background: var(--rate); box-shadow: 0 0 10px rgba(24,209,252,.35); }
    .rrow__stat { display: flex; align-items: baseline; justify-content: flex-end; gap: 7px; flex: none; width: 112px; }
    .rrow__stat > span { font-size: 14px; font-weight: 600; color: var(--lmuted); }
    .rrow__stat > b { font-family: var(--font-mono); font-weight: 700; font-size: 19px; color: var(--accent); }
    /* ===== 우측: 학습 진행 현황 — 조작 패널 (Phase 7 ①-b C안) =====
       좌측이 모니터(스크린)라면 이쪽은 조작반: 램프·모듈 블록·물리 키. 페더 인셋 금지 — 크리스프만. */
    /* 버튼은 항상 콘솔바 위에 보이도록: 패널 자체는 안 넘치고, 리스트만 내부 스크롤 */
    .rside {
      position: relative; width: clamp(300px, 27vw, 400px); flex: none; overflow: hidden;
      background: var(--lside); border-radius: 30px 30px 0 0;
      padding: 22px 20px 104px; display: flex; flex-direction: column;
    }
    .screw { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--n-500); }
    .screw.tl { top: 15px; left: 15px; } .screw.tr { top: 15px; right: 15px; }
    /* 헤더 — 진행 표현은 LED 세그 + 수치 한 벌. 구분선은 헤더 묶음에 붙는다(위 11px < 아래 21px) */
    .rside__hd { display: flex; align-items: center; gap: 10px; padding: 0 2px 11px;
      border-bottom: 1px solid rgba(255,255,255,.10); }
    .rside__title { font-size: 17px; font-weight: 800; color: var(--ltext); }
    .rside__prog { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .rside__prog i { width: 20px; height: 12px; border-radius: 3px; background: rgba(255,255,255,.10); }
    .rside__prog i.on { background: var(--rate); box-shadow: 0 0 8px rgba(24,209,252,.45); }
    .rside__prog b { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--accent); }
    .rside__prog b small { color: var(--lmuted); font-size: 12px; }
    /* 스텝 모듈 — 면판 위에 올라앉은 블록 (크리스프 받침 그림자) */
    .rside__list { display: flex; flex-direction: column; gap: 14px; margin-top: 21px;
      overflow-y: auto; min-height: 0; }
    .step-card { display: flex; align-items: center; gap: 15px; min-height: 88px; padding: 16px 19px; flex: none;
      border-radius: 16px; background: rgba(255,255,255,.07); box-shadow: 0 4px 0 rgba(0,0,0,.32); }
    /* 공용 learn-shell.css 의 구형 카드 표현(점선 테두리·틴트·호버 리프트)을 이 화면에서만 무력화 */
    .step-card.is-open { border: none; }
    .step-card.is-done { background: rgba(255,255,255,.07); }
    .step-card.is-done:hover, .step-card.is-open:hover { transform: none; filter: brightness(1.07);
      box-shadow: 0 4px 0 rgba(0,0,0,.32); }
    .step-card.is-done:active, .step-card.is-open:active { transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,.32); }
    .step-card.is-current, .step-card.is-current:hover { box-shadow: 0 4px 0 rgba(0,0,0,.32), inset 0 0 0 2.5px var(--accent); }
    .step-card .lamp2 { width: 14px; height: 14px; border-radius: 50%; flex: none;
      background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
    .step-card.is-done .lamp2 { background: var(--accent);
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 55%, transparent); }
    .step-card__id { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .step-card__no { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--lmuted); }
    .step-card__name { font-size: 18px; font-weight: 800; color: var(--ltext); white-space: nowrap; }
    .step-card.is-open .step-card__name { color: var(--lmuted); }
    .step-card__grade { height: 40px; margin-left: auto; }
    .step-card .key { margin-left: auto; padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer;
      background: var(--n-500); color: var(--n-000); font-family: var(--font-sans); font-weight: 700; font-size: 15px;
      box-shadow: 0 3px 0 var(--n-650); }
    .step-card .key:hover { filter: brightness(1.12); }
    /* 훈련 결과 버튼 — 모든 스텝 완료 시 리스트 끝에 등장. 세로가 짧으면 리스트가 스크롤되고 버튼은 남는다 */
    .pgo { margin-top: 14px; display: flex; align-items: center; justify-content: center;
      gap: 10px; width: 100%; min-height: 74px; flex: none; border: none; border-radius: 16px; cursor: pointer;
      background: var(--primary); color: var(--n-000); font-family: var(--font-sans); font-size: 20px; font-weight: 800;
      box-shadow: 0 5px 0 color-mix(in srgb, var(--primary) 55%, var(--n-900));
      animation: ignite 2.2s ease-in-out infinite; }
    .pgo:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--primary) 55%, var(--n-900)); }
    @keyframes ignite {
      0%, 100% { box-shadow: 0 5px 0 color-mix(in srgb, var(--primary) 55%, var(--n-900)), 0 0 0 0 transparent; }
      50% { box-shadow: 0 5px 0 color-mix(in srgb, var(--primary) 55%, var(--n-900)),
        0 0 26px color-mix(in srgb, var(--accent) 40%, transparent); }
    }

    @media (max-width: 940px) {
      .rframe { flex-direction: column; }
      .rmain, .rside { border-radius: 24px; }
      .rside { width: auto; }
    }
  </style>
</head>
<body class="learn-body" style="--subj:var(--th-accent)">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong">과학 중등 1-1</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide">2단원 생물의 구성과 다양성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--hide">(1) 생물의 구성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb">개념 훈련</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong">개념 학습</span>
        </nav>
        <div class="lheader__actions">
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <div class="rframe">
        <!-- 좌측 -->
        <section class="rmain">
          <div class="rhero">
            <div class="dial" id="rateDial">
              <div class="dial__ticks"></div>
              <div class="dial__face"></div>
              <div class="dial__ticks dial__ticks--over"></div>
              <div class="dial__needle"></div>
              <div class="dial__read"><b><span id="rate">0</span><small>%</small></b><span>정답률</span></div>
            </div>
            <div class="rinfo">
              <div class="rhead">
                <h1 class="rtitle">개념 학습 완료!</h1>
                <h2 class="runit">(1) 생물의 구성</h2>
              </div>
              <div class="rmeters">
                <div class="win"><span class="win__lb">등급</span><img id="summaryBadge" src="assets/img/grade/grade-b.webp" alt="등급" /></div>
                <div class="win"><span class="win__lb">정답</span><b><span id="score">0</span><small id="total">/14</small></b></div>
              </div>
            </div>
          </div>
          <div class="rrows" id="rows"></div>
        </section>

        <!-- 우측: 조작 패널. 스텝 3개 = 훈련 결과(concept-training-result.js STAGES)와 정합 -->
        <aside class="rside">
          <i class="screw tl"></i><i class="screw tr"></i>
          <div class="rside__hd">
            <span class="rside__title">학습 진행 현황</span>
            <span class="rside__prog" id="sideProg"><i class="on"></i><i></i><i></i><b>1<small>/3</small></b></span>
          </div>
          <div class="rside__list">
            <div class="step-card is-current is-done">
              <i class="lamp2"></i>
              <div class="step-card__id"><span class="step-card__no">STEP 1</span><span class="step-card__name">개념 학습</span></div>
              <img class="step-card__grade" id="sideBadge" src="assets/img/grade/grade-step-b.webp" alt="등급" />
            </div>
            <div class="step-card is-open" data-go="concept/drill.html">
              <i class="lamp2"></i>
              <div class="step-card__id"><span class="step-card__no">STEP 2</span><span class="step-card__name">개념 다지기</span></div>
              <button class="key">시작하기 ›</button>
            </div>
            <div class="step-card is-open" data-go="concept/drill.html">
              <i class="lamp2"></i>
              <div class="step-card__id"><span class="step-card__no">STEP 3</span><span class="step-card__name">개념 확인하기</span></div>
              <button class="key">시작하기 ›</button>
            </div>
          </div>
          <button class="pgo" id="trainResultBtn" data-go="shared/training-result.html" style="display:none">훈련 결과 보기 ›</button>
        </aside>
      </div>
    </div>

    <!-- 하단 콘솔 바 -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn"><img src="assets/icons/ico-note.svg" alt="" /><span>연습장</span></button>
            <button class="toolbtn" data-home><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg><span>홈으로</span></button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-left.svg" alt="" />
    </div>
  </div>

  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/scratchpad.js?v=13"></script>
  <script src="scripts/step-result.js?v=5"></script>
  <script src="scripts/step-progress.js"></script>
</body>
</html>
