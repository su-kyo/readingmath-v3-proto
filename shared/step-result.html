<!DOCTYPE html>
<!-- 결과 화면 = 항상 다크 계기판 (A층 우주와 같은 취급 · 토글 없음 — Phase 7 사용자 결정) -->
<html lang="ko" data-section="concept" data-theme="dark">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개념 학습 완료 · 스텝 결과 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <link rel="stylesheet" href="styles/tokens.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/base.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/components.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/result.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/screens/shared-step-result.css?v=20261016-6" />
</head>
<body class="learn-body" style="--subj:var(--th-accent)">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong" data-crumb="sem">수학 중등 3-2</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide" data-crumb="unit">1단원 삼각비</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
          <span class="crumb crumb--hide" data-crumb="sub">(1) 삼각비</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
          <span class="crumb">개념 훈련</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
          <span class="crumb crumb--strong" id="stepCrumb">개념 학습</span>
        </nav>
        <div class="lheader__actions">
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <div class="rframe">
        <!-- 좌측 -->
        <section class="rmain">
          <div class="rhero">
            <div class="dial" id="rateDial">
              <div class="dial__ticks"></div>
              <div class="dial__face"></div>
              <div class="dial__ticks dial__ticks--over"></div>
              <div class="dial__needle"></div>
              <div class="dial__read"><b><span id="rate">0</span><small>%</small></b><span>정답률</span></div>
            </div>
            <div class="rinfo">
              <div class="rhead">
                <h1 class="rtitle" id="stepTitle">개념 학습 완료!</h1>
                <h2 class="runit" data-crumb="sub">(1) 삼각비</h2>
              </div>
              <div class="rmeters">
                <div class="win"><span class="win__lb">등급</span><img id="summaryBadge" src="assets/img/grade/grade-b.webp" alt="등급" /></div>
                <div class="win"><span class="win__lb">정답</span><b><span id="score">0</span><small id="total">/14</small></b></div>
              </div>
            </div>
          </div>
          <div class="rrows" id="rows"></div>
          <!-- 기초 연산 결과(?step=ops) — 한 칸이 한 문항 (유형 스텝 결과와 같은 문법) -->
          <div class="qgrid" id="qgrid" hidden></div>
        </section>

        <!-- 우측: 조작 패널. 스텝 2개(개념 학습 · 기초 연산) = 훈련 결과(concept-training-result.js STAGES)와 정합 -->
        <aside class="rside">
          <div class="rside__hd">
            <span class="rside__title">학습 진행 현황</span>
          </div>
          <div class="rside__list">
            <div class="step-card is-current is-done">
              <i class="lamp2"></i>
              <div class="step-card__id"><span class="step-card__no">STEP 1</span><span class="step-card__name">개념 학습</span></div>
              <img class="step-card__grade" id="sideBadge" src="assets/img/grade/grade-step-b.webp" alt="등급" />
            </div>
            <div class="step-card is-open" id="opsCard" data-go="concept/basic-ops.html" data-demo-grade="b">
              <i class="lamp2"></i>
              <div class="step-card__id"><span class="step-card__no">STEP 2</span><span class="step-card__name">기초 연산</span></div>
              <button class="key">시작하기 ›</button>
            </div>
          </div>
          <button class="pgo" id="trainResultBtn" data-go="shared/training-result.html" style="display:none">훈련 결과 보기 ›</button>
        </aside>
      </div>
    </div>

    <!-- 하단 콘솔 바 -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn" data-home><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg><span>홈으로</span></button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-left.svg" alt="" />
    </div>
  </div>
  <script src="scripts/subject.js?v=20261016-6"></script>
  <script src="scripts/grade.js?v=20261016-6"></script>
  <script src="scripts/step-result.js?v=20261016-6"></script>
  <script src="scripts/step-progress.js?v=20261016-6"></script>
  <script src="scripts/learn-exit.js?v=20261016-6"></script>
</body>
</html>
