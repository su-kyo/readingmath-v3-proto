<!DOCTYPE html>

  <script>
    /* 테마 부트스트랩 — 다크가 기본. 학습 화면이 쓰는 rm-theme가 'light'일 때만 뒤집는다.
       <head>에서 먼저 실행해 화면이 번쩍이지 않게 한다. */
    try{ if(localStorage.getItem('rm-theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
  </script>
  <link rel="stylesheet" href="styles/tokens.css?v=25" />

</head>
<body class="u-body">
  <div class="u-app">
    <header class="gnb">
      <div class="gnb__info"><span class="gnb__logo"></span><span class="gnb__name">김학생</span></div>
      <div class="gnb__icons">
        <button class="gnb__ico" title="도움말"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1" fill="currentColor" stroke="none"/></svg></button>
        <button class="gnb__ico" title="오류 신고"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg></button>
        <button class="gnb__ico" id="noticeBtn" title="공지사항"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h3l7 4V5L7 9H4zM18 8a5 5 0 0 1 0 8"/></svg><span class="gnb__dot"></span></button>
        <button class="gnb__ico" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </header>

    <main class="u-main">
      <div class="u-wrap">
        <a class="u-crumb u-rise" href="util/notice.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>공지사항</a>

        <div class="u-rise" style="animation-delay:60ms">
          <span class="u-doc__cat" id="docCat">공지</span>
          <h1 class="u-doc__ttl" id="docTitle">제목</h1>
          <div class="u-doc__date" id="docDate">2026년 0월 0일</div>
          <div class="u-doc__hr"></div>
        </div>

        <div class="u-doc__body u-rise" id="docBody" style="animation-delay:130ms"></div>

        <div class="u-file" id="docFile" style="display:none">
          <span class="u-file__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/></svg></span>
          <span class="u-file__nm" id="docFileNm">첨부<span class="u-file__sz" id="docFileSz"></span></span>
          <button class="u-btn u-btn--sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>내려받기</button>
        </div>

        <div class="u-docfoot">
          <button class="u-btn u-btn--ghost" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>이전 글</button>
          <button class="u-btn u-btn--ghost" id="nextBtn">다음 글<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
    </main>
  </div>

  <script>
  (function(){
    var DOCS = {
      8:{ cat:'공지', title:'시험 대비(유형 도전) 기능 오픈 안내', date:'2026년 4월 15일', file:'시험대비 이용 안내.pdf', size:'PDF · 1.2MB', body:
        '<p>학생의 학습 상태에 맞춰 문제를 선택하고 연습할 수 있는 <b>시험 대비(유형 도전)</b> 기능이 새롭게 오픈되었어요. 필요한 유형을 골라 반복 학습하며 시험을 효율적으로 준비할 수 있습니다.</p>'
        +'<h3>적용 범위</h3>'
        +'<ul><li>적용 과목 — 리딩수학 · 리딩과학</li><li>적용 학기 — 중등 1-1, 2-1, 3-1학기</li><li>적용 단원 — 각 학기 1~2단원</li></ul>'
        +'<p>이후 단원과 학기는 순차적으로 확대 적용될 예정이며, 중등 1-1학기는 현재 문제를 등록하고 있어요.</p>'
        +'<h3>주요 기능</h3>'
        +'<ul><li>시험대비 홈에서 학년·학기·교재 기준으로 문제 유형을 고를 수 있어요.</li><li>성취도 색상으로 유형을 구분해 필요한 수준의 문제를 선택할 수 있어요.</li><li>중요 유형만 모아 집중 학습할 수 있어요.</li></ul>' },
      7:{ cat:'이벤트', title:'[공지] 2026 학습 후기 이벤트 결과 발표 🎉 축하드립니다!', date:'2026년 5월 18일', file:'이벤트 당첨자 발표.pdf', size:'PDF · 840KB', body:
        '<p>많은 참여 감사드립니다! 2026 학습 후기 이벤트 당첨자를 발표합니다.</p>'
        +'<h3>당첨자 안내</h3>'
        +'<ul><li>갓생기록상 (애플 에어팟4) — 1명 · 변*윤(3658)</li><li>뇌근육 벌크업상 (스탠리 퀜처 텀블러) — 5명</li><li>문해력 바이브상 (싸이플렉스 세트) — 30명</li></ul>'
        +'<p>경품은 주소 확인이 완료되는 대로 금주 중 택배로 발송됩니다. 등록된 휴대번호로 기프티콘이 일괄 발송돼요.</p>'
        +'<p>아쉽게 이번에 선정되지 못했더라도 다음 이벤트의 주인공이 될 수 있으니 열공 모드를 유지해 보세요.</p>' },
      6:{ cat:'공지', title:'자유 모드 · 계통별 학습 업데이트 안내', date:'2026년 3월 30일', body:
        '<p>자유 모드에 <b>계통별 보기</b>가 추가되었어요. 학기 순서가 아니라 수와 연산·도형·측정 같은 계통(영역)을 따라 학습 흐름을 이어갈 수 있어요.</p>'
        +'<p>모두보기 화면에서 계통별로 대단원을 한눈에 확인하고 원하는 단원으로 바로 이동할 수 있습니다.</p>' },
      5:{ cat:'공지', title:'6월 정기 점검 안내 (6/12 새벽 2시~4시)', date:'2026년 6월 5일', body:
        '<p>보다 안정적인 서비스 제공을 위해 아래 일정으로 정기 점검을 진행합니다.</p>'
        +'<ul><li>점검 일시 — 2026년 6월 12일(금) 02:00 ~ 04:00</li><li>점검 내용 — 서버 안정화 및 기능 개선</li></ul>'
        +'<p>점검 시간 동안 서비스 이용이 일시 중단됩니다. 이용에 참고 부탁드립니다.</p>' },
      4:{ cat:'이벤트', title:'갓생기록상 · 뇌근육 벌크업상 응모 안내', date:'2026년 5월 2일', body:
        '<p>학습 후기 이벤트 응모가 시작되었어요. 자세한 내용은 이벤트 페이지를 확인해 주세요.</p>' },
      3:{ cat:'공지', title:'월간보고서 리포트 개편 안내', date:'2026년 4월 1일', body:
        '<p>월간보고서가 학습 시간·정답률·성취도 중심으로 개편되었어요. 한 달의 학습을 더 쉽게 돌아볼 수 있습니다.</p>' },
      2:{ cat:'공지', title:'개인정보 처리방침 개정 안내', date:'2026년 2월 20일', body:
        '<p>개인정보 처리방침이 일부 개정되었습니다. 자세한 내용은 하단 약관 페이지에서 확인하실 수 있습니다.</p>' },
      1:{ cat:'이벤트', title:'신규 가입 웰컴 이벤트', date:'2026년 2월 1일', body:
        '<p>신규 가입을 환영합니다! 첫 학습을 완료하면 웰컴 뱃지를 드려요.</p>' }
    };
    /* 목록과 같은 순서(등록일 최신순) */
    var ORDER=[5,7,4,8,3,6,2,1];

    var id=parseInt(new URLSearchParams(location.search).get('id')||'5',10);
    if(!DOCS[id]) id=ORDER[0];

    var pb=document.getElementById('prevBtn'), nb=document.getElementById('nextBtn');

    function show(cur){
      var d=DOCS[cur];
      var cat=document.getElementById('docCat');
      cat.textContent=d.cat;
      cat.className='u-doc__cat'+(d.cat==='이벤트'?' is-event':'');
      document.getElementById('docTitle').textContent=d.title;
      document.getElementById('docDate').textContent=d.date;
      document.getElementById('docBody').innerHTML=d.body;
      document.title=d.title+' — 리딩수학과학';

      var f=document.getElementById('docFile');
      if(d.file){
        f.style.display='flex';
        document.getElementById('docFileNm').firstChild.nodeValue=d.file;
        document.getElementById('docFileSz').textContent=d.size||'';
      } else f.style.display='none';

      var pos=ORDER.indexOf(cur);
      pb.disabled = pos>=ORDER.length-1;
      nb.disabled = pos<=0;
      pb.onclick=function(){ if(pos<ORDER.length-1) go(ORDER[pos+1]); };
      nb.onclick=function(){ if(pos>0) go(ORDER[pos-1]); };
    }
    function go(next){
      id=next;
      history.replaceState(null,'','?id='+id);
      show(id);
      document.querySelector('.u-main').scrollTop=0;
    }
    show(id);
  })();
  </script>
  <script src="scripts/gnb-drawer.js?v=8"></script>
</body>
</html>
