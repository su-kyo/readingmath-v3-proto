<!DOCTYPE html>
<html lang="ko" data-section="util">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지사항 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <script>
    /* 테마 부트스트랩 — 다크가 기본. 학습 화면이 쓰는 rm-theme가 'light'일 때만 뒤집는다.
       <head>에서 먼저 실행해 화면이 번쩍이지 않게 한다. */
    try{ if(localStorage.getItem('rm-theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
  </script>
  <link rel="stylesheet" href="styles/tokens.css?v=20261014-12" />
  <link rel="stylesheet" href="styles/base.css?v=20261014-12" />
  <link rel="stylesheet" href="styles/gnb.css?v=20261014-12" />
  <link rel="stylesheet" href="styles/util.css?v=20261014-12" />
</head>
<body class="u-body">
  <div class="u-app">
    <header class="gnb">
      <div class="gnb__info"><span class="gnb__logo"></span><span class="gnb__name">김학생</span></div>
      <div class="gnb__icons">
        <button class="gnb__ico" title="도움말"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1" fill="currentColor" stroke="none"/></svg></button>
        <button class="gnb__ico" title="오류 신고"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg></button>
        <button class="gnb__ico" id="noticeBtn" title="공지사항"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h3l7 4V5L7 9H4zM18 8a5 5 0 0 1 0 8"/></svg><span class="gnb__dot"></span></button>
        <button class="gnb__ico" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </header>

    <main class="u-main">
      <div class="u-wrap">
        <a class="u-crumb u-rise" href="util/notice.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>공지사항</a>

        <div class="u-rise" style="animation-delay:60ms">
          <span class="u-doc__cat" id="docCat">공지</span>
          <h1 class="u-doc__ttl" id="docTitle">제목</h1>
          <div class="u-doc__date" id="docDate">2026년 0월 0일</div>
          <div class="u-doc__hr"></div>
        </div>

        <div class="u-doc__body u-rise" id="docBody" style="animation-delay:130ms"></div>

        <div class="u-file" id="docFile" style="display:none">
          <span class="u-file__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/></svg></span>
          <span class="u-file__nm" id="docFileNm">첨부<span class="u-file__sz" id="docFileSz"></span></span>
          <button class="u-btn u-btn--sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>내려받기</button>
        </div>

        <div class="u-docfoot">
          <button class="u-btn u-btn--ghost" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>이전 글</button>
          <button class="u-btn u-btn--ghost" id="nextBtn">다음 글<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
    </main>
  </div>

  <script src="scripts/util-notice-detail.js?v=20261014-12"></script>
  <script src="scripts/gnb-drawer.js?v=20261014-12"></script>
</body>
</html>
