<!DOCTYPE html>

  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <script>
    /* 테마 부트스트랩 — 다크가 기본. 학습 화면이 쓰는 rm-theme-choice가 'light'일 때만 뒤집는다.
       <head>에서 먼저 실행해 화면이 번쩍이지 않게 한다. */
    try{ if(localStorage.getItem('rm-theme-choice')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
  </script>

            <div class="u-head__t">공지사항</div>
