<!DOCTYPE html>

  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <script>
    /* 테마 부트스트랩 — 다크가 기본. 학습 화면이 쓰는 rm-theme-choice가 'light'일 때만 뒤집는다.
       <head>에서 먼저 실행해 화면이 번쩍이지 않게 한다. */
    try{ if(localStorage.getItem('rm-theme-choice')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
  </script>
  <link rel="stylesheet" href="styles/tokens.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/base.css?v=20261016-6" />

        <button class="gnb__ico" title="오류 신고"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 1 1 10 0v6" /><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z" /><path d="M21 12h1" /><path d="M18.5 4.5 18 5" /><path d="M2 12h1" /><path d="M12 2v1" /><path d="m4.929 4.929.707.707" /><path d="M12 12v6" /></svg></button>

        <button class="gnb__ico" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg></button>
      </div>
    </header>

    <main class="u-main">
      <div class="u-wrap u-wrap--wide">
        <div class="u-head h-head u-rise">
          <div class="u-head__l">
            <div class="u-head__t">학습 기록</div>
            <div class="u-head__sub" id="headSub">수학 · 훈련 기록과 라운드마다 나아진 만큼을 확인하세요.</div>
          </div>
          <div class="h-nav h-calwrap">
            <button class="h-nav__arrow" id="prevWk" title="지난주"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg></button>

            <button class="h-nav__arrow" id="nextWk" title="다음 주"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg></button>

        <div id="list"></div>

  <div class="h-modal" id="modal"></div>
  <div class="toast" id="toast"></div>
