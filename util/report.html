<!DOCTYPE html>
<html lang="ko" data-section="util">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>월간보고서 — 리딩수학과학</title>
  <link rel="stylesheet" href="styles/tokens.css?v=25" />
  <link rel="stylesheet" href="styles/base.css?v=7" />
  <link rel="stylesheet" href="styles/gnb.css?v=9" />
  <link rel="stylesheet" href="styles/util.css?v=10" />
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
  </style>
</head>
<body class="u-body">
  <div class="u-app">
    <header class="gnb">
      <div class="gnb__info"><span class="gnb__logo"></span><span class="gnb__name">김학생</span></div>
      <div class="gnb__icons">
        <button class="gnb__ico" title="도움말"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1" fill="currentColor" stroke="none"/></svg></button>
        <button class="gnb__ico" title="오류 신고"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg></button>
        <button class="gnb__ico" id="noticeBtn" title="공지사항"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h3l7 4V5L7 9H4zM18 8a5 5 0 0 1 0 8"/></svg><span class="gnb__dot"></span></button>
        <button class="gnb__ico" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </header>

    <main class="u-main">
      <div class="u-wrap">
        <div class="u-head u-rise">
          <div class="u-head__l">
            <div class="u-head__t">월간보고서</div>
            <div class="u-head__sub">매달 학습 현황과 성취를 정리한 리포트예요. 리포트는 새 창에서 열립니다.</div>
          </div>
        </div>
        <div id="list"></div>
      </div>
    </main>
  </div>

  <div class="u-toast" id="toast"></div>

  <script>
  (function(){
    /* 학습 기간(term)·등록일(reg) 둘 다 유지. 번호(id)는 화면에 노출하지 않는다 */
    var DATA=[
      { id:5, term:'2026.06.01 ~ 2026.06.30', reg:'2026.07.01', isNew:true },
      { id:4, term:'2026.05.01 ~ 2026.05.31', reg:'2026.06.01' },
      { id:3, term:'2026.04.01 ~ 2026.04.30', reg:'2026.05.01' },
      { id:2, term:'2026.03.01 ~ 2026.03.31', reg:'2026.04.01' },
      { id:1, term:'2026.02.01 ~ 2026.02.28', reg:'2026.03.01' }
    ];
    var EXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></svg>';
    var CHART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1"/><path d="M8 14v3M12 10v7M16 12v5"/></svg>';
    var CLOUD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.4-8 5.5 5.5 0 0 1 10.6 1A3.5 3.5 0 0 1 17 18z"/><path d="M12 10v4M12 16.5h.01"/></svg>';
    var listEl=document.getElementById('list');

    /* 검수용 상태 파라미터 — ?state=loading|empty|error (배포본에서는 쓰이지 않는다) */
    var FORCE=new URLSearchParams(location.search).get('state')||'';
    if(FORCE==='empty') DATA=[];

    if(FORCE==='loading'){
      var h=''; for(var i=0;i<5;i++){
        h+='<div class="u-skrow">'
          +'<div class="u-sk" style="height:16px;width:'+(46+(i*11)%34)+'%"></div>'
          +'<div class="u-sk" style="height:11px;width:'+(20+(i*7)%14)+'%;margin-top:11px"></div></div>';
      }
      listEl.innerHTML='<div class="u-sheet u-rise">'+h+'</div>';
    } else if(FORCE==='error'){
      listEl.innerHTML='<div class="u-sheet u-rise"><div class="u-state">'
        +'<div class="u-state__ico is-warn">'+CLOUD+'</div>'
        +'<div class="u-state__t">리포트를 불러오지 못했어요.</div>'
        +'<div class="u-state__d">잠시 후 다시 시도해 주세요.</div>'
        +'<button class="u-btn" onclick="location.href=\'util/report.html\'">다시 시도</button>'
        +'</div></div>';
    } else if(!DATA.length){
      listEl.innerHTML='<div class="u-sheet u-rise"><div class="u-state">'
        +'<div class="u-state__ico">'+CHART+'</div>'
        +'<div class="u-state__t">아직 받은 리포트가 없어요.</div>'
        +'<div class="u-state__d">한 달치 학습이 쌓이면 다음 달 1일에 첫 리포트를 보내 드려요.</div>'
        +'</div></div>';
    } else {
      listEl.innerHTML='<div class="u-sheet u-rise">'+DATA.map(function(d){
        var y=d.term.slice(0,4), m=parseInt(d.term.slice(5,7),10);
        return '<button class="u-row">'
          +'<span class="u-row__main">'
            +'<span class="u-row__ttl">'+y+'년 '+m+'월 학습 리포트'+(d.isNew?'<span class="u-new">N</span>':'')+'</span>'
            +'<span class="u-row__meta">학습 기간 '+d.term+'<i></i>등록 '+d.reg+'</span>'
          +'</span>'
          /* 태블릿에는 호버가 없다 — 상시 표시 */
          +'<span class="u-row__ext">'+EXT+'새 창에서 열기</span></button>';
      }).join('')+'</div>';
    }

    var toastEl=document.getElementById('toast'), tt;
    function toast(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(tt);
      tt=setTimeout(function(){ toastEl.classList.remove('show'); },1900); }
    listEl.addEventListener('click', function(e){
      if(!e.target.closest('.u-row')) return;
      toast('월간보고서는 새 창에서 열립니다. (리포트 연동 예정)');
    });
  })();
  </script>
  <script src="scripts/gnb-drawer.js?v=7"></script>
</body>
</html>
