<!DOCTYPE html>
<html lang="ko" data-theme="light" data-section="assign">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>과제 결과 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <script>try{if(localStorage.getItem('rm-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="styles/tokens.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/base.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/components.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/assign.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/screens/assignment-result.css?v=20261015-41" />
</head>
<body>
  <div class="screen">
    <div class="screen__bg"></div>
    <div class="wrap">
      <header class="hd">
        <nav class="breadcrumb">
          <span class="breadcrumb__strong">수학 중등 1-1</span>
          <svg class="breadcrumb__sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="breadcrumb__strong">2단원 <span style="font-weight:500">일차부등식과 연립방정식</span></span>
          <svg class="breadcrumb__sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="breadcrumb__title">일차부등식의 활용 실생활 문장제 극복 훈련</span>
        </nav>
        <div class="hd__acts">
          <button class="toggle" id="themeToggle" title="라이트/다크 전환"><span class="toggle__k"></span></button>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <main class="content content--frame">
        <section class="rpanel">
          <div class="rhead">
            <span class="rhead__t">과제 결과</span>
            <span class="rhead__sub">일차부등식의 활용 실생활 문장제 극복 훈련</span>
            <span class="rdate"><span class="rdate__tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg>제출 완료</span><span class="rdate__d">2026.05.21 15:30</span></span>
          </div>

          <div class="summary">
            <div class="score"><span class="score__n" id="scoreN">0</span><span class="score__d">/100점</span></div>
            <div class="stats">
              <div class="stat stat--correct"><span class="stat__k">정답</span><span class="stat__v" id="cCorrect">0 <small>/ 15</small></span></div>
              <span class="stat-div"></span>
              <div class="stat stat--wrong"><span class="stat__k">오답</span><span class="stat__v" id="cWrong">0 <small>문항</small></span></div>
              <span class="stat-div"></span>
              <div class="stat stat--none"><span class="stat__k">미입력</span><span class="stat__v" id="cNone">0 <small>문항</small></span></div>
            </div>
          </div>

          <div class="rtable" id="rtable"></div>
        </section>
      </main>
    </div>

    <div class="bar bar--overlay bar--flat">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-task-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <button class="toolbtn" id="homeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>과제 센터</button>
          <button class="toolbtn toolbtn--primary" id="applyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>시험 대비 반영 확인</button>
          <button class="toolbtn toolbtn--primary" id="explainBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5V5.5"/></svg>해설보기</button>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-task-left.svg" alt="" />
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="scripts/assignment-result.js?v=20261015-41"></script>
  <script src="scripts/learn-exit.js?v=20261015-41"></script>
</body>
</html>
