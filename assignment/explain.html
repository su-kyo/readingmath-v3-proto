<!DOCTYPE html>
<html lang="ko" data-theme="light" data-section="assign">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>과제 해설 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <script>try{if(localStorage.getItem('rm-theme-choice')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="styles/tokens.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/base.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/components.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/assign.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/screens/assignment-explain.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/scratchpad.css?v=20261016-6" />
</head>
<body>
  <div class="screen">
    <div class="screen__bg"></div>
    <div class="wrap">
      <header class="hd">
        <nav class="breadcrumb">
          <span class="breadcrumb__strong">수학 중등 1-1</span>
          <svg class="breadcrumb__sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
          <span class="breadcrumb__strong">2단원 <span class="breadcrumb__light">일차부등식과 연립방정식</span></span>
          <svg class="breadcrumb__sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
          <span class="breadcrumb__title">일차부등식의 활용 실생활 문장제 극복 훈련</span>
        </nav>
        <div class="hd__acts">
          <button class="toggle" id="themeToggle" title="라이트/다크 전환"><span class="toggle__k"></span></button>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <main class="content content--frame">
        <section class="qpanel" id="qpanel"></section>
        <aside class="omr">
          <div class="omr__prog">
            <div class="omr__ptop"><b>정답</b><span id="progText">0/15</span></div>
            <div class="omr__track"><i id="progBar" style="width:0%"></i></div>
          </div>
          <div class="omr__grid" id="omrGrid"></div>
        </aside>
      </main>
    </div>

    <div class="bar bar--overlay bar--flat">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-task-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn" id="scratchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4" /><path d="M2 6h4" /><path d="M2 10h4" /><path d="M2 14h4" /><path d="M2 18h4" /><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" /></svg>연습장</button>
            <button class="toolbtn" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>이전</button>
          </div>
          <div class="bar__group">
            <button class="toolbtn" id="nextBtn">다음<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg></button>
            <button class="toolbtn toolbtn--primary" id="resultBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16" /><path d="M18 17V9" /><path d="M13 17V5" /><path d="M8 17v-3" /></svg>결과 보기</button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-task-left.svg" alt="" />
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/scratchpad.js?v=20261016-6"></script>
  <script src="scripts/assignment-data.js?v=20261016-6"></script>
  <script src="scripts/assignment-explain.js?v=20261016-6"></script>
  <script src="scripts/learn-exit.js?v=20261016-6"></script>
</body>
</html>
