<!DOCTYPE html>
<html lang="ko" data-theme="light" data-section="assign">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>과제 해설 — 리딩수학과학</title>
  <script>try{if(localStorage.getItem('rm-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="styles/tokens.css?v=20260828-3" />
  <link rel="stylesheet" href="styles/base.css?v=20260828-3" />
  <link rel="stylesheet" href="styles/components.css?v=20260828-3" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20260828-3" />
  <style>
    /* =========================================================================
       과제 센터 · 해설 화면 (assignment-explain) — 풀이 화면의 리뷰(정답 공개) 버전
       · 보기 정오답 표시(정답 초록 / 오답선택 빨강✕) + 해설 박스
       · 우측 "정답 N/15" + OMR 초록·빨강 그리드(현재=노랑테) · 하단 결과 보기
       ========================================================================= */
    :root {
      --hd: var(--th-static); --blue: var(--th-ink-accent); --yellow: var(--current);
      --good: var(--ok-on-dark); --bad: var(--no-on-dark);
      /* 라이트 표면 — content 거터(살짝틴트) → qpanel 흰색 / omr 살짝틴트 */
      --content: var(--n-000); --qpanel: var(--n-000); --panel: var(--n-050); --ink: var(--n-650); --sub: var(--text-muted);
      --line: var(--n-200); --opt: var(--n-000); --track: var(--n-100); --dash: var(--n-200);
    }
    :root[data-theme="dark"] {
      /* 다크 표면 — 뉴트럴 램프 단조증가(bg n-900 < 패널 n-800 < 카드 n-600)로 대비 확보 */
      --content: var(--n-900); --qpanel: var(--n-800); --panel: var(--n-800); --ink: var(--n-050); --sub: var(--text-muted);
      --line: var(--border-strong); --opt: var(--n-600); --track: var(--n-900); --dash: var(--n-350);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: var(--font-sans); background: var(--assign-body); overflow: hidden; -webkit-font-smoothing: antialiased; }

    .wrap { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; padding: clamp(16px,2.4vw,30px) clamp(20px,5vw,72px) 0; gap: var(--sp-12); }

    /* 헤더 */
    .hd { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-16); background: var(--hd); border-radius: var(--r-30); padding: var(--sp-8) var(--sp-12) var(--sp-8) 28px; color: var(--n-000); }
    .breadcrumb__strong { font-weight: var(--fw-heavy); letter-spacing: -.02em; white-space: nowrap; }
    .breadcrumb__title { opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .breadcrumb__sep { opacity: .5; flex: none; }
    .hd__acts { display: flex; align-items: center; gap: var(--sp-8); flex: none; }
    .toggle { width: 62px; height: 32px; border-radius: var(--r-full); background: rgba(0,0,0,.28); border: 0; position: relative; cursor: pointer; padding: 0; }
    .toggle__k { position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; border-radius: 50%; background: center/contain no-repeat url("assets/icons/ico-sun.svg"); transition: left .2s ease; }
    :root[data-theme="dark"] .toggle__k { left: 32px; background-image: url("assets/icons/ico-moon.svg"); }

    /* 콘텐츠 (2단) */
    /* 프레임 테두리 = 헤더색(정적) · 다크·라이트 불변 */
    .content { flex: 1; min-height: 0; display: flex; gap: var(--sp-12); background: var(--content); border: 6px solid var(--th-static); border-bottom: 0; border-radius: var(--r-frame) var(--r-frame) 0 0; padding: var(--sp-8) var(--sp-8) 0; }
    .qpanel { background: var(--qpanel); border-radius: var(--r-30) var(--r-30) 0 0; }
    .omr { background: var(--panel); border-radius: var(--r-30) var(--r-30) 0 0; }
    .qpanel { flex: 1; min-width: 0; overflow-y: auto; padding: var(--sp-24) var(--sp-32) 120px; display: flex; flex-direction: column; gap: var(--sp-16); }
    .omr { width: 348px; flex: none; display: flex; flex-direction: column; gap: var(--sp-16); padding: var(--sp-20) var(--sp-20) 120px; }

    /* 문제 메타 */
    .qmeta { display: flex; align-items: center; gap: var(--sp-8); flex-wrap: wrap; }
    .qmeta__n { padding: var(--sp-4) var(--sp-8); border-radius: var(--r-8); background: var(--hd); color: var(--n-000); font-size: var(--fs-14); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; }
    .qmeta__type { font-size: var(--fs-15); font-weight: var(--fw-bold); color: var(--hd); }
    :root[data-theme="dark"] .qmeta__type { color: var(--th-accent-hi); }
    .lvl { padding: var(--sp-4) var(--sp-8); border-radius: var(--r-full); font-size: var(--fs-12); font-weight: var(--fw-heavy); margin-left: auto; }
    .lvl--기본 { background: var(--info-tint); color: var(--info-ink); }
    .lvl--실력 { background: var(--th-tint); color: var(--th-ink-accent); }
    .lvl--심화 { background: var(--warn-tint); color: var(--warn-ink); }
    .qtext { font-size: clamp(17px,1.5vw,20px); font-weight: var(--fw-bold); line-height: 1.65; letter-spacing: -.02em; color: var(--ink); }
    .qimg { align-self: center; padding: var(--sp-12); border-radius: var(--r-16); background: var(--opt); border: 1px solid var(--line); }
    .qimg svg { display: block; width: 320px; height: 214px; max-width: 100%; }

    /* 객관식 (리뷰: 정오답 표시, 비활성) */
    .opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--sp-8); }
    .opts--col { grid-template-columns: 1fr; }
    .opt { display: flex; align-items: center; gap: var(--sp-12); padding: var(--sp-12) var(--sp-16); border: 1.5px solid var(--line); border-radius: var(--r-12); background: var(--opt); text-align: left; }
    .opt__n { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1.6px solid var(--dash); color: var(--sub); display: grid; place-items: center; font-size: var(--fs-13); font-weight: var(--fw-heavy); font-variant-numeric: tabular-nums; }
    .opt__n svg { width: 13px; height: 13px; }
    .opt__t { font-size: var(--fs-16); font-weight: var(--fw-semibold); color: var(--ink); }
    .opt--correct { border-color: var(--good); background: var(--ok-tint); }
    .opt--correct .opt__n { border-color: var(--good); background: var(--ok-ink); color: var(--n-000); }
    .opt--wrong { border-color: var(--bad); background: var(--no-tint); }
    .opt--wrong .opt__n { border-color: var(--bad); background: var(--bad); color: var(--n-000); }

    /* 주관식 (리뷰) */
    .short { display: flex; flex-direction: column; gap: var(--sp-12); align-items: center; }
    .short__field { display: inline-flex; align-items: center; gap: var(--sp-8); min-width: 220px; justify-content: center; padding: var(--sp-12) var(--sp-24); border: 2px solid var(--line); border-radius: var(--r-12); background: var(--opt); }
    .short__field.is-correct { border-color: var(--good); background: var(--ok-tint); }
    .short__field.is-wrong { border-color: var(--bad); background: var(--no-tint); }
    .short__val { font-family: var(--font-mono); font-size: var(--fs-22); font-weight: var(--fw-bold); color: var(--ink); font-variant-numeric: tabular-nums; }
    .short__unit { font-size: var(--fs-16); font-weight: var(--fw-bold); color: var(--sub); }
    .short__mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--n-000); }
    .short__mark svg { width: 12px; height: 12px; }
    .short__mark.o { background: var(--ok-solid); } .short__mark.x { background: var(--bad); }
    .short__ans { font-size: var(--fs-14); color: var(--sub); font-weight: var(--fw-semibold); }
    .short__ans b { color: var(--good); font-family: var(--font-mono); }

    /* 해설 박스 */
    .expl { background: var(--th-tint); border-radius: var(--r-12); padding: var(--sp-16) var(--sp-16); display: flex; flex-direction: column; gap: var(--sp-6); }
    :root[data-theme="dark"] .expl { background: var(--th-tint-strong); }
    .expl__t { font-size: var(--fs-15); font-weight: var(--fw-heavy); color: var(--blue); }
    :root[data-theme="dark"] .expl__t { color: var(--th-accent-hi); }
    .expl__b { font-size: var(--fs-15); line-height: 1.7; color: var(--ink); }

    /* OMR 사이드바 (리뷰) */
    .omr__prog { display: flex; flex-direction: column; gap: var(--sp-8); }
    .omr__ptop { display: flex; align-items: center; justify-content: space-between; }
    .omr__ptop b { font-size: var(--fs-16); font-weight: var(--fw-bold); color: var(--ink); }
    .omr__ptop span { font-family: var(--font-mono); font-size: var(--fs-16); font-weight: var(--fw-bold); color: var(--good); font-variant-numeric: tabular-nums; }
    .omr__track { height: 12px; border-radius: var(--r-full); background: var(--track); padding: var(--sp-4); }
    .omr__track > i { display: block; height: 100%; border-radius: var(--r-full); background: var(--ok-solid); }
    .omr__grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--sp-8); }
    .cell { aspect-ratio: 1; border: 0; border-radius: var(--r-8); font-family: var(--font-mono); font-size: var(--fs-19); font-weight: var(--fw-bold); color: var(--n-000); cursor: pointer; font-variant-numeric: tabular-nums; display: grid; place-items: center; position: relative; transition: transform .1s; }
    .cell:hover { transform: translateY(-1px); }
    .cell--correct { background: var(--ok-solid); }
    .cell--wrong { background: var(--bad); }
    .cell.is-cur { border: 3px solid var(--current); }
    .cell__mark { position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--n-000); display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .cell__mark svg { width: 10px; height: 10px; }
    .cell--correct .cell__mark { color: var(--good); }
    .cell--wrong .cell__mark { color: var(--bad); }

    /* 하단 콘솔 바 */


    .qpanel::-webkit-scrollbar { width: 10px; }
    .qpanel::-webkit-scrollbar-thumb { background: var(--n-200); border-radius: var(--r-full); border: 3px solid var(--qpanel); background-clip: padding-box; }
    :root[data-theme="dark"] .qpanel::-webkit-scrollbar-thumb { background: var(--n-500); background-clip: padding-box; }
    :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

    @media (max-width: 900px) {
      .content { flex-direction: column; }
      .omr { width: auto; }
    }
    /* 토스트 면색만 이 화면 것 */
    .toast, .rtoast, .dtoast, .ptoast { --toast-bg: var(--n-650); }
  </style>
</head>
<body>
  <div class="screen">
    <div class="screen__bg"></div>
    <div class="wrap">
      <header class="hd">
        <nav class="breadcrumb">
          <span class="breadcrumb__strong">수학 중등 1-1</span>
          <svg class="breadcrumb__sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="breadcrumb__strong">2단원 <span style="font-weight:500">일차부등식과 연립방정식</span></span>
          <svg class="breadcrumb__sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="breadcrumb__title">일차부등식의 활용 실생활 문장제 극복 훈련</span>
        </nav>
        <div class="hd__acts">
          <button class="toggle" id="themeToggle" title="라이트/다크 전환"><span class="toggle__k"></span></button>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <main class="content">
        <section class="qpanel" id="qpanel"></section>
        <aside class="omr">
          <div class="omr__prog">
            <div class="omr__ptop"><b>정답</b><span id="progText">0/15</span></div>
            <div class="omr__track"><i id="progBar" style="width:0%"></i></div>
          </div>
          <div class="omr__grid" id="omrGrid"></div>
        </aside>
      </main>
    </div>

    <div class="bar bar--overlay bar--flat">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-task-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn" id="scratchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>연습장</button>
            <button class="toolbtn" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>이전</button>
          </div>
          <div class="bar__group">
            <button class="toolbtn" id="nextBtn">다음<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
            <button class="toolbtn toolbtn--primary" id="resultBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17V9M15 17v-5M3 21h18M4 21V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v15"/></svg>결과 보기</button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-task-left.svg" alt="" />
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/scratchpad.js?v=20260828-3"></script>
  <script src="scripts/assignment-explain.js?v=20260828-3"></script>
</body>
</html>
