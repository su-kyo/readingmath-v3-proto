<!DOCTYPE html>
<html lang="ko" data-theme="light" data-section="assign">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>과제 풀이 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <script>try{if(localStorage.getItem('rm-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="styles/tokens.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/base.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/components.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/monitor.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/keypad.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/assign.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/screens/assignment-solve.css?v=20261015-41" />
  <link rel="stylesheet" href="styles/scratchpad.css?v=20261015-41" />
</head>
<body>
  <div class="screen">
    <div class="screen__bg"></div>
    <div class="wrap">
      <!-- 헤더 -->
      <header class="hd">
        <nav class="breadcrumb">
          <span class="breadcrumb__strong">수학 <span class="breadcrumb__unit">중등 1-1</span></span>
          <svg class="breadcrumb__sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="breadcrumb__strong">2단원 <span style="font-weight:500">일차부등식과 연립방정식</span></span>
          <svg class="breadcrumb__sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="breadcrumb__title">일차부등식의 활용 실생활 문장제 극복 훈련</span>
        </nav>
        <div class="hd__acts">
          <button class="toggle" id="themeToggle" title="라이트/다크 전환"><span class="toggle__k"></span></button>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <!-- 콘텐츠 -->
      <main class="content content--frame">
        <section class="qpanel" id="qpanel"></section>
        <aside class="omr">
          <div class="segmented" id="segmented">
            <button class="segmented__btn is-active" data-seg="board">풀이 현황판</button>
            <button class="segmented__btn" data-seg="sheet">답안표</button>
          </div>
          <div class="omr__prog">
            <div class="omr__ptop"><b>풀이한 문제</b><span id="progText">0/15</span></div>
            <div class="omr__track"><i id="progBar" style="width:0%"></i></div>
          </div>
          <div class="omr__grid" id="omrGrid"></div>
        </aside>
      </main>
    </div>

    <!-- 하단 콘솔 바 -->
    <div class="bar bar--overlay">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-task-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn" id="scratchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>연습장</button>
            <button class="toolbtn" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>이전</button>
          </div>
          <div class="bar__group">
            <button class="toolbtn" id="nextBtn">다음<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
            <button class="toolbtn toolbtn--primary" id="submitBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>제출하기</button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-task-left.svg" alt="" />
    </div>

    <!-- 답안표 입력 (공용 보조 모니터 프레임 · 우측 도킹 변형) -->
    <aside class="sheet monitor monitor--side" id="sheet" aria-hidden="true">
      <div class="monitor__dim" id="sheetBackdrop"></div>
      <div class="monitor__rig">
        <div class="monitor__frame">
          <div class="monitor__hd">
            <span class="monitor__lamps"><i class="is-live"></i><i></i><i></i></span>
            <span class="monitor__ttl">답안표 입력</span>
            <button class="monitor__x" id="sheetClose" aria-label="닫기"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
          </div>
          <div class="monitor__screen">
            <div class="sheet__head">
              <p class="sheet__sub">문항별 답안을 마킹하거나 입력한 후 하단의 <b>제출하기</b> 버튼을 눌러주세요.</p>
            </div>
            <div class="sheet__list" id="sheetList"></div>
          </div>
          <div class="monitor__chin"><span class="monitor__slit"></span></div>
        </div>
        <div class="monitor__mount"><i></i><i></i></div>
      </div>
    </aside>

    <div class="toast" id="toast"></div>
  </div>

  <!-- 검수용 디버그 패널 (?debug=1 일 때만 보임) -->
  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/scratchpad.js?v=20261015-41"></script>
  <script src="scripts/debug-panel.js?v=20261015-41"></script>
  <!-- 키패드 물리 키보드 입력 (공용) -->
  <script src="scripts/keypad.js?v=20261015-41"></script>
  <script src="scripts/keypad-input.js?v=20261015-41"></script>
  <script src="scripts/assignment-solve.js?v=20261015-41"></script>
  <script src="scripts/learn-exit.js?v=20261015-41"></script>
</body>
</html>
