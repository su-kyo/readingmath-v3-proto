<!DOCTYPE html>
<html lang="ko" data-theme="light" data-section="essay">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서술형 훈련 · 탐구활동 보고서 만들기 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <link rel="stylesheet" href="styles/tokens.css?v=20261015-31" />
  <link rel="stylesheet" href="styles/base.css?v=20261015-31" />
  <link rel="stylesheet" href="styles/components.css?v=20261015-31" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261015-31" />
  <link rel="stylesheet" href="styles/essay.css?v=20261015-31" />
  <link rel="stylesheet" href="styles/keypad.css?v=20261015-31" />
  <link rel="stylesheet" href="styles/monitor.css?v=20261015-31" />
  <link rel="stylesheet" href="styles/screens/essay-report.css?v=20261015-31" />
  <link rel="stylesheet" href="styles/scratchpad.css?v=20261015-31" />
</head>
<body class="learn-body">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong">과학 중등 1-1</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide">2단원 생물의 구성과 다양성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--hide">(1) 생물의 구성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb">서술형 훈련</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong">탐구활동 보고서 만들기</span>
        </nav>
        <div class="lheader__actions">
          <div class="lheader__timer" id="hdrTimer"><img src="assets/icons/ico-stopwatch.svg" alt="경과 시간" /><span class="lheader__time" id="timer">00:00</span><span class="lheader__limit">/ 60:00</span></div>
          <button class="theme-toggle" id="themeToggle" title="라이트/다크 전환"><span class="theme-toggle__knob"></span></button>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <main class="content">
        <section class="report-wrap">
          <div class="report" id="report"></div>
        </section>
      </main>
    </div>

    <!-- 하단 콘솔 바 -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-essay-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn"><img src="assets/icons/ico-note-edit.svg" alt="" /><span>연습장</span></button>
          </div>
          <div class="bar__group">
            <p class="guide" role="status" aria-live="polite" hidden><i class="guide__lamp"></i><span class="guide__text"></span></p>
            <button class="toolbtn toolbtn--primary" id="previewBtn" disabled title="빈칸을 모두 채우면 활성화돼요"><img src="assets/icons/ico-note.svg" alt="" /><span>보고서 미리보기</span></button>
            <button class="toolbtn toolbtn--primary" id="resultBtn" disabled title="빈칸을 모두 채우면 활성화돼요"><img src="assets/icons/ico-summary.svg" alt="" /><span>결과보기</span></button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-essay-left.svg" alt="" />
    </div>
  </div>

  <!-- 빈칸 입력 드롭다운 -->
  <div class="qpop" id="qpop" role="dialog" aria-label="빈칸 입력">
    <div class="qpop__inner">
      <span class="qpop__caret"></span>
      <div class="qpop__body" id="qpopBody"></div>
    </div>
  </div>

  <!-- 보고서 미리보기 (공용 보조 모니터 프레임 · 안은 의도된 흰 종이) -->
  <div class="pmodal monitor" id="pmodal" aria-hidden="true">
    <div class="monitor__dim" data-pclose></div>
    <div class="monitor__rig" role="dialog" aria-modal="true" aria-label="보고서 미리보기">
      <div class="monitor__mount"><i></i><i></i></div>
      <div class="monitor__frame">
        <div class="monitor__hd">
          <span class="monitor__lamps"><i class="is-live"></i><i></i><i></i></span>
          <span class="monitor__ttl">보고서 미리보기</span>
          <div class="monitor__tools">
            <button class="monitor__tool" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>인쇄</button>
            <button class="monitor__tool" id="dlBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>저장</button>
          </div>
          <button class="monitor__x" data-pclose aria-label="닫기"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        </div>
        <div class="monitor__screen"><div class="pmodal__paper" id="pmodalPaper"></div></div>
        <div class="monitor__chin"><span class="monitor__slit"></span></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 키패드 물리 키보드 입력 (공용) -->
  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/scratchpad.js?v=20261015-31"></script>
  <script src="scripts/keypad.js?v=20261015-31"></script>
  <script src="scripts/blank-pop.js?v=20261015-31"></script>
  <script src="scripts/keypad-input.js?v=20261015-31"></script>
  <script src="scripts/learn-guide.js?v=20261015-31"></script>
  <script src="scripts/essay-report.js?v=20261015-31"></script>
  <script src="scripts/learn-timer.js?v=20261015-31"></script>
  <script src="scripts/learn-exit.js?v=20261015-31"></script>
</body>
</html>
