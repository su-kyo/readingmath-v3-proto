<!DOCTYPE html>
<!-- 결과 화면 = 항상 다크 계기판 (A층 우주와 같은 취급 · 토글 없음 — Phase 7 사용자 결정) -->
<html lang="ko" data-section="essay" data-theme="dark">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서술형 훈련 · 스텝 결과 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <link rel="stylesheet" href="styles/tokens.css?v=20261014-4" />
  <link rel="stylesheet" href="styles/base.css?v=20261014-4" />
  <link rel="stylesheet" href="styles/components.css?v=20261014-4" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261014-4" />
  <link rel="stylesheet" href="styles/result.css?v=20261014-4" />
  <link rel="stylesheet" href="styles/essay.css?v=20261014-4" />
  <link rel="stylesheet" href="styles/screens/essay-step-result.css?v=20261014-4" />
</head>
<body class="learn-body" style="--subj:var(--th-accent-strong)">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong">수학 초등 3-1</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide">2단원 나눗셈</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--hide">(2) 문제 해결</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb">서술형 훈련</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong">기초 기르기</span>
        </nav>
        <div class="lheader__actions">
          <div class="lheader__timer is-paused" id="hdrTimer" title="제출 시점 (정지)"><img src="assets/icons/ico-stopwatch.svg" alt="경과 시간(정지)" /><span>10:04</span></div>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <div class="rframe">
        <!-- 좌측 -->
        <section class="rmain">
          <div class="rhero">
            <div class="dial" id="rateDial">
              <div class="dial__ticks"></div>
              <div class="dial__face"></div>
              <div class="dial__ticks dial__ticks--over"></div>
              <div class="dial__needle"></div>
              <div class="dial__read"><b><span id="rate">0</span><small>%</small></b><span>정답률</span></div>
            </div>
            <div class="rinfo">
              <div class="rhead">
                <h1 class="rtitle" id="title">기초 기르기 완료!</h1>
                <h2 class="runit" id="unit">(2) 문제 해결</h2>
              </div>
              <div class="rmeters">
                <div class="win"><span class="win__lb">등급</span><img id="summaryBadge" src="assets/img/grade/grade-b.webp" alt="등급" /></div>
                <div class="win"><span class="win__lb">정답</span><b><span id="score">0</span><small id="total">/0</small></b></div>
              </div>
            </div>
          </div>
          <div class="rrows" id="rows"></div>
        </section>

        <!-- 우측: 조작 패널. 스텝 3개 = 훈련 결과(essay-training-result.js STAGES)와 정합 -->
        <aside class="rside">
          <div class="rside__hd">
            <span class="rside__title">학습 진행 현황</span>
            <span class="rside__prog" data-prog id="sideProg"></span>
          </div>
          <div class="rside__list" id="stepList"></div>
          <button class="pgo" id="trainResultBtn" data-go="essay/training-result.html" style="display:none">훈련 결과 보기 ›</button>
        </aside>
      </div>
    </div>

    <!-- 하단 콘솔 바 (서술형) -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-essay-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn"><img src="assets/icons/ico-note-edit.svg" alt="" /><span>연습장</span></button>
            <button class="toolbtn" id="reviewBtn"><img src="assets/icons/ico-summary.svg" alt="" /><span>해설 보기</span></button>
            <button class="toolbtn" data-home><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg><span>홈으로</span></button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-essay-left.svg" alt="" />
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/scratchpad.js?v=20261014-4"></script>
  <script src="scripts/essay-step-result.js?v=20261014-4"></script>
  <script src="scripts/step-progress.js?v=20261014-4"></script>
  <script src="scripts/learn-exit.js?v=20261014-4"></script>
</body>
</html>
