<!DOCTYPE html>
<html lang="ko" data-theme="light" data-section="essay" data-subject="science">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서술형 훈련 · 문장 완성하기 (과학) — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <link rel="stylesheet" href="scripts/vendor/katex/katex.min.css?v=20261015-45" />
  <link rel="stylesheet" href="styles/tokens.css?v=20261015-45" />
  <link rel="stylesheet" href="styles/base.css?v=20261015-45" />
  <link rel="stylesheet" href="styles/components.css?v=20261015-45" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261015-45" />
  <link rel="stylesheet" href="styles/essay.css?v=20261015-45" />
  <link rel="stylesheet" href="styles/keypad.css?v=20261015-45" />
  <link rel="stylesheet" href="styles/screens/essay-basics-v2.css?v=20261015-45" />
  <link rel="stylesheet" href="styles/scratchpad.css?v=20261015-45" />
</head>
<body class="learn-body">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong">과학 중등 2-1</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide">1단원 물질의 특성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--hide">(2) 밀도와 용해도</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb">서술형 훈련</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong">문장 완성하기</span>
        </nav>
        <div class="lheader__actions">
          <div class="lheader__timer" id="hdrTimer"><img src="assets/icons/ico-stopwatch.svg" alt="경과 시간" /><span class="lheader__time" id="timer">00:00</span><span class="lheader__limit">/ 60:00</span></div>
          <button class="theme-toggle" id="themeToggle" title="라이트/다크 전환"><span class="theme-toggle__knob"></span></button>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <main class="content">
        <div class="stage-scroll">
          <!-- 문제 카드 (상주 · 열고 접기 · 스크롤 시 상단 스티키 · 번호탭으로 문제를 오간다) -->
          <section class="card problem is-collapsible" id="problem">
            <div class="problem__head" id="problemHead" role="button" tabindex="0" aria-label="문제 펼치기/접기">
              <span class="qsteps" id="qtabs"></span>
              <svg class="problem__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="problem__body" id="readBody"></div>
          </section>

          <!-- 풀이 카드 (문제마다 한 장 · essay-basics-v2.js가 #expl 채움) -->
          <section class="card worksheet" id="worksheet">
            <span class="sec-label sec-label--sol worksheet__label">풀이</span>
            <section class="expl" id="expl"></section>
          </section>

          <!-- 한 문제를 다 채우면 다음 문제로 (콘솔바 대신 콘텐츠 하단) -->
          <div class="stage-action" id="stageAction">
            <button class="stage-action__btn" id="primaryBtn" type="button">
              <span>다음 문제</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- 하단 콘솔 바 (서술형 버전) -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-essay-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn"><img src="assets/icons/ico-note-edit.svg" alt="" /><span>연습장</span></button>
          </div>
          <div class="bar__group">
            <p class="guide" role="status" aria-live="polite" hidden><i class="guide__lamp"></i><span class="guide__text"></span></p>
            <button class="toolbtn toolbtn--primary" id="resultBtn" disabled title="모든 빈칸을 채우면 활성화돼요"><img src="assets/icons/ico-summary.svg" alt="" /><span>결과보기</span></button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-essay-left.svg" alt="" />
    </div>
  </div>

  <!-- 빈칸 입력 창 — 숫자 키패드 (고르기는 공용 빈칸 선지 창) -->
  <div class="qpop" id="qpop" role="dialog" aria-label="빈칸 입력">
    <div class="qpop__inner" id="qpopInner">
      <span class="qpop__caret"></span>
      <div class="qpop__body" id="qpopBody"></div>
    </div>
  </div>

  <!-- 검수용 디버그 패널 (?debug=1 일 때만 보임) -->
  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/subject.js?v=20261015-45"></script>
  <script src="scripts/vendor/katex/katex.min.js?v=20261015-45"></script>
  <script src="scripts/scratchpad.js?v=20261015-45"></script>
  <script src="scripts/debug-panel.js?v=20261015-45"></script>
  <!-- 키패드 물리 키보드 입력 (공용) -->
  <script src="scripts/pop-place.js?v=20261015-45"></script>
  <script src="scripts/keypad.js?v=20261015-45"></script>
  <script src="scripts/blank-pop.js?v=20261015-45"></script>
  <script src="scripts/keypad-input.js?v=20261015-45"></script>
  <script src="scripts/learn-guide.js?v=20261015-45"></script>
  <script src="scripts/essay-sol.js?v=20261015-45"></script>
  <script src="scripts/essay-basics-data-sci.js?v=20261015-45"></script>
  <script src="scripts/essay-basics-v2.js?v=20261015-45"></script>
  <script src="scripts/learn-timer.js?v=20261015-45"></script>
  <script src="scripts/learn-exit.js?v=20261015-45"></script>
</body>
</html>
