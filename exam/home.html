<!DOCTYPE html>
<html lang="ko" data-theme="light" data-section="exam">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시험 대비 · 메인 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <script>try{if(localStorage.getItem('rm-theme-choice')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="styles/gnb.css?v=20261016-6" />
  <script src="scripts/subject.js?v=20261016-6"></script>
  <script src="scripts/gnb-drawer.js?v=20261016-6"></script>
  <link rel="stylesheet" href="styles/tokens.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/base.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/exam.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/screens/exam-home.css?v=20261016-6" />
</head>
<body class="exam-body">
  <div class="exam">
    <!-- 헤더 -->
    <header class="gnb gnb--light">
      <div class="gnb__info"><span class="gnb__logo"></span><span class="gnb__name">김학생</span></div>
      <nav class="gnb__modes">
        <button class="gnb__mode m-basic" data-go="nav/home.html">기본 모드</button>
        <button class="gnb__mode m-free" data-go="nav/freemode.html">자유 모드</button>
        <button class="gnb__mode m-exam is-active">시험 대비</button>
        <button class="gnb__mode m-assign" data-go="assignment/home.html">과제 센터<span class="gnb__mode__dot"></span></button>
      </nav>
      <div class="gnb__icons">
        <button class="gnb__ico" id="themeToggle" title="다크/라이트 전환" aria-label="다크/라이트 전환">
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg>
        </button>
        <button class="gnb__ico" title="도움말"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" /></svg></button>
        <button class="gnb__ico" title="긴급"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 1 1 10 0v6" /><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z" /><path d="M21 12h1" /><path d="M18.5 4.5 18 5" /><path d="M2 12h1" /><path d="M12 2v1" /><path d="m4.929 4.929.707.707" /><path d="M12 12v6" /></svg></button>
        <button class="gnb__ico" title="공지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z" /><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6" /></svg><span class="gnb__dot"></span></button>
        <button class="gnb__ico" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg></button>
      </div>
    </header>

    <!-- 본문 -->
    <div class="xbody">
      <section class="filter" id="filter">
        <div class="filter__head" id="filterHead">
          <h2>시험 대비</h2>
          <span class="spacer"></span>
          <div class="filter__acts" onclick="event.stopPropagation()">
            <button class="fbtn" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg>초기화</button>
            <button class="fbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>안내</button>
          </div>
          <span class="filter__toggle" id="filterToggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg></span>
        </div>
        <div class="filter__body">
          <div class="frow">
            <div class="fgroup">
              <span class="flabel">학년 · 학기</span>
              <button class="fdrop">초등 3-1 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg></button>
            </div>
            <div class="fgroup fgroup--grow">
              <span class="flabel">교재 선택</span>
              <div class="chips" data-single>
                <span class="chip is-active">전체</span>
                <span class="chip">아이스크림</span>
                <span class="chip">천재</span>
                <span class="chip">비상</span>
                <span class="chip">미래엔</span>
                <span class="chip">동아</span>
                <span class="chip">지학사</span>
              </div>
            </div>
          </div>
          <div class="fgroup">
            <span class="flabel">성취도 필터</span>
            <div class="chips" data-single data-achieve id="achieveChips"></div>
          </div>
        </div>
      </section>

      <div class="split">
        <aside class="sidebar">
          <span class="sidebar__label">단원</span>
          <div class="sidebar__list" id="sidebar"></div>
        </aside>
        <main class="panel" id="panel"></main>
      </div>
    </div>

    <!-- 유형 상세 슬라이드 패널 -->
    <div class="detail__backdrop" id="detailBackdrop"></div>
    <aside class="detail" id="detail" aria-hidden="true">
      <div class="detail__head">
        <span class="detail__title">유형 상세</span>
        <button class="detail__close" id="detailClose" title="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
      </div>
      <div class="detail__body">
        <div class="detail__badges" id="dBadges"></div>
        <h3 class="detail__type" id="dType">유형</h3>
        <div class="dblock">
          <span class="dblock__cap">대표 유형 동영상</span>
          <div class="svideo"><span class="svideo__play"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3" /></svg></span></div>
        </div>
        <div class="dblock">
          <span class="dblock__cap">대표 유형 문제</span>
          <div class="pcard"><span class="pcard__q">다음 식을 계산하여 값을 구하시오.</span><span class="pcard__ex">124 + 352 = □</span></div>
        </div>
        <div class="dblock">
          <span class="dblock__cap">최근 풀이 이력</span>
          <div class="history">
            <div class="history__item"><span class="history__icon history__icon--no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></span><div class="history__main"><span class="history__top">시험 대비 · <span class="history__tag history__tag--no">오답</span></span><span class="history__time">2026.06.03. 09:00:00</span></div></div>
            <div class="history__item"><span class="history__icon history__icon--no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></span><div class="history__main"><span class="history__top">시험 대비 · <span class="history__tag history__tag--no">오답</span></span><span class="history__time">2026.06.02. 09:00:00</span></div></div>
            <div class="history__item"><span class="history__icon history__icon--ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg></span><div class="history__main"><span class="history__top">시험 대비 · <span class="history__tag history__tag--ok">정답</span></span><span class="history__time">2026.05.30. 16:12:40</span></div></div>
          </div>
        </div>
      </div>
      <div class="detail__foot">
        <p class="detail__sub">이번 도전은 <b>2문항</b>으로 진행돼요.</p>
        <button class="detail__start" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><span id="startLabel">번개 도전</span></button>
      </div>
    </aside>
  </div>

  <script src="scripts/exam-theme.js?v=20261016-6"></script>
  <script src="scripts/exam-tile.js?v=20261016-6"></script>
  <script src="scripts/exam-home.js?v=20261016-6"></script>
</body>
</html>
