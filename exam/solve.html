  <title>시험 대비 · 문제 풀이 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <script>try{if(localStorage.getItem('rm-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="styles/tokens.css?v=20261015-31" />
  <link rel="stylesheet" href="styles/base.css?v=20261015-31" />
  <link rel="stylesheet" href="styles/keypad.css?v=20261015-31" />

</head>
<body class="exam-body">
  <div class="solve">
    <!-- 헤더 -->
    <header class="shead">
      <div class="shead__l">
        <a class="sback" href="exam/home.html" title="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
        <nav class="scrumb">
          <span class="home">시험 대비</span>
          <span class="dot"></span>
          <span class="scrumb__item">초등 3-1</span>
          <span class="dot"></span>
          <span class="scrumb__item">1단원 덧셈과 뺄셈</span>
          <span class="dot"></span>
          <span class="cur">올림이 없는 몇십몇 × 몇의 활용</span>
        </nav>
      </div>
      <div class="shead__r">
        <button class="sicon" id="themeToggle" title="다크/라이트 전환" aria-label="다크/라이트 전환">
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2 12h2.4M19.6 12H22M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
        </button>
        <span class="slink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 4.3L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/></svg>오류 신고</span>
        <a class="slink" href="exam/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>나가기</a>
      </div>
    </header>

    <!-- 워크스페이스 -->
    <div class="scontent">
      <section class="qarea">
        <div class="qarea__scroll" id="qarea"></div>
      </section>

      <aside class="sinfo">
        <div class="sblock">
          <span class="dblock__cap">유형 정보</span>
          <div class="sbadges"><span class="sbadge sbadge--con">정복</span><span class="sbadge sbadge--adv">심화</span></div>
          <span class="stype">올림이 없는 몇십몇 × 몇의 활용</span>
        </div>
        <div class="sblock">
          <span class="dblock__cap">대표 유형 동영상</span>
          <div class="svideo"><span class="svideo__play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div>
        </div>
        <div class="sblock">
          <span class="dblock__cap">대표 유형 문제</span>
          <div class="pcard"><span class="pcard__q">다음 식을 계산하여 값을 구하시오.</span><span class="pcard__ex">124 + 352 = □</span></div>
        </div>
        <div class="sblock">
          <span class="dblock__cap">최근 풀이 이력</span>
          <div class="history">
            <div class="history__item"><span class="history__icon history__icon--ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><div class="history__main"><span class="history__top">시험 대비 · <span class="history__tag history__tag--ok">정답</span></span><span class="history__time">2026.06.03. 09:00:00</span></div></div>
            <div class="history__item"><span class="history__icon history__icon--no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></span><div class="history__main"><span class="history__top">시험 대비 · <span class="history__tag history__tag--no">오답</span></span><span class="history__time">2026.06.02. 14:30:00</span></div></div>
            <div class="history__item"><span class="history__icon history__icon--ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><div class="history__main"><span class="history__top">시험 대비 · <span class="history__tag history__tag--ok">정답</span></span><span class="history__time">2026.05.30. 16:12:40</span></div></div>
          </div>
        </div>
      </aside>
    </div>

    <!-- 하단 액션 -->
    <footer class="sfoot">
      <span class="sfoot__hint" id="footHint">보기를 선택하고 제출하세요.</span>
      <div class="sfoot__btns">
        <a class="btn btn--sec" href="exam/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>홈으로</a>
        <button class="btn btn--pri" id="primaryBtn" disabled>제출하기</button>
      </div>
    </footer>
  </div>

  <script src="scripts/exam-theme.js?v=20261015-31"></script>
  <!-- 검수용 디버그 패널 (?debug=1 일 때만 보임) -->
  <script src="scripts/debug-panel.js?v=20261015-31"></script>
  <!-- 키패드 물리 키보드 입력 (공용) -->
  <script src="scripts/keypad.js?v=20261015-31"></script>
  <script src="scripts/keypad-input.js?v=20261015-31"></script>
  <script src="scripts/exam-solve.js?v=20261015-31"></script>
</body>
</html>
