<!DOCTYPE html>
<html lang="ko" data-section="type" data-theme="light">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유형 훈련 · 1차 유형 문제 — 리딩수학과학</title>
  <link rel="stylesheet" href="styles/tokens.css?v=20261012" />
  <link rel="stylesheet" href="styles/base.css?v=20261012" />
  <link rel="stylesheet" href="styles/components.css?v=20261012" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261012" />
  <link rel="stylesheet" href="styles/type.css?v=20261012" />
  <link rel="stylesheet" href="styles/keypad.css?v=20261012" />
  <link rel="stylesheet" href="styles/screens/type-quiz.css?v=20261012" />
</head>
<body class="learn-body">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong">과학 중등 1-1</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide">2단원 생물의 구성과 다양성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--hide">(1) 생물의 구성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb">유형 훈련</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong">1차 유형 문제</span>
        </nav>
        <div class="lheader__actions">
          <div class="lheader__timer" id="hdrTimer"><img src="assets/icons/ico-stopwatch.svg" alt="경과 시간" /><span id="timer">00:00</span></div>
          <button class="theme-toggle" id="themeToggle" title="라이트/다크 전환"><span class="theme-toggle__knob"></span></button>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <main class="content">
        <div class="progress-cap" id="progress"></div>
        <div class="ops-wrap">
          <div class="ops" id="opsScroll"><div class="q" id="q"></div></div>
        </div>
        <div class="ops__foot">
          <button class="btn-next" id="nextBtn" disabled>다음 문제</button>
        </div>
      </main>
    </div>

    <!-- 계산기 키패드 (주관식) — 안은 scripts/keypad.js가 채운다 -->
    <div class="keypad keypad--float" id="keypad" role="dialog" aria-label="숫자 입력"></div>

    <!-- 하단 콘솔 바 -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-type-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn"><img src="assets/icons/ico-note.svg" alt="" /><span>연습장</span></button>
          </div>
          <div class="bar__group">
            <button class="toolbtn toolbtn--primary" id="submitBtn" disabled title="모든 문제를 풀면 활성화돼요"><img src="assets/icons/ico-summary.svg" alt="" /><span>제출하기</span></button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-type-left.svg" alt="" />
    </div>
  </div>

  <!-- 검수용 디버그 패널 (?debug=1 일 때만 보임) -->
  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/scratchpad.js?v=20261012"></script>
  <script src="scripts/debug-panel.js?v=20261012"></script>
  <!-- 키패드 물리 키보드 입력 (공용) -->
  <script src="scripts/keypad.js?v=20261012"></script>
  <script src="scripts/keypad-input.js?v=20261012"></script>
  <script src="scripts/type-quiz.js?v=20261012"></script>
</body>
</html>
