<body class="learn-body">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong" data-crumb="sem">수학 중등 3-2</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide" data-crumb="unit">1단원 삼각비</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--hide" data-crumb="sub">(1) 삼각비</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb">유형 훈련</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong">1차 유형 문제</span>
        </nav>
        <div class="lheader__actions">
          <div class="lheader__timer" id="hdrTimer"><img src="assets/icons/ico-stopwatch.svg" alt="경과 시간" /><span class="lheader__time" id="timer">00:00</span><span class="lheader__limit">/ 60:00</span></div>
          <button class="theme-toggle" id="themeToggle" title="라이트/다크 전환"><span class="theme-toggle__knob"></span></button>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <main class="content">
        <div class="progress-cap" id="progress"></div>
        <div class="ops-wrap">
          <div class="ops" id="opsScroll"><div class="q" id="q"></div></div>
        </div>
      </main>
    </div>

    <!-- 계산기 키패드 (주관식) — 안은 scripts/keypad.js가 채운다 -->
    <div class="keypad keypad--float" id="keypad" role="dialog" aria-label="숫자 입력"></div>

    <!-- 하단 콘솔 바 -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-type-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn"><img src="assets/icons/ico-note.svg" alt="" /><span>연습장</span></button>
          </div>
          <div class="bar__group">
            <p class="guide" role="status" aria-live="polite" hidden><i class="guide__lamp"></i><span class="guide__text"></span></p>
            <button class="toolbtn toolbtn--primary" id="nextBtn" disabled><img src="assets/icons/ico-summary.svg" alt="" /><span>다음 문제</span></button>
            <button class="toolbtn toolbtn--primary" id="submitBtn" disabled hidden><img src="assets/icons/ico-summary.svg" alt="" /><span>제출하기</span></button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-type-left.svg" alt="" />
    </div>
  </div>

  <!-- 과목 판정(수학 · 과학) — 화면 스크립트보다 먼저 -->

  <!-- 연습장 캔버스 (공용) -->

  <!-- 검수용 디버그 패널 (?debug=1 일 때만 보임) -->
  <script src="scripts/debug-panel.js?v=20261016"></script>
  <!-- 키패드 물리 키보드 입력 (공용) -->
  <script src="scripts/pop-place.js?v=20261016"></script>
  <script src="scripts/keypad.js?v=20261016"></script>
  <script src="scripts/keypad-input.js?v=20261016"></script>
  <script src="scripts/learn-guide.js?v=20261016"></script>

  <script src="scripts/type-quiz-data-math.js?v=20261016"></script>
  <script src="scripts/type-quiz-data-sci.js?v=20261016"></script>
  <script src="scripts/type-quiz.js?v=20261016"></script>
  <script src="scripts/learn-timer.js?v=20261016"></script>
  <script src="scripts/learn-exit.js?v=20261016"></script>
