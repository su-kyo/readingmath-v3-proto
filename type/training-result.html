<!DOCTYPE html>
<!-- 결과 화면 = 항상 다크 계기판 (A층 우주와 같은 취급 · 토글 없음 — Phase 7 사용자 결정) -->
<html lang="ko" data-section="type" data-theme="dark">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유형 훈련 · 학습 결과 — 리딩수학과학</title>
  <link rel="stylesheet" href="styles/tokens.css?v=20260828" />
  <link rel="stylesheet" href="styles/base.css?v=20260828" />
  <link rel="stylesheet" href="styles/components.css?v=20260828" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20260828" />
  <link rel="stylesheet" href="styles/result.css?v=20260828" />
  <link rel="stylesheet" href="styles/type.css?v=20260828" />
  <link rel="stylesheet" href="styles/monitor.css?v=20260828" />
  <style>
    /* ===================================================================
       유형 훈련 '학습 결과' — Phase 7 ① 계기판 어휘 (개념 shared/training-result와
       같은 골격, 유형(틸) 리테마). 총점 = 별 + 점수(상위 종합),
       단계별 행 = 육각 뱃지 + 문항 LED. 「보기」 = 스텝 결과 스크린창(보조 모니터).
       =================================================================== */

    /* 겹 구조 덜어내기 — 학습 셸의 프레임 층(테두리+여백)을 없애고 베젤이 곧 프레임 */
    .content { flex-direction: column; overflow: hidden;
      padding: 0; border: none; background: transparent; box-shadow: none;
      --rate: var(--teal-300); }

    /* ===== 베젤 (하드웨어 — 학습 화면·스텝 결과와 같은 테마 림) ===== */
    .hwf { flex: 1; min-height: 0; display: flex; flex-direction: column;
      background: var(--th-static); border-radius: var(--r-frame) var(--r-frame) 0 0; padding: var(--sp-8) var(--sp-8) 0; box-shadow: var(--shadow-2); }
    .hwf__hd { flex: none; display: flex; align-items: center; gap: var(--sp-8); flex-wrap: wrap; padding: var(--sp-6) var(--sp-8) var(--sp-12) var(--sp-16); }
    .hwf__ttl { color: var(--n-000); font-size: var(--fs-19); font-weight: var(--fw-heavy); letter-spacing: -0.02em; }
    .hwf__chips { margin-left: auto; display: flex; gap: var(--sp-6); flex-wrap: wrap; }
    /* 칩 = 림과 같은 계열의 한두 단계 어두운 톤온톤 */
    .chip { display: inline-flex; align-items: center; gap: var(--sp-6); padding: var(--sp-4) var(--sp-12); border-radius: var(--r-full);
      background: color-mix(in srgb, var(--th-static) 45%, var(--n-900)); color: var(--n-050); font-size: var(--fs-13); font-weight: var(--fw-semibold); }
    .chip b { font-weight: var(--fw-bold); }
    .chip--round { font-weight: var(--fw-heavy); letter-spacing: .02em; }
    .chip--warn { color: var(--amber-200); }
    .chip--warn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn-solid); }
    .chip[hidden] { display: none; }

    /* ===== LCD 판독 화면 (스캔라인은 스크롤을 따라간다) ===== */
    .hwf__screen { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      border-radius: var(--r-30) var(--r-30) 0 0;
      background-color: var(--n-900);
      background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 5px);
      background-attachment: local;
      padding: clamp(20px,2.4vw,30px) clamp(18px,2.2vw,28px) 96px;
      display: flex; flex-direction: column; gap: clamp(18px,2vw,24px); }
    .hwf__screen::-webkit-scrollbar { width: 10px; }
    .hwf__screen::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--rate) 24%, transparent); border-radius: var(--r-full); border: 3px solid transparent; background-clip: padding-box; }
    .hwf__screen { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--rate) 26%, transparent) transparent; }

    /* ===== 총점(별+점수 — 스텝 게이지와 다른 위계) + 단계별 표 ===== */
    .tsum { display: flex; align-items: center; gap: clamp(20px,3vw,40px); }
    .score { flex: none; display: flex; flex-direction: column; align-items: center; gap: var(--sp-8); min-width: 170px; }
    .score img { width: clamp(84px,9vw,110px); height: auto; filter: drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
    .score__val { display: flex; align-items: baseline; gap: var(--sp-4); color: var(--n-050); }
    .score__val b { font-family: var(--font-mono); font-size: clamp(46px,5vw,58px); font-weight: var(--fw-bold); line-height: 1; }
    .score__val span { font-size: var(--fs-22); font-weight: var(--fw-bold); }
    .score__lb { font-size: var(--fs-13); color: var(--n-300); }

    .tbl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-8); }
    .trow { display: grid; grid-template-columns: minmax(128px,1fr) 52px minmax(130px,1.3fr) 84px 62px 74px;
      align-items: center; gap: clamp(8px,1.2vw,16px); padding: var(--sp-8) var(--sp-12); }
    .thead { padding-bottom: 0; }
    .thead .tcell { color: var(--n-300); font-size: var(--fs-13); font-weight: var(--fw-semibold); }
    .trow--data { background: rgba(255,255,255,.04); border-radius: var(--r-12); }
    .trow--total { background: rgba(255,255,255,.09); border-radius: var(--r-12); }
    .tcell { display: flex; align-items: center; justify-content: center; font-family: var(--font-sans); color: var(--n-050); min-width: 0; }
    .tcell--name { justify-content: flex-start; gap: var(--sp-8); }
    .tnum { width: 24px; height: 24px; border-radius: var(--r-8); background: var(--th-solid); color: var(--n-000);
      display: inline-flex; align-items: center; justify-content: center; font-size: var(--fs-14); font-weight: var(--fw-bold); flex: none; }
    .tname { font-size: clamp(15px,1.4vw,18px); font-weight: var(--fw-heavy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tgrade { height: 36px; }
    .tst { font-family: var(--font-mono); font-size: var(--fs-16); }
    .tst small { color: var(--n-300); font-size: var(--fs-13); }
    .tpc { font-family: var(--font-mono); font-size: var(--fs-16); color: var(--rate); }
    .seg { display: flex; gap: var(--sp-4); width: 100%; }
    .seg i { flex: 1; height: 12px; border-radius: var(--r-4); background: rgba(255,255,255,.07);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); transition: background var(--t-fast); }
    .seg i.on { background: var(--rate); box-shadow: 0 0 10px color-mix(in srgb, var(--rate) 35%, transparent); }
    .tview { padding: var(--sp-6) 0; width: 100%; max-width: 70px; border-radius: var(--r-8); border: none; background: transparent;
      box-shadow: inset 0 0 0 1px var(--rate); color: var(--rate);
      font-family: var(--font-sans); font-weight: var(--fw-bold); font-size: var(--fs-14); cursor: pointer; transition: background var(--t-fast); }
    .tview:hover { background: color-mix(in srgb, var(--rate) 14%, transparent); }

    /* ===== 코멘트 (LCD 하단 판독 텍스트) ===== */
    .comment { border-top: 1px dashed rgba(255,255,255,.14); padding-top: var(--sp-16);
      font-family: var(--font-sans); font-size: clamp(15px,1.4vw,17px); line-height: 1.7;
      color: var(--n-050); white-space: pre-line; }

    /* ===== 「보기」 스크린창 — 스텝 결과 판독 (보조 모니터 + LCD) ===== */
    #stepMon { --mon-w: 720px; }
    .monitor__screen--lcd { position: relative; overflow: hidden;
      background-color: var(--n-900);
      background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 5px);
      padding: clamp(26px,3vw,38px); --rate: var(--teal-300); }
    @property --pct { syntax: '<number>'; inherits: true; initial-value: 0; }
    .mstep { display: flex; align-items: center; justify-content: center; gap: clamp(24px,3.4vw,52px); flex-wrap: wrap; }

    /* 스크린창 안 문항 판독 — 스텝 결과 화면과 같은 구성 */
    .qgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: var(--sp-8); margin-top: clamp(18px,2.2vw,26px); }
    .qcell { display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1.04;
      border-radius: var(--r-12); font-family: var(--font-mono); font-size: var(--fs-19); font-weight: var(--fw-bold);
      background: rgba(255,255,255,.05); color: var(--n-300); transition: background var(--t-fast); }
    .qcell.ok { background: var(--rate); color: var(--n-900); box-shadow: 0 0 14px color-mix(in srgb, var(--rate) 32%, transparent); }
    .qcell.no { color: var(--red-400); box-shadow: inset 0 0 0 1.5px var(--no-vivid); }

    /* 하단바 = 유형(크림 트레이) */

    /* 토스트 */
    .rtoast { position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%) translateY(10px); z-index: var(--z-toast); padding: var(--sp-8) var(--sp-16); border-radius: var(--r-full); font-family: var(--font-sans); font-size: var(--fs-14); font-weight: var(--fw-semibold); background: rgba(6,34,29,.94); color: var(--n-000); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
    .rtoast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 900px) {
      .tsum { flex-direction: column; }
      .trow { grid-template-columns: minmax(110px,1fr) 44px minmax(90px,1.2fr) 72px 54px 64px; }
    }
  </style>
</head>
<body class="learn-body">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong">과학 중등 1-1</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide">2단원 생물의 구성과 다양성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--hide">(1) 생물의 구성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong">유형 훈련 결과</span>
        </nav>
        <div class="lheader__actions">
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <main class="content">
        <div class="hwf">
          <div class="hwf__hd">
            <span class="hwf__ttl">유형 훈련 결과</span>
            <span class="hwf__chips">
              <span class="chip chip--round">ROUND 1</span>
              <span class="chip">완료 <b>2024-04-15 16:05</b></span>
              <span class="chip">소요 <b>41:20</b></span>
              <span class="chip chip--warn" id="overPill">시간 초과 감점</span>
            </span>
          </div>
          <div class="hwf__screen">
            <!-- 총점 + 단계별 표 -->
            <div class="tsum">
              <div class="score">
                <img id="totalStar" src="assets/icons/star/star-a.svg" alt="등급" />
                <div class="score__val"><b id="score">0</b><span>점</span></div>
                <span class="score__lb">총점</span>
              </div>
              <div class="tbl">
                <div class="trow thead">
                  <div class="tcell tcell--name">학습 구분</div>
                  <div class="tcell">등급</div>
                  <div class="tcell">문항</div>
                  <div class="tcell">정답</div>
                  <div class="tcell">정답률</div>
                  <div class="tcell">상세</div>
                </div>
                <div id="rows" style="display:flex;flex-direction:column;gap:8px"></div>
                <div class="trow trow--total" id="totalRow"></div>
              </div>
            </div>
            <!-- 코멘트 -->
            <div class="comment" id="comment"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- 하단 콘솔 바 (유형) -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-type-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn"><img src="assets/icons/ico-note.svg" alt="" /><span>연습장</span></button>
            <button class="toolbtn" id="noteBtn"><img src="assets/icons/ico-note.svg" alt="" /><span>오답노트 확인하기</span></button>
          </div>
          <div class="bar__group">
            <button class="toolbtn toolbtn--primary" id="homeBtn"><img src="assets/icons/ico-summary.svg" alt="" /><span>홈으로</span></button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-type-left.svg" alt="" />
    </div>
  </div>

  <!-- 「보기」 → 스텝 결과 스크린창 (공용 보조 모니터) -->
  <div class="monitor" id="stepMon" aria-hidden="true">
    <div class="monitor__dim" data-mclose></div>
    <div class="monitor__rig">
      <div class="monitor__mount"><i></i><i></i></div>
      <div class="monitor__frame">
        <div class="monitor__hd">
          <span class="monitor__lamps"><i class="is-live"></i><i></i><i></i></span>
          <span class="monitor__ttl" id="stepMonTtl">스텝 결과</span>
          <button class="monitor__x" data-mclose aria-label="닫기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="monitor__screen monitor__screen--lcd">
          <div class="mstep">
            <div class="dial dial--sm" id="stepDial">
              <div class="dial__ticks"></div>
              <div class="dial__face"></div>
              <div class="dial__ticks dial__ticks--over"></div>
              <div class="dial__needle"></div>
              <div class="dial__read"><b><span id="stepRate">0</span><small>%</small></b><span>정답률</span></div>
            </div>
            <div class="rmeters">
              <div class="win"><span class="win__lb">등급</span><img id="stepBadge" src="assets/img/grade/grade-b.webp" alt="등급" /></div>
              <div class="win"><span class="win__lb">정답</span><b id="stepScore">0/0</b></div>
            </div>
          </div>
          <div class="qgrid" id="stepGrid"></div>
        </div>
        <div class="monitor__chin"><span class="monitor__slit"></span></div>
      </div>
    </div>
  </div>

  <div class="rtoast" id="toast"></div>

  <!-- 연습장 캔버스 (공용) · 검수용 디버그 패널 (?debug=1) -->
  <script src="scripts/scratchpad.js?v=20260828"></script>
  <script src="scripts/debug-panel.js?v=20260828"></script>
  <script src="scripts/type-training-result.js?v=20260828"></script>
</body>
</html>
