<!DOCTYPE html>
<html lang="ko" data-section="type" data-theme="light">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유형 훈련 · 해설 보기 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <link rel="stylesheet" href="styles/tokens.css?v=20261014-2" />
  <link rel="stylesheet" href="styles/base.css?v=20261014-2" />
  <link rel="stylesheet" href="styles/components.css?v=20261014-2" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261014-2" />
  <link rel="stylesheet" href="styles/type.css?v=20261014-2" />
  <link rel="stylesheet" href="styles/screens/type-review.css?v=20261014-2" />
</head>
<body class="learn-body">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong">과학 중등 1-1</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide">2단원 생물의 구성과 다양성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--hide">(1) 생물의 구성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb">유형 훈련</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong">해설 보기</span>
        </nav>
        <div class="lheader__actions">
          <div class="lheader__timer is-paused" id="hdrTimer" title="제출 시점 (정지)"><img src="assets/icons/ico-stopwatch.svg" alt="경과 시간(정지)" /><span id="timer">00:00</span></div>
          <button class="theme-toggle" id="themeToggle" title="라이트/다크 전환"><span class="theme-toggle__knob"></span></button>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <main class="content">
        <div class="progress-cap" id="progress"></div>
        <button class="nav-arrow nav-arrow--prev" id="prevArrow" aria-label="이전 문제">‹</button>
        <button class="nav-arrow nav-arrow--next" id="nextArrow" aria-label="다음 문제">›</button>
        <div class="ops-wrap">
          <div class="ops" id="opsScroll"><div class="q" id="q"></div></div>
        </div>
        <div class="ops__foot">
          <button class="btn-move" id="nextBtn">다음 문제</button>
        </div>
      </main>
    </div>

    <!-- 하단 콘솔 바 (유형) -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-type-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group"><button class="toolbtn"><img src="assets/icons/ico-note.svg" alt="" /><span>연습장</span></button></div>
          <div class="bar__group"><button class="toolbtn toolbtn--primary"><img src="assets/icons/ico-summary.svg" alt="" /><span>결과보기</span></button></div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-type-left.svg" alt="" />
    </div>
  </div>

  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/scratchpad.js?v=20261014-2"></script>
  <script src="scripts/type-review.js?v=20261014-2"></script>
  <script src="scripts/learn-exit.js?v=20261014-2"></script>
</body>
</html>
