<!DOCTYPE html>
<!-- 결과 화면 = 항상 다크 계기판 (A층 우주와 같은 취급 · 토글 없음 — Phase 7 사용자 결정) -->
<html lang="ko" data-section="type" data-theme="dark">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2차 유형 문제 완료 · 스텝 결과 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <link rel="stylesheet" href="styles/tokens.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/base.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/components.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/result.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/type.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/screens/type-result.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/scratchpad.css?v=20261015-13" />
</head>
<body class="learn-body" style="--subj:var(--th-accent)">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong">과학 중등 1-1</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide">2단원 생물의 구성과 다양성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--hide">(1) 생물의 구성</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb">유형 훈련</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong">2차 유형 문제</span>
        </nav>
        <div class="lheader__actions">
          <div class="lheader__timer is-paused" id="hdrTimer" title="제출 시점 (정지)"><img src="assets/icons/ico-stopwatch.svg" alt="경과 시간(정지)" /><span class="lheader__time" id="timer">08:32</span><span class="lheader__limit">/ 60:00</span></div>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <div class="rframe">
        <!-- 좌측 -->
        <section class="rmain">
          <div class="rhero">
            <div class="dial" id="rateDial">
              <div class="dial__ticks"></div>
              <div class="dial__face"></div>
              <div class="dial__ticks dial__ticks--over"></div>
              <div class="dial__needle"></div>
              <div class="dial__read"><b><span id="rate">0</span><small>%</small></b><span>정답률</span></div>
            </div>
            <div class="rinfo">
              <div class="rhead">
                <h1 class="rtitle">2차 유형 문제 완료!</h1>
                <h2 class="runit">(1) 생물의 구성</h2>
              </div>
              <div class="rmeters">
                <div class="win"><span class="win__lb">등급</span><img id="summaryBadge" src="assets/img/grade/grade-b.webp" alt="등급" /></div>
                <div class="win"><span class="win__lb">정답</span><b><span id="score">0</span><small id="total">/10</small></b></div>
              </div>
            </div>
          </div>
          <div class="qgrid" id="qgrid"></div>
        </section>

        <!-- 우측: 조작 패널. 스텝 4개 = 훈련 결과(type-training-result.js STAGES)와 정합 -->
        <aside class="rside">
          <div class="rside__hd">
            <span class="rside__title">학습 진행 현황</span>
            <span class="rside__prog" data-prog><i class="on"></i><i class="on"></i><i class="on"></i><i></i><b>3<small>/4</small></b></span>
          </div>
          <div class="rside__list">
            <div class="step-card is-done">
              <i class="lamp2"></i>
              <div class="step-card__id"><span class="step-card__no">STEP 1</span><span class="step-card__name">1차 유형 문제</span></div>
              <img class="step-card__grade" src="assets/img/grade/grade-step-s.webp" alt="S" />
            </div>
            <div class="step-card is-done">
              <i class="lamp2"></i>
              <div class="step-card__id"><span class="step-card__no">STEP 2</span><span class="step-card__name">1차 유사 문제</span></div>
              <img class="step-card__grade" src="assets/img/grade/grade-step-a.webp" alt="A" />
            </div>
            <div class="step-card is-current is-done">
              <i class="lamp2"></i>
              <div class="step-card__id"><span class="step-card__no">STEP 3</span><span class="step-card__name">2차 유형 문제</span></div>
              <img class="step-card__grade" id="sideBadge" src="assets/img/grade/grade-step-b.webp" alt="등급" />
            </div>
            <div class="step-card is-open" data-go="type/quiz.html" data-demo-grade="a">
              <i class="lamp2"></i>
              <div class="step-card__id"><span class="step-card__no">STEP 4</span><span class="step-card__name">2차 유사 문제</span></div>
              <button class="key">시작하기 ›</button>
            </div>
          </div>
          <button class="pgo" id="trainResultBtn" data-go="type/training-result.html" style="display:none">훈련 결과 보기 ›</button>
        </aside>
      </div>
    </div>

    <!-- 하단 콘솔 바 (유형) -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-type-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn"><img src="assets/icons/ico-note.svg" alt="" /><span>연습장</span></button>
            <button class="toolbtn" id="reviewBtn"><img src="assets/icons/ico-summary.svg" alt="" /><span>해설 보기</span></button>
            <button class="toolbtn" data-home><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg><span>홈으로</span></button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-type-left.svg" alt="" />
    </div>
  </div>

  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/scratchpad.js?v=20261015-13"></script>
  <script src="scripts/type-result.js?v=20261015-13"></script>
  <script src="scripts/step-progress.js?v=20261015-13"></script>
  <script src="scripts/learn-timer.js?v=20261015-13"></script>
  <script src="scripts/learn-exit.js?v=20261015-13"></script>
</body>
</html>
