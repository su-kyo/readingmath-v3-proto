<!DOCTYPE html>
<html lang="ko" data-section="space">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>행성 메인 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <link rel="stylesheet" href="styles/tokens.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/base.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/gnb.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/screens/nav-home.css?v=20261016-6" />
</head>
<body>
  <div class="home">
    <header class="gnb">
      <div class="gnb__info">
        <span class="gnb__logo"></span>
        <span class="gnb__name">김학생</span>
      </div>
      <nav class="gnb__modes">
        <button class="gnb__mode m-basic is-active">기본 모드</button>
        <button class="gnb__mode m-free" data-go="nav/freemode.html">자유 모드</button>
        <button class="gnb__mode m-exam" data-go="exam/home.html">시험 대비</button>
        <button class="gnb__mode m-assign" data-go="assignment/home.html">과제 센터<span class="gnb__mode__dot"></span></button>
      </nav>
      <div class="gnb__icons">
        <button class="gnb__ico" title="도움말"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" /></svg></button>
        <button class="gnb__ico" title="오류 신고"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 1 1 10 0v6" /><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z" /><path d="M21 12h1" /><path d="M18.5 4.5 18 5" /><path d="M2 12h1" /><path d="M12 2v1" /><path d="m4.929 4.929.707.707" /><path d="M12 12v6" /></svg></button>
        <button class="gnb__ico" title="공지사항"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z" /><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6" /></svg><span class="gnb__dot"></span></button>
        <button class="gnb__ico" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg></button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="safe" id="safe">
        <!-- 오브젝트(scenery) 주입 -->
        <div class="hero">
          <div class="bubble" id="bubble">
            <b>(1) 받아올림이 없는 세 자리 수의 덧셈</b>의 <b>개념 훈련</b>을 시작해보세요!
          </div>
          <img class="char" id="char" alt="캐릭터" />
          <div class="shadow"></div>
        </div>
      </div>
      <button class="cta" id="ctaBtn">시작하기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="scripts/debug-panel.js?v=20261016-6"></script>
  <script src="scripts/subject.js?v=20261016-6"></script>
  <script src="scripts/nav-home.js?v=20261016-6"></script>
  <script src="scripts/gnb-drawer.js?v=20261016-6"></script>
</body>
</html>
