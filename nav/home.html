<!DOCTYPE html>
<html lang="ko" data-section="space">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>행성 메인 — 리딩수학과학</title>
  <link rel="stylesheet" href="styles/tokens.css?v=25" />
  <link rel="stylesheet" href="styles/base.css?v=7" />
  <link rel="stylesheet" href="styles/gnb.css?v=9" />
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{ font-family:var(--font-sans); background:var(--bg); overflow:hidden; -webkit-font-smoothing:antialiased; }
    .home{ height:100%; display:flex; flex-direction:column; }

    /* ---- 스테이지: 배경만 full-bleed cover ---- */
    .stage{ position:relative; flex:1; min-height:0; overflow:hidden;
      background:var(--blue-300) center 46% / cover no-repeat; display:flex; align-items:center; justify-content:center; }

    /* ---- safe-area: 피그마 프레임 비율(960:670). 오브젝트/캐릭터는 이 안에 갇힌다 ---- */
    .safe{ position:relative; height:100%; aspect-ratio:960 / 670; max-width:100%; width:auto; }

    /* ---- 오브젝트: 단원 하나 = 오브젝트 하나 ----------------------------
       끝낸 단원은 실물로 서 있고, 아직 못 끝낸 단원은 홀로그램(빛)으로 서 있다.
       누르는 판정은 JS가 그림 모양대로 하므로 오브젝트 자체는 포인터를 받지 않는다. */
    .obj{ position:absolute; transform:translate(-50%,-50%); aspect-ratio:1; pointer-events:none; }
    .obj__img{ position:absolute; inset:0; background:center/contain no-repeat; }
    .obj--float{ animation:rm-float 4.8s ease-in-out infinite; }
    @keyframes rm-float{
      0%,100%{ transform:translate(-50%,-50%) translateY(0); }
      50%    { transform:translate(-50%,-50%) translateY(-13px); }
    }
    /* 장식용 앰비언트 모션 — 데모 일관성 위해 reduced-motion에서도 유지 (OS 애니메이션 효과 끔 상태에서도 보이게) */

    /* ══ 완료 = 실물 ══ */
    .obj.is-done{ filter:drop-shadow(0 12px 16px rgba(20,40,90,.26)); }

    /* ══ 미완료 = 홀로그램 ═══════════════════════════════════════════════
       흰색을 「칠하는」 것이 아니라 「빛을 더하는」 방식이다(mix-blend-mode:screen).
       더하기라서 결과가 배경 색을 먹는다 — 파란 학기에선 푸르게, 주황 학기에선
       주황빛으로 빛난다. 그래서 32학기에 학기별 색 지정이 하나도 없다.
       상태 구분은 색이 아니라 형태가 맡는다: 흰 테두리 빛 + 빗금 + 글로우. */
    .obj:not(.is-done) .obj__img{
      filter:grayscale(1) brightness(1.5) contrast(.45)
        drop-shadow(0 0 2.5px rgba(255,255,255,.95))
        drop-shadow(0 0 11px rgba(255,255,255,.5));
      mix-blend-mode:screen;
      /* 빗금은 「덧그린 흰 줄」이 아니라 「몸체에 난 투명한 틈」이다 — 흰 몸체 위에
         흰 줄을 그으면 안 보이기 때문. 멈춰 있는 무늬라 촘촘해도 눈이 아프지 않다. */
      -webkit-mask:repeating-linear-gradient(0deg,
        rgba(0,0,0,.98) 0 3.6px, rgba(0,0,0,.36) 4.2px 4.8px, rgba(0,0,0,.98) 5px) 0 0/100% 70px;
      mask:repeating-linear-gradient(0deg,
        rgba(0,0,0,.98) 0 3.6px, rgba(0,0,0,.36) 4.2px 4.8px, rgba(0,0,0,.98) 5px) 0 0/100% 70px;
    }
    /* 밝은 배경 보완 — screen 블렌드는 「더하기」라 어두운 색이 무효다.
       그래서 배경과 홀로그램 사이에 블렌드되지 않는 옅은 그늘을 한 겹 깐다.
       어두운 학기에선 배경에 묻혀 보이지 않고, 밝은 학기에서만 일한다. */
    .obj:not(.is-done)::after{
      content:""; position:absolute; inset:0; z-index:-1;
      -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat;
      background:rgba(10,25,60,.22); filter:blur(7px); transform:translateY(7px);
    }
    /* 빛 한 줄이 7초에 한 번 몸체를 훑는다(0.14Hz).
       빗금 전체를 흘리면 한 점이 초당 3~4번 명멸해(3~8Hz) 오래 보면 눈이 아프다 —
       그래서 무늬는 세워 두고 빛만 느리게 움직인다. 위치가 아니라 transform으로
       옮기기 때문에 매 프레임 다시 그리지 않는다(성능). */
    .obj__sweep{ position:absolute; inset:0; z-index:1; pointer-events:none; display:none;
      -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat; }
    .obj__sweep i{ position:absolute; left:0; right:0; top:0; height:42%;
      background:linear-gradient(0deg, transparent, rgba(255,255,255,.42) 45%,
        rgba(255,255,255,.46) 55%, transparent);
      will-change:transform;
      animation:sweepUp 7s cubic-bezier(.45,0,.55,1) infinite; animation-delay:var(--d,0s); }
    .obj:not(.is-done) .obj__sweep{ display:block; }
    @keyframes sweepUp{
      0%      { transform:translateY(340%); }
      55%,100%{ transform:translateY(-105%); }
    }
    /* OS 「동작 줄이기」에서는 빛줄기를 멈춘다 (빗금 무늬는 그대로 남는다) */
    @media (prefers-reduced-motion: reduce){
      .obj__sweep i{ animation:none; transform:translateY(120%); opacity:.5; }
    }

    /* ---- 명판 — 올리거나 탭했을 때만, 오브젝트 위쪽 고정 ----------------
       「상자 아래」에 달면 그림이 상자를 얼마나 채우는지에 따라 자리가 제각각이 되고,
       정중앙은 캐릭터와 부딪힌다. 위쪽은 여섯 개가 같은 규칙을 쓰면서도 안 겹친다.

       명판은 오브젝트 「안」에 있지 않다. 오브젝트끼리는 앞뒤가 정해져 있는데
       (뒤에 그린 것이 앞), 명판을 안에 넣으면 그 오브젝트를 통째로 올려야만
       명판이 보인다 — 그러면 올린 오브젝트가 앞의 오브젝트를 뚫고 나온다.
       그래서 명판만 모아 오브젝트 전부보다 위, 캐릭터보다 아래인 층(.plaques)에 둔다.
       각 명판은 자기 오브젝트와 똑같은 자리·크기의 빈 상자(.pl)에 매달려 따라다닌다. */
    .plaques{ position:absolute; inset:0; z-index:25; pointer-events:none; }
    .pl{ position:absolute; transform:translate(-50%,-50%); aspect-ratio:1; }
    .plaque{ position:absolute; left:50%; top:5%; transform:translate(-50%,-7px) scale(.96);
      display:flex; align-items:center; gap:8px; width:max-content; max-width:min(42vw,250px);
      background:var(--n-000); color:var(--n-650); border-radius:var(--r-full);
      padding:6px 14px; font-size:13px; font-weight:700; line-height:1.35;
      box-shadow:0 8px 20px -8px rgba(10,25,60,.5);
      opacity:0; pointer-events:none; transition:opacity .12s, transform .12s; }
    /* 단원명이 길면 이름만 말줄임한다 — 진행 세그먼트는 잘리지 않는다 */
    .plaque__name{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pl.is-hot .plaque, .pl.is-peek .plaque,
    .safe.is-allplaque .plaque{ opacity:1; transform:translate(-50%,0) scale(1); }
    .safe.is-hit{ cursor:pointer; }
    /* 명판이 뜨는 동안 말풍선은 잠시 물러난다 — 중단 오브젝트의 명판 자리와 겹치는데,
       흰 알약 두 개가 포개지면 둘 다 못 읽힌다. 캐릭터는 그대로 남는다(항상 최상위). */
    .bubble{ transition:opacity .12s; }
    .safe.is-plaque .bubble{ opacity:0; }
    /* 진행 세그먼트 — 한 칸 = 소단원 하나, 3단계(미진행 · 진행중=반칸 · 완료) */
    .plaque__segs{ display:flex; gap:3px; flex:none; }
    .plaque__segs i{ width:11px; height:5px; border-radius:var(--r-full); background:var(--n-200); }
    .plaque__segs i.half{ background:linear-gradient(90deg, var(--seg) 0 50%, var(--n-200) 50%); }
    .plaque__segs i.on{ background:var(--seg); }
    .plaque__done{ flex:none; color:var(--seg); font-size:12.5px; font-weight:800; }

    /* ---- 히어로(캐릭터+말풍선) — safe 안, 피그마 캐릭터 위치/크기 ---- */
    /* 행성 대표 캐릭터는 무엇보다 위에 있다 — 오브젝트도 명판도 캐릭터를 못 가린다 */
    .hero{ position:absolute; left:50%; top:62.7%; width:31.25%; transform:translate(-50%,-50%); z-index:30; }
    /* 캐릭터 원본이 아직 없는 학기 — 말풍선만 바닥 가운데에 세운다 */
    .hero.is-nochar{ top:70%; width:auto; }
    .hero.is-nochar .char, .hero.is-nochar .shadow, .hero.is-nochar .bubble::after{ display:none; }
    .hero.is-nochar .bubble{ position:static; transform:none; margin:0; }
    .hero .char{ width:100%; display:block; filter:drop-shadow(0 16px 18px rgba(15,35,80,.4)); }
    .hero .shadow{ position:absolute; left:50%; bottom:-4%; transform:translateX(-50%);
      width:74%; height:8%; border-radius:50%; z-index:-1;
      background:radial-gradient(50% 50% at 50% 50%, rgba(20,40,90,.34), transparent 70%); }
    .bubble{ position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:14px;
      width:max-content; max-width:min(58vw,460px);
      background:var(--n-000); color:var(--n-650); border-radius:19px; padding:14px 22px;
      font-size:15.5px; font-weight:600; line-height:1.5; text-align:center;
      box-shadow:0 12px 30px -12px rgba(10,25,60,.55); }
    .bubble b{ color:var(--hl,var(--blue-600)); font-weight:800; }
    .bubble::after{ content:""; position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
      border:11px solid transparent; border-top-color:var(--n-000); border-bottom:0; }

    /* ---- CTA — 화면 하단 고정(스테이지) ---- */
    .cta{ position:absolute; left:50%; bottom:5%; transform:translateX(-50%); z-index:14;
      display:inline-flex; align-items:center; gap:9px; height:56px; padding:0 34px; border:0;
      border-radius:17px; background:var(--primary); color:var(--n-000); font-family:inherit; font-size:19px;
      font-weight:800; letter-spacing:-.02em; cursor:pointer;
      box-shadow:0 0 0 2px var(--primary-ring), 0 4px 0 var(--primary-deep), 0 14px 26px -12px rgba(3,6,15,.5), inset 0 1px 0 rgba(255,255,255,.3);
      transition:transform .16s, background .16s, box-shadow .16s; }
    .cta:hover{ transform:translateX(-50%) translateY(-3px); background:var(--primary-hover);
      box-shadow:0 0 0 2px var(--primary-ring), 0 4px 0 var(--primary-deep), 0 18px 30px -12px rgba(3,6,15,.6), inset 0 1px 0 rgba(255,255,255,.3); }
    .cta svg{ width:20px; height:20px; }

    .toast{ position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(16px); z-index:40;
      background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:11px 18px;
      border-radius:12px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none;
      transition:.2s; box-shadow:var(--shadow-2); font-family:var(--font-sans); }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="home">
    <header class="gnb">
      <div class="gnb__info">
        <span class="gnb__logo"></span>
        <span class="gnb__name">김학생</span>
      </div>
      <nav class="gnb__modes">
        <button class="gnb__mode m-basic is-active">기본 모드</button>
        <button class="gnb__mode m-free" data-go="nav/freemode.html">자유 모드</button>
        <button class="gnb__mode m-exam" data-go="exam/home.html">시험 대비</button>
        <button class="gnb__mode m-assign" data-go="assignment/home.html">과제 센터<span class="gnb__mode__dot"></span></button>
      </nav>
      <div class="gnb__icons">
        <button class="gnb__ico" title="도움말"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1" fill="currentColor" stroke="none"/></svg></button>
        <button class="gnb__ico" title="오류 신고"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg></button>
        <button class="gnb__ico" title="공지사항"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h3l7 4V5L7 9H4zM18 8a5 5 0 0 1 0 8"/></svg><span class="gnb__dot"></span></button>
        <button class="gnb__ico" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="safe" id="safe">
        <!-- 오브젝트(scenery) 주입 -->
        <div class="hero">
          <div class="bubble" id="bubble">
            <b>(1) 받아올림이 없는 세 자리 수의 덧셈</b>의 <b>개념 훈련</b>을 시작해보세요!
          </div>
          <img class="char" id="char" alt="캐릭터" />
          <div class="shadow"></div>
        </div>
      </div>
      <button class="cta" id="ctaBtn">시작하기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="scripts/debug-panel.js?v=3"></script>
  <script>
    (function(){
      /* 학기 16종 × 과목 2종 = 홈 32화면. 학기 선택은 공용 드로어(gnb-drawer.js)에 있다. */
      var SEMS = ['elem-3-1','elem-3-2','elem-4-1','elem-4-2','elem-5-1','elem-5-2','elem-6-1','elem-6-2',
                  'mid-1-1','mid-1-2','mid-2-1','mid-2-2','mid-3-1','mid-3-2','high-1-1','high-1-2'];

      var qs = new URLSearchParams(location.search);
      var subject = qs.get('subject') === 'science' ? 'science' : 'math';
      var sem = qs.get('sem');
      if(SEMS.indexOf(sem) < 0) sem = 'elem-3-1';
      var sc = (subject === 'science') ? 'sci' : 'math';
      var key = sc + '-' + sem;
      var dir = 'assets/img/home/' + key;
      try{ localStorage.setItem('rm-subject', subject); localStorage.setItem('rm-sem', sem); }catch(e){}

      /* 배치는 과목당 한 벌로 고정한다. 학기가 바뀌어도 좌표는 그대로고 그림만 갈아끼운다.
         좌표 = safe 기준 % (cx/cy=중심, w=너비%). 원본의 자리 규칙은 32학기가 모두 같다:
         1=중앙 큰 것, 2·3=좌우 중단, 4·5=좌우 하단, 6=공중에 뜬 작은 것. */
      var LAYOUT = {
        math: { ratio:'960 / 670', objects:[
          { n:1, cx:50.0, cy:39.4, w:49.4 }, { n:2, cx:19.4, cy:48.4, w:35.8 }, { n:3, cx:83.3, cy:48.9, w:34.2 },
          { n:4, cx:17.7, cy:77.8, w:32.4 }, { n:5, cx:81.4, cy:78.1, w:31.5 }, { n:6, cx:76.4, cy:17.4, w:22.7, float:true }
        ] },
        sci:  { ratio:'1280 / 670', objects:[
          { n:1, cx:50.0, cy:40.8, w:32.1 }, { n:2, cx:26.6, cy:56.5, w:23.5 }, { n:3, cx:75.0, cy:54.3, w:23.4 },
          { n:4, cx:26.1, cy:78.1, w:25.1 }, { n:5, cx:73.5, cy:80.3, w:23.1 }, { n:6, cx:69.6, cy:17.4, w:14.9, float:true }
        ] }
      };

      /* ── 단원 진행 ────────────────────────────────────────────────────
         세그먼트 한 칸 = 소단원 하나이고, 칸은 3단계다: 미진행 · 진행중(반칸) · 완료.
         「완료한 소단원 수 / 전체」로만 세면 소단원이 1개뿐인 단원은 0%↔100%밖에
         없어서 세그먼트가 의미를 잃는다 — 중간 단계를 두어 그 문제를 없앴다.
         값은 nav/curriculum.html의 UNITS를 소단원 단위로 요약한 것과 같은 모델이다:
         개념·유형·서술형 3훈련이 전부 끝나면 '완료', 하나라도 손댔으면 '진행중'.
         단원의 소단원이 전부 완료면 그 단원이 완료 — 오브젝트가 실물이 된다. */
      var UNITS = {
        'math-elem-3-1': [
          { name:'덧셈과 뺄셈',   subs:['doing','todo'] },
          { name:'평면도형',     subs:['done'] },
          { name:'나눗셈',       subs:['todo'] },
          { name:'길이와 시간',   subs:['todo'] },
          { name:null,           subs:['todo','todo'] },
          { name:null,           subs:['doing','todo'] }
        ]
      };
      /* 나머지 31학기는 소단원 문구·개수 데이터가 아직 없다. 단원 번호만 세우고
         진행 형태는 같게 둬서 32학기를 나란히 비교할 수 있게 한다. */
      var UNITS_FALLBACK = [
        { name:null, subs:['doing','todo'] }, { name:null, subs:['done'] },
        { name:null, subs:['todo'] },         { name:null, subs:['todo'] },
        { name:null, subs:['todo','todo'] },  { name:null, subs:['doing','todo'] }
      ];

      /* 실제 소단원명이 확정된 학기만 문구를 갖는다. 나머지는 학기명으로 안내한다. */
      var MSG = {
        'math-elem-3-1':'<b>(1) 받아올림이 없는 세 자리 수의 덧셈</b>의 <b>개념 훈련</b>을 시작해보세요!',
        'math-mid-3-1' :'<b>(1) 제곱근과 실수</b>의 <b>개념 훈련</b>을 시작해보세요!',
        'math-mid-3-2' :'<b>(1) 삼각비</b>의 <b>개념 훈련</b>을 시작해보세요!',
        'sci-elem-3-1' :'<b>(1) 물체를 밀거나 당기기, 수평 잡기</b>의 <b>유형 훈련</b>을 시작해보세요!',
        'sci-mid-3-1'  :'<b>(1) 화학 반응의 규칙</b>의 <b>유형 훈련</b>을 시작해보세요!',
        'sci-mid-3-2'  :'<b>(1) 역학적 에너지</b>의 <b>개념 훈련</b>을 시작해보세요!'
      };
      /* 캐릭터 원본이 있는 학기 — 나머지는 말풍선만 세운다 */
      var HAS_CHAR = { 'math-elem-3-1':1, 'math-mid-3-1':1, 'math-mid-3-2':1,
                       'sci-elem-3-1':1, 'sci-mid-3-1':1, 'sci-mid-3-2':1 };

      var LVL = { elem:'초등', mid:'중등', high:'고등' };
      function semLabel(s){
        var p = s.split('-');
        return LVL[p[0]] + ' ' + p[1] + '학년 ' + p[2] + '학기';
      }

      var cfg = LAYOUT[sc];

      var stage = document.getElementById('stage');
      var safe = document.getElementById('safe');
      safe.style.aspectRatio = cfg.ratio;
      stage.style.backgroundImage = 'url("' + dir + '/bg.webp")';

      var hero = safe.querySelector('.hero');
      if(HAS_CHAR[key]) document.getElementById('char').src = dir + '/character.webp';
      else hero.classList.add('is-nochar');

      var bub = document.getElementById('bubble');
      bub.style.setProperty('--hl', subject === 'science' ? 'var(--teal-600)' : 'var(--blue-600)');
      bub.innerHTML = MSG[key] || ('<b>' + semLabel(sem) + '</b> 학습을 시작해보세요!');

      /* ── 오브젝트 세우기 ─────────────────────────────────────────────── */
      var units = UNITS[key] || UNITS_FALLBACK;
      var SEG = subject === 'science' ? 'var(--teal-500)' : 'var(--blue-500)';
      var objs = [];

      function isDone(u){ return u.subs.every(function(x){ return x === 'done'; }); }

      function plaqueHTML(n, u){
        var label = n + '단원' + (u.name ? ' · ' + u.name : '');
        var inner = isDone(u)
          ? '<span class="plaque__done">✓ 완료</span>'
          : '<span class="plaque__segs">' + u.subs.map(function(x){
              return '<i class="' + (x === 'done' ? 'on' : x === 'doing' ? 'half' : '') + '"></i>';
            }).join('') + '</span>';
        return '<span class="plaque"><span class="plaque__name">' + label + '</span>' + inner + '</span>';
      }

      /* 명판 층 — 오브젝트 전부보다 위, 캐릭터보다 아래 */
      var plaques = document.createElement('div');
      plaques.className = 'plaques';
      safe.insertBefore(plaques, hero);

      function build(list){
        objs.forEach(function(el){ el.remove(); });
        objs = []; hot = null;
        plaques.innerHTML = '';
        cfg.objects.forEach(function(o){
          var u = list[o.n - 1] || { name:null, subs:['todo'] };
          var src = dir + '/obj-' + o.n + '.webp';
          var el = document.createElement('div');
          el.className = 'obj' + (o.float ? ' obj--float' : '') + (isDone(u) ? ' is-done' : '');
          el.style.left = o.cx + '%'; el.style.top = o.cy + '%';
          el.style.width = o.w + '%';
          el.style.setProperty('--m', 'url("' + src + '")');   // 그늘·빛줄기가 몸체 모양을 따라가게
          el.style.setProperty('--d', (o.n * 0.85).toFixed(2) + 's');   // 여섯이 한꺼번에 밝아지지 않게
          el.innerHTML = '<span class="obj__img" style="background-image:url(\'' + src + '\')"></span>'
            + '<span class="obj__sweep"><i></i></span>';
          safe.insertBefore(el, plaques);   // 명판 층·캐릭터보다 뒤(먼저 그려짐)
          objs.push(el);
          loadAlpha(el, src);

          /* 명판이 매달릴 빈 상자 — 오브젝트와 똑같은 자리·크기(뜬 것은 같이 뜬다) */
          var pl = document.createElement('div');
          pl.className = 'pl' + (o.float ? ' obj--float' : '');
          pl.style.left = o.cx + '%'; pl.style.top = o.cy + '%';
          pl.style.width = o.w + '%';
          pl.style.setProperty('--seg', SEG);
          pl.innerHTML = plaqueHTML(o.n, u);
          plaques.appendChild(pl);
          el._pl = pl;
        });
      }

      /* ── 눌리는 자리를 그림 모양대로 ──────────────────────────────────
         오브젝트 그림은 네모난 파일이라 로켓 옆 빈 공간까지 상자에 들어간다.
         그대로 두면 아무것도 없는 곳을 눌러도 명판이 떠서 오작동으로 읽힌다.
         그래서 그림을 한 번 64×64로 줄여 「어디가 칠해져 있는지」 표를 만들어 두고,
         누른 지점이 표에서 비어 있으면 무시한다. 표는 그림당 한 번만 만든다.
         홈의 오브젝트 원본은 32학기 192장이 모두 정사각이고 상자도 정사각이라
         (background-size:contain) 상자 안 좌표가 그림 좌표와 그대로 일치한다. */
      var G = 64;
      function loadAlpha(el, src){
        var im = new Image();
        im.onload = function(){
          try{
            var c = document.createElement('canvas'); c.width = c.height = G;
            var x = c.getContext('2d');
            x.drawImage(im, 0, 0, G, G);
            var d = x.getImageData(0, 0, G, G).data;
            var raw = new Uint8Array(G * G), i;
            for(i = 0; i < G * G; i++) raw[i] = d[i * 4 + 3] > 90 ? 1 : 0;
            /* 손가락은 정확하지 않다 — 칠해진 자리를 한 칸(약 1.6%)씩 넓혀 가장자리를 너그럽게 */
            var m = new Uint8Array(G * G);
            for(var y = 0; y < G; y++) for(var xx = 0; xx < G; xx++){
              if(!raw[y * G + xx]) continue;
              for(var dy = -1; dy <= 1; dy++) for(var dx = -1; dx <= 1; dx++){
                var ny = y + dy, nx = xx + dx;
                if(ny >= 0 && ny < G && nx >= 0 && nx < G) m[ny * G + nx] = 1;
              }
            }
            el._alpha = m;
          }catch(e){ el._alpha = null; }   /* 못 읽으면 상자 전체를 누른 것으로 본다 */
        };
        im.src = src;
      }

      function hitTest(cx, cy){
        for(var i = objs.length - 1; i >= 0; i--){   // 뒤에 그린 것이 위에 있다
          var el = objs[i], b = el.getBoundingClientRect();
          if(cx < b.left || cx > b.right || cy < b.top || cy > b.bottom) continue;
          if(!el._alpha) return el;
          var gx = Math.min(G - 1, Math.floor((cx - b.left) / b.width * G));
          var gy = Math.min(G - 1, Math.floor((cy - b.top) / b.height * G));
          if(el._alpha[gy * G + gx]) return el;
        }
        return null;
      }

      /* 마우스는 지나가면 뜨고, 손가락은 탭했을 때만 뜬다(지나간 자리에 명판이 남지 않게) */
      var hot = null, lastMove = 0;
      function syncBubble(){
        safe.classList.toggle('is-plaque',
          safe.classList.contains('is-allplaque') || !!plaques.querySelector('.pl.is-hot, .pl.is-peek'));
      }
      /* 켜고 끄는 것은 오브젝트가 아니라 그 오브젝트의 명판이다 —
         오브젝트끼리의 앞뒤는 절대 바뀌지 않는다. */
      function setHot(el){
        if(hot === el) return;
        if(hot) hot._pl.classList.remove('is-hot');
        hot = el;
        if(hot) hot._pl.classList.add('is-hot');
        safe.classList.toggle('is-hit', !!hot);
        syncBubble();
      }
      safe.addEventListener('pointermove', function(e){
        if(e.pointerType && e.pointerType !== 'mouse') return;
        var t = e.timeStamp || 0;               /* 초당 30번까지만 — 마우스는 그보다 자주 움직인다 */
        if(t - lastMove < 30) return;
        lastMove = t;
        setHot(hitTest(e.clientX, e.clientY));
      });
      safe.addEventListener('pointerleave', function(){ setHot(null); });

      document.addEventListener('click', function(e){
        var inSafe = e.target.closest && e.target.closest('.safe') && !e.target.closest('.hero');
        var el = inSafe ? hitTest(e.clientX, e.clientY) : null;
        var was = el && el.classList.contains('is-peek');
        objs.forEach(function(x){ x.classList.remove('is-peek'); x._pl.classList.remove('is-peek'); });
        if(el && !was){ el.classList.add('is-peek'); el._pl.classList.add('is-peek'); }
        syncBubble();
      });

      build(units);

      /* ?debug=1 — 32학기 검수용. 손으로 학습하지 않고 완료 상태를 오갈 수 있다 */
      function variant(state){
        return units.map(function(u){
          return { name:u.name, subs:u.subs.map(function(){ return state; }) };
        });
      }
      window.RMDebug && window.RMDebug.register({
        title: '행성 홈',
        actions: [
          { label:'전부 미완료 (홀로그램)', run: function(){ build(variant('todo')); } },
          { label:'중반 (기본)',           run: function(){ build(units); } },
          { label:'전부 완료 (실물)',      run: function(){ build(variant('done')); } },
          { label:'명판 전부 펴기',        run: function(){ safe.classList.toggle('is-allplaque'); syncBubble(); } }
        ]
      });

      var toast = document.getElementById('toast'), tt;
      function showToast(m){ toast.textContent=m; toast.classList.add('show');
        clearTimeout(tt); tt=setTimeout(function(){ toast.classList.remove('show'); },1900); }

      document.querySelectorAll('[data-go]').forEach(function(b){
        b.addEventListener('click', function(){ location.href = b.getAttribute('data-go'); });
      });
      document.getElementById('ctaBtn').addEventListener('click', function(){
        location.href = 'nav/curriculum.html?subject=' + subject + '&sem=' + sem;
      });
      // 메뉴 → 공용 사이드 드로어 (gnb-drawer.js가 #menuBtn에 자동 바인딩)
    })();
  </script>
  <script src="scripts/gnb-drawer.js?v=7"></script>
</body>
</html>
