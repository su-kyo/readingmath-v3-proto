<!DOCTYPE html>
<html lang="ko" data-section="space">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자유 모드 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <link rel="stylesheet" href="styles/tokens.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/base.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/space-bg.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/gnb.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/nav.css?v=20261016-6" />
  <link rel="stylesheet" href="styles/screens/nav-freemode.css?v=20261016-6" />
</head>
<body>
  <div class="spacebg" data-stars="170"></div>
  <div class="app">
    <header class="gnb">
      <div class="gnb__info"><span class="gnb__logo"></span><span class="gnb__name">김학생</span></div>
      <nav class="gnb__modes">
        <button class="gnb__mode m-basic" data-go="nav/home.html">기본 모드</button>
        <button class="gnb__mode m-free is-active">자유 모드</button>
        <button class="gnb__mode m-exam" data-go="exam/home.html">시험 대비</button>
        <button class="gnb__mode m-assign" data-go="assignment/home.html">과제 센터<span class="gnb__mode__dot"></span></button>
      </nav>
      <div class="gnb__icons">
        <button class="gnb__ico" title="도움말"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" /></svg></button>
        <button class="gnb__ico" title="오류 신고"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 1 1 10 0v6" /><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z" /><path d="M21 12h1" /><path d="M18.5 4.5 18 5" /><path d="M2 12h1" /><path d="M12 2v1" /><path d="m4.929 4.929.707.707" /><path d="M12 12v6" /></svg></button>
        <button class="gnb__ico" title="공지사항"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z" /><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6" /></svg><span class="gnb__dot"></span></button>
        <button class="gnb__ico" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg></button>
      </div>
    </header>

    <div class="fm">
      <div class="fm__label" id="univLabel"><b>초등 우주</b> · 학기별 보기</div>

      <div class="fm__top">
        <div class="segmented" id="segmented">
          <button class="is-on" data-v="semester">학기</button>
          <button data-v="strand">계통</button>
        </div>
        <label class="switch">
          <span class="switch__l">모두보기</span>
          <span class="switch__t" id="allSwitch"><span class="switch__k"></span></span>
        </label>
      </div>

      <div class="carousel">
        <button class="cbtn cbtn--l" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg></button>
        <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
        <button class="cbtn cbtn--r" id="nextBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg></button>
      </div>

      <div class="allview" id="allView"></div>

      <div class="detail" id="detail">
        <div class="detail__head"><span class="detail__ttl" id="detailTtl">초등 3학년 1학기</span>
          <button class="detail__x" id="detailX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button></div>
        <div class="detail__list" id="detailList"></div>
      </div>

      <button class="fm__univ" id="univBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg>
        <span id="univBtnL">중고등 우주로</span>
      </button>
    </div>
  </div>

  <div class="umodal" id="uModal">
    <div class="umodal__box">
      <div class="umodal__head"><span class="umodal__ttl">대단원</span>
        <button class="umodal__x" id="uModalX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button></div>
      <div class="umodal__list" id="uModalList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="scripts/space-bg.js?v=20261016-6"></script>
  <script src="scripts/subject.js?v=20261016-6"></script>
  <script src="scripts/nav-freemode.js?v=20261016-6"></script>
  <script src="scripts/gnb-drawer.js?v=20261016-6"></script>
</body>
</html>
