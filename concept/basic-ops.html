<!DOCTYPE html>
<html lang="ko" data-section="concept" data-theme="light">
<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기초 연산 · 개념 훈련 — 리딩수학과학</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gnb/logo.svg" />
  <link rel="stylesheet" href="styles/tokens.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/base.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/components.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/learn-shell.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/keypad.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/screens/concept-basic-ops.css?v=20261015-13" />
  <link rel="stylesheet" href="styles/scratchpad.css?v=20261015-13" />
</head>
<body class="learn-body">
  <div class="screen">
    <div class="screen__bg"></div>

    <div class="screen__container">
      <header class="lheader">
        <nav class="breadcrumb">
          <span class="crumb crumb--strong">수학 초등 4-1</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong crumb--clip crumb--hide">3단원 곱셈과 나눗셈</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--hide">(2) 세 자리 수의 계산</span>
          <svg class="sep crumb--hide" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb">개념 훈련</span>
          <svg class="sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="crumb crumb--strong">기초 연산</span>
        </nav>
        <div class="lheader__actions">
          <button class="theme-toggle" id="themeToggle" title="라이트/다크 전환"><span class="theme-toggle__knob"></span></button>
          <button class="nav-ico" title="알림"><img src="assets/icons/ico-siren.svg" alt="알림" /></button>
          <button class="nav-ico" title="나가기"><img src="assets/icons/ico-exit.svg" alt="나가기" /></button>
        </div>
      </header>

      <main class="content">
        <div class="progress-cap" id="progress"></div>
        <div class="ops-wrap">
          <div class="ops" id="opsScroll">
            <div class="q" id="q"></div>
          </div>
        </div>
        <div class="ops__foot">
          <button class="btn-grade" id="gradeBtn" disabled>채점하기</button>
        </div>
      </main>
    </div>

    <!-- 계산기 키패드 (주관식) — 안은 scripts/keypad.js가 채운다 -->
    <div class="keypad keypad--float" id="keypad" role="dialog" aria-label="숫자 입력"></div>

    <!-- 하단 콘솔 바 -->
    <div class="bar">
      <img class="bar__deco bar__deco--l" src="assets/icons/console/console-right.svg" alt="" />
      <div class="bar__mid">
        <div class="bar__tray">
          <div class="bar__group">
            <button class="toolbtn"><img src="assets/icons/ico-note.svg" alt="" /><span>연습장</span></button>
          </div>
          <div class="bar__group">
            <button class="toolbtn toolbtn--primary" id="nextStepBtn" disabled title="마지막 문제까지 풀면 활성화돼요"><img src="assets/icons/ico-summary.svg" alt="" /><span>결과보기</span></button>
          </div>
        </div>
      </div>
      <img class="bar__deco bar__deco--r" src="assets/icons/console/console-left.svg" alt="" />
    </div>
  </div>

  <!-- 검수용 디버그 패널 (?debug=1 일 때만 보임) -->
  <!-- 연습장 캔버스 (공용) -->
  <script src="scripts/scratchpad.js?v=20261015-13"></script>
  <script src="scripts/debug-panel.js?v=20261015-13"></script>
  <!-- 키패드 물리 키보드 입력 (공용) -->
  <script src="scripts/keypad.js?v=20261015-13"></script>
  <script src="scripts/keypad-input.js?v=20261015-13"></script>
  <script src="scripts/learn-basic-ops.js?v=20261015-13"></script>
  <script src="scripts/learn-exit.js?v=20261015-13"></script>
</body>
</html>
